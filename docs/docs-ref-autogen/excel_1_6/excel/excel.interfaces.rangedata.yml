### YamlMime:TSType
name: Excel.Interfaces.RangeData
uid: excel!Excel.Interfaces.RangeData:interface
package: excel!
fullName: Excel.Interfaces.RangeData
summary: Uma interface que descreve os dados retornados chamando `range.toJSON()`<!-- -->.
remarks: ''
isPreview: false
isDeprecated: false
type: interface
properties:
- name: address
  uid: excel!Excel.Interfaces.RangeData#address:member
  package: excel!
  fullName: address
  summary: Especifica a referência de intervalo no estilo A1. O valor do endereço contém a referência da planilha (por exemplo, "Sheet1! A1:B4").
  remarks: '\[[Conjunto de API: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'address?: string;'
    return:
      type: string
- name: addressLocal
  uid: excel!Excel.Interfaces.RangeData#addressLocal:member
  package: excel!
  fullName: addressLocal
  summary: Representa a referência de intervalo para o intervalo especificado no idioma do usuário.
  remarks: '\[[Conjunto de API: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'addressLocal?: string;'
    return:
      type: string
- name: cellCount
  uid: excel!Excel.Interfaces.RangeData#cellCount:member
  package: excel!
  fullName: cellCount
  summary: Especifica o número de células no intervalo. Essa API retornará -1 se a contagem de células exceder 2^31-1 (2.147.483.647).
  remarks: '\[[Conjunto de API: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'cellCount?: number;'
    return:
      type: number
- name: columnCount
  uid: excel!Excel.Interfaces.RangeData#columnCount:member
  package: excel!
  fullName: columnCount
  summary: Especifica o número total de colunas no intervalo.
  remarks: '\[[Conjunto de API: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'columnCount?: number;'
    return:
      type: number
- name: columnHidden
  uid: excel!Excel.Interfaces.RangeData#columnHidden:member
  package: excel!
  fullName: columnHidden
  summary: Representa se todas as colunas no intervalo atual estão ocultas. O valor `true` é quando todas as colunas em um intervalo são ocultas. O valor `false` é quando nenhuma coluna no intervalo está oculta. O valor `null` é quando algumas colunas em um intervalo são ocultas e outras colunas no mesmo intervalo não são ocultas.
  remarks: '\[[Conjunto de API: ExcelApi 1.2](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'columnHidden?: boolean;'
    return:
      type: boolean
- name: columnIndex
  uid: excel!Excel.Interfaces.RangeData#columnIndex:member
  package: excel!
  fullName: columnIndex
  summary: Especifica o número da coluna da primeira célula no intervalo. Indexados com zero.
  remarks: '\[[Conjunto de API: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'columnIndex?: number;'
    return:
      type: number
- name: conditionalFormats
  uid: excel!Excel.Interfaces.RangeData#conditionalFormats:member
  package: excel!
  fullName: conditionalFormats
  summary: A coleção de `ConditionalFormats` que intercepta o intervalo.
  remarks: '\[[Conjunto de API: ExcelApi 1.6](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'conditionalFormats?: Excel.Interfaces.ConditionalFormatData[];'
    return:
      type: <xref uid="excel!Excel.Interfaces.ConditionalFormatData:interface" />[]
- name: format
  uid: excel!Excel.Interfaces.RangeData#format:member
  package: excel!
  fullName: format
  summary: Retorna um objeto de formato que encapsula a fonte, o preenchimento, as bordas, o alinhamento e outras propriedades do intervalo.
  remarks: '\[[Conjunto de API: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'format?: Excel.Interfaces.RangeFormatData;'
    return:
      type: <xref uid="excel!Excel.Interfaces.RangeFormatData:interface" />
- name: formulas
  uid: excel!Excel.Interfaces.RangeData#formulas:member
  package: excel!
  fullName: formulas
  summary: Representa a fórmula em notação A1. Se uma célula não tiver fórmula, seu valor será retornado.
  remarks: '\[[Conjunto de API: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'formulas?: any[][];'
    return:
      type: any[][]
- name: formulasLocal
  uid: excel!Excel.Interfaces.RangeData#formulasLocal:member
  package: excel!
  fullName: formulasLocal
  summary: Representa a fórmula em notação A1, na formatação de número da localidade e no idioma do usuário. Por exemplo, a fórmula "=SUM(A1, 1.5)" em inglês seria "=SOMA(A1; 1,5)" em português. Se uma célula não tiver fórmula, seu valor será retornado.
  remarks: '\[[Conjunto de API: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'formulasLocal?: any[][];'
    return:
      type: any[][]
- name: formulasR1C1
  uid: excel!Excel.Interfaces.RangeData#formulasR1C1:member
  package: excel!
  fullName: formulasR1C1
  summary: Representa a fórmula em notação no estilo L1C1. Se uma célula não tiver fórmula, seu valor será retornado.
  remarks: '\[[Conjunto de API: ExcelApi 1.2](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'formulasR1C1?: any[][];'
    return:
      type: any[][]
- name: hidden
  uid: excel!Excel.Interfaces.RangeData#hidden:member
  package: excel!
  fullName: hidden
  summary: Representa se todas as células no intervalo atual estão ocultas. O valor `true` é quando todas as células em um intervalo são ocultas. O valor `false` é quando nenhuma célula no intervalo está oculta. Valor é `null` quando algumas células em um intervalo são ocultas e outras células no mesmo intervalo não são ocultas.
  remarks: '\[[Conjunto de API: ExcelApi 1.2](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'hidden?: boolean;'
    return:
      type: boolean
- name: numberFormat
  uid: excel!Excel.Interfaces.RangeData#numberFormat:member
  package: excel!
  fullName: numberFormat
  summary: Representa Excel código de formato de número para o intervalo determinado.
  remarks: '\[[Conjunto de API: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'numberFormat?: any[][];'
    return:
      type: any[][]
- name: rowCount
  uid: excel!Excel.Interfaces.RangeData#rowCount:member
  package: excel!
  fullName: rowCount
  summary: Retorna o número total de linhas no intervalo.
  remarks: '\[[Conjunto de API: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'rowCount?: number;'
    return:
      type: number
- name: rowHidden
  uid: excel!Excel.Interfaces.RangeData#rowHidden:member
  package: excel!
  fullName: rowHidden
  summary: Representa se todas as linhas no intervalo atual estão ocultas. O valor `true` é quando todas as linhas em um intervalo são ocultas. O valor `false` é quando nenhuma linha no intervalo está oculta. O valor `null` é quando algumas linhas em um intervalo são ocultas e outras linhas no mesmo intervalo não são ocultas.
  remarks: '\[[Conjunto de API: ExcelApi 1.2](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'rowHidden?: boolean;'
    return:
      type: boolean
- name: rowIndex
  uid: excel!Excel.Interfaces.RangeData#rowIndex:member
  package: excel!
  fullName: rowIndex
  summary: Representa o número de linhas da primeira célula no intervalo. Indexados com zero.
  remarks: '\[[Conjunto de API: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'rowIndex?: number;'
    return:
      type: number
- name: text
  uid: excel!Excel.Interfaces.RangeData#text:member
  package: excel!
  fullName: text
  summary: Valores de texto do intervalo especificado. O valor de texto não depende da largura da célula. A substituição de sinal de número ( ) que acontece na interface do usuário Excel não afetará o valor de texto retornado \# pela API.
  remarks: '\[[Conjunto de API: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'text?: string[][];'
    return:
      type: string[][]
- name: values
  uid: excel!Excel.Interfaces.RangeData#values:member
  package: excel!
  fullName: values
  summary: Representa os valores brutos do intervalo especificado. Os dados retornados podem ser uma cadeia de caracteres, número ou booleano. Células que contêm um erro retornarão a cadeia de caracteres de erro. Se o valor retornado começar com um sinal de mais ("+"), menos ("-"), ou igual ("="), Excel interpretará esse valor como uma fórmula.
  remarks: '\[[Conjunto de API: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'values?: any[][];'
    return:
      type: any[][]
- name: valueTypes
  uid: excel!Excel.Interfaces.RangeData#valueTypes:member
  package: excel!
  fullName: valueTypes
  summary: Especifica o tipo de dados em cada célula.
  remarks: '\[[Conjunto de API: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'valueTypes?: Excel.RangeValueType[][];'
    return:
      type: <xref uid="excel!Excel.RangeValueType:enum" />[][]
