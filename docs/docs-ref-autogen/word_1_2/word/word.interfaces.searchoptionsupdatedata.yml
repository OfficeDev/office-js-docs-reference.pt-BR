- name: ignorePunct
  uid: word!Word.Interfaces.SearchOptionsUpdateData#ignorePunct:member
  package: word!
  fullName: ignorePunct
  summary: Obtém ou define um valor que determina quando ignorar todos os caracteres de pontuação entre as palavras. Corresponde à caixa de seleção "Ignorar caracteres de pontuação", na caixa de diálogo "Localizar e substituir".
