  isPreview: false
  isDeprecated: false
  syntax:
    content: 'ignorePunct?: boolean;'
    return:
      type: boolean
- name: ignoreSpace
  uid: word!Word.Interfaces.SearchOptionsUpdateData#ignoreSpace:member
  package: word!
  fullName: ignoreSpace
  summary: Obtém ou define um valor que indica se deve ignorar todo o espaço em branco entre palavras. Corresponde à caixa de seleção Ignorar caracteres de espaço em branco na caixa de diálogo Encontrar e Substituir.
  remarks: '\[[Conjunto de API: WordApi 1.1](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'ignoreSpace?: boolean;'
    return:
      type: boolean
- name: matchCase
  uid: word!Word.Interfaces.SearchOptionsUpdateData#matchCase:member
  package: word!
  fullName: matchCase
  summary: Obtém ou define um valor que determina quando realizar uma pesquisa que diferencia maiúsculas de minúsculas. Corresponde à caixa de seleção Caso de match na caixa de diálogo Encontrar e Substituir.
  remarks: '\[[Conjunto de API: WordApi 1.1](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'matchCase?: boolean;'
    return:
      type: boolean
- name: matchPrefix
  uid: word!Word.Interfaces.SearchOptionsUpdateData#matchPrefix:member
  package: word!
  fullName: matchPrefix
  summary: Obtém ou define um valor que determina quando fazer correspondência com as palavras que começam com a cadeia de caracteres da pesquisa. Corresponde à caixa de seleção "Coincidir prefixo", na caixa de diálogo "Localizar e substituir".
  remarks: '\[[Conjunto de API: WordApi 1.1](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'matchPrefix?: boolean;'
    return:
      type: boolean
- name: matchSuffix
  uid: word!Word.Interfaces.SearchOptionsUpdateData#matchSuffix:member
  package: word!
  fullName: matchSuffix
  summary: Obtém ou define um valor que determina quando fazer correspondência com as palavras que terminam com a cadeia de caracteres da pesquisa. Corresponde à caixa de seleção "Coincidir sufixo", na caixa de diálogo "Localizar e substituir".
  remarks: '\[[Conjunto de API: WordApi 1.1](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]'
  isPreview: false
