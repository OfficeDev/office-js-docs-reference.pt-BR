### YamlMime:TSType
name: Office.DelayDeliveryTime
uid: outlook!Office.DelayDeliveryTime:interface
package: outlook!
fullName: Office.DelayDeliveryTime
summary: O objeto permite gerenciar a data e a hora de entrega `DelayDeliveryTime` atrasadas de uma mensagem.
remarks: >-
  \[[Conjunto de API: Visualização de caixa de correio](/office/dev/add-ins/reference/requirement-sets/outlook-api-requirement-sets) \]


  **[Nível mínimo de permissão](https://docs.microsoft.com/office/dev/add-ins/outlook/understanding-outlook-add-in-permissions) <!-- -->**:`ReadItem`


  **[Modo Outlook aplicável](https://docs.microsoft.com/office/dev/add-ins/outlook/outlook-add-ins-overview#extension-points) <!-- -->**: Redação


  #### <a name="examples"></a>Exemplos


  ```javascript

  var date_1 = new Date();

  var date_2 = new Date(date_1.getTime() + 2*60000);  // Sending with 2-minute delay.

  Office.context.mailbox.item.delayDeliveryTime.setAsync(
      date_2,
      function(callback) {
          console.log(callback);
      });
  ```
isPreview: true
isDeprecated: false
type: interface
