### YamlMime:TSType
name: Excel.WorksheetProtectionChangedEventArgs
uid: excel!Excel.WorksheetProtectionChangedEventArgs:interface
package: excel!
fullName: Excel.WorksheetProtectionChangedEventArgs
summary: Fornece informações sobre a planilha que aumentou o evento de alteração do status de proteção, que dispara quando o status de proteção é atualizado em uma planilha.
remarks: '\[[Conjunto de API: ExcelApi 1.14](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
isPreview: false
isDeprecated: false
type: interface
properties:
- name: isProtected
  uid: excel!Excel.WorksheetProtectionChangedEventArgs#isProtected:member
  package: excel!
  fullName: isProtected
  summary: Obtém o status de proteção atual da planilha.
  remarks: >-
    \[[Conjunto de API: ExcelApi 1.14](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]


    #### <a name="examples"></a>Exemplos


    ```typescript

    // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/excel/30-events/events-worksheet-protection.yaml

    async function checkProtection(event: Excel.WorksheetProtectionChangedEventArgs) {
        await Excel.run(async (context) => {
            // This method is an event handler that returns the protection status of a worksheet and information about the changed worksheet.
            const protectionStatus = event.isProtected;
            const worksheetId = event.worksheetId;
            const source = event.source;
            console.log("Protection status changed. Protection status is now: " + protectionStatus + ".");
            console.log("    ID of changed worksheet: " + worksheetId + ".");
            console.log("    Source of change event: " + source + ".");
        });
    }

    ```
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'isProtected: boolean;'
    return:
      type: boolean
