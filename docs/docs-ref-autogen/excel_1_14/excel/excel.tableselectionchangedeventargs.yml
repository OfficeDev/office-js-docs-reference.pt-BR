  fullName: isInsideTable
  summary: Especifica se a seleção está dentro de uma tabela. `IsInsideTable` deve ser definido como `true` para que o endereço seja útil.
  remarks: '\[[Conjunto de API: ExcelApi 1.7](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'isInsideTable: boolean;'
    return:
      type: boolean
