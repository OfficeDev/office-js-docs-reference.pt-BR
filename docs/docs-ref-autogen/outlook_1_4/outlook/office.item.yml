### YamlMime:TSType
name: Office.Item
uid: outlook!Office.Item:interface
package: outlook!
fullName: Office.Item
summary: >-
  O namespace do item é usado para acessar a mensagem, a solicitação de reunião ou o compromisso selecionado no momento. Você pode determinar o tipo do item usando a `itemType` propriedade.


  Para ver a lista de membros completa, consulte a página [Modelo de](https://docs.microsoft.com/javascript/api/requirement-sets/outlook/requirement-set-1.4/office.context.mailbox.item) Objeto.


  Se você quiser ver o IntelliSense apenas para um tipo ou modo específico, caste este item para um dos seguintes:


  - [AppointmentCompose](xref:outlook!Office.AppointmentCompose:interface)


  - [AppointmentRead](xref:outlook!Office.AppointmentRead:interface)


  - [MessageCompose](xref:outlook!Office.MessageCompose:interface)


  - [MessageRead](xref:outlook!Office.MessageRead:interface)
remarks: >-
  **[Nível mínimo de permissão](https://docs.microsoft.com/office/dev/add-ins/outlook/understanding-outlook-add-in-permissions)<!-- -->**: `Restricted`


