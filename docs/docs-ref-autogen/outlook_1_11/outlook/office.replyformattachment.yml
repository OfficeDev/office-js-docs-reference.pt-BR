### YamlMime:TSType
name: Office.ReplyFormAttachment
uid: outlook!Office.ReplyFormAttachment:interface
package: outlook!
fullName: Office.ReplyFormAttachment
summary: Um anexo de arquivo ou item. Usado ao exibir um formulário de resposta.
remarks: ''
isPreview: false
isDeprecated: false
type: interface
properties:
- name: inLine
  uid: outlook!Office.ReplyFormAttachment#inLine:member
  package: outlook!
  fullName: inLine
  summary: Usado somente se o tipo estiver definido como arquivo. Se true, indica que o anexo será mostrado em linha no corpo da mensagem e não deve ser exibido na lista de anexos.
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'inLine?: boolean;'
    return:
      type: boolean
- name: itemId
  uid: outlook!Office.ReplyFormAttachment#itemId:member
  package: outlook!
  fullName: itemId
  summary: Usado somente se o tipo for definido como item. A ID do item do EWS do anexo. Isso é uma cadeia de até 100 caracteres.
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'itemId?: string;'
    return:
      type: string
- name: name
  uid: outlook!Office.ReplyFormAttachment#name:member
  package: outlook!
  fullName: name
  summary: Uma cadeia de caracteres que contém o nome do anexo, até 255 caracteres de comprimento.
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'name: string;'
    return:
      type: string
- name: type
  uid: outlook!Office.ReplyFormAttachment#type:member
  package: outlook!
  fullName: type
  summary: Indica o tipo de anexo. Deve ser um arquivo para um anexo de arquivo ou item para um anexo de item.
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'type: string;'
    return:
      type: string
- name: url
  uid: outlook!Office.ReplyFormAttachment#url:member
  package: outlook!
  fullName: url
  summary: >-
    Usado somente se o tipo estiver definido como arquivo. O URI do local para o arquivo.


    **Importante**: esse link deve estar acessível publicamente, sem a necessidade de autenticação por Exchange Online servidores. No entanto, com a Exchange local, o link pode ser acessível em uma rede privada, desde que não precise de autenticação posterior.
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'url?: string;'
    return:
      type: string
