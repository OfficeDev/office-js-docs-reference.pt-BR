### YamlMime:TSType
name: Visio.DocumentLoadCompleteEventArgs
uid: visio!Visio.DocumentLoadCompleteEventArgs:interface
package: visio!
fullName: Visio.DocumentLoadCompleteEventArgs
summary: >-
  Fornece informações sobre o sucesso ou a falha do evento DocumentLoadComplete.


  \[[Conjunto de API: 1.1](/office/dev/add-ins/reference/overview/visio-javascript-reference-overview) \]
remarks: "\n\n#### <a name=\"examples\"></a>Exemplos\n\n```javascript\nVisio.run(session, function (ctx) {\n    var document1 = ctx.document;\n    eventResult1 = document1.onDocumentLoadComplete.add(\n        function (args){\n            console.log(\"Document Loaded\");\n        });\n\n    return ctx.sync().then(function () {\n        console.log(\"Success\");\n    });\n}).catch(function(error) {\n    console.log(\"Error: \" + error);\n    if (error instanceof OfficeExtension.Error) {\n        console.log(\"Debug info: \" + JSON.stringify(error.debugInfo));\n    }\n});\n```"
isPreview: false
isDeprecated: false
