- name: setActivePage(PageName)
  uid: visio!Visio.Document#setActivePage:member(1)
  package: visio!
  fullName: setActivePage(PageName)
  summary: >-
    De definir a página ativa do documento.


    \[[Conjunto de API: 1.1](/office/dev/add-ins/reference/overview/visio-javascript-reference-overview) \]
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'setActivePage(PageName: string): void;'
    parameters:
    - id: PageName
      description: Nome da página
      type: string
    return:
      type: void
      description: "\n\n#### <a name=\"examples\"></a>Exemplos\n\n```javascript\nVisio.run(session, function (ctx) {\n    var document = ctx.document;\n    var pageName = \"Page-1\";\n    document.setActivePage(pageName);\n    return ctx.sync();\n}).catch(function(error) {\n    console.log(\"Error: \" + error);\n    if (error instanceof OfficeExtension.Error) {\n        console.log(\"Debug info: \" + JSON.stringify(error.debugInfo));\n    }\n});\n```"
- name: showTaskPane(taskPaneType, initialProps, show)
  uid: visio!Visio.Document#showTaskPane:member(1)
  package: visio!
  fullName: showTaskPane(taskPaneType, initialProps, show)
  summary: >-
    Mostrar ou ocultar um TaskPane. Isso será consumido pelo DV Excel Add-In/Other third-party apps que incorporarem o desenho do visio para mostrar/ocultar o painel de tarefas.


    \[[Conjunto de API: 1.1](/office/dev/add-ins/reference/overview/visio-javascript-reference-overview) \]
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'showTaskPane(taskPaneType: Visio.TaskPaneType, initialProps?: any, show?: boolean): void;'
    parameters:
    - id: taskPaneType
      description: Tipo do TaskPane da 1ª Parte. Ele pode levar valores do enum TaskPaneType.
      type: <xref uid="visio!Visio.TaskPaneType:enum" />
    - id: initialProps
      description: Parâmetro Opcional. Esta é uma estrutura de dados genérica que seria preenchida com os dados iniciais necessários para inicializar o conteúdo do Taskpane.
      type: any
    - id: show
      description: Parâmetro Opcional. Se estiver definido como false, ele ocultará o conjunto de tarefas especificado.
      type: boolean
    return:
      type: void
      description: ''
