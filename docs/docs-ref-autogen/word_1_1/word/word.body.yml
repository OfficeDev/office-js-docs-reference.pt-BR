- name: font
  uid: word!Word.Body#font:member
  package: word!
  fullName: font
  summary: Obtém o formato de texto do corpo. Use isto para obter e definir o nome, o tamanho e a cor da fonte, além de outras propriedades. Somente leitura.
  remarks: "\\[[Conjunto de API: WordApi 1.1](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>Exemplos\n\n```typescript\n// Get the style and the font size, font name, and font color properties on the body object.\n// Run a batch operation against the Word object model.\nawait Word.run(async (context) => {\n\n    // Create a proxy object for the document body.\n    var body = context.document.body;\n\n    // Queue a command to load font and style information for the document body.\n    context.load(body, 'font/size, font/name, font/color, style');\n\n    // Synchronize the document state by executing the queued commands,\n    // and return a promise to indicate task completion.\n    await context.sync();\n    \n    // Show the results of the load method.\n    // Here we show the property values on the body object.\n    var results = 'Font size: ' + body.font.size +\n                    '; Font name: ' + body.font.name +\n                    '; Font color: ' + body.font.color +\n                    '; Body style: ' + body.style;\n\n    console.log(results);\n});\n```"
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'readonly font: Word.Font;'
    return:
      type: <xref uid="word!Word.Font:class" />
