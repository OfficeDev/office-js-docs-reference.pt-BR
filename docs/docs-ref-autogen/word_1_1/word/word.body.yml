- name: text
  uid: word!Word.Body#text:member
  package: word!
  fullName: text
  summary: Obtém o texto do corpo. Usa o método insertText para inserir texto. Somente leitura.
  remarks: >-
    \[[Conjunto de API: WordApi 1.1](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]


    #### <a name="examples"></a>Exemplos


    ```typescript

    // Get the text property on the body object

    // Run a batch operation against the Word object model.

    await Word.run(async (context) => {

        // Create a proxy object for the document body.
        var body = context.document.body;

        // Queue a command to load the text in document body.
        context.load(body, 'text');

        // Synchronize the document state by executing the queued commands,
        // and return a promise to indicate task completion.
        await context.sync();
        console.log("Body contents: " + body.text);
    });

    ```
