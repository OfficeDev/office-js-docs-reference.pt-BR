- name: highlightColor
  uid: word!Word.Font#highlightColor:member
  package: word!
  fullName: highlightColor
  summary: "Obtém ou define a cor de realçada. Para defini-lo, use um valor no formato '\\#RRGGBB' ou no nome da cor. Para remover a cor do realçada, de defini-la como nula. A cor de realçamento retornada pode estar no formato '\\#RRGGBB', uma cadeia de caracteres vazia para cores de realçamento misturadas ou nulo para nenhuma cor de realçamento. *Observação**: Somente as cores de realçamento padrão estão disponíveis no Office para Windows Desktop. Eles são \"Yellow\", \"Lime\", \"Turquoise\", \"Pink\", \"Blue\", \"Red\", \"DarkBlue\", \"Teal\", \"Green\", \"Purple\", \"DarkRed\", \"Olive\", \"Gray\", \"LightGray\" e \"Black\". Quando o complemento é executado no Office para Windows Desktop, qualquer outra cor é convertida para a cor mais próxima quando aplicada à fonte."
  remarks: >-
    \[[Conjunto de API: WordApi 1.1](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]


    #### <a name="examples"></a>Exemplos


    ```typescript

    // Highlight selected text

    // Run a batch operation against the Word object model.

    await Word.run(async (context) => {

        // Create a range proxy object for the current selection.
        var selection = context.document.getSelection();

        // Queue a command to highlight the current selection.
        selection.font.highlightColor = '#FFFF00'; // Yellow

        // Synchronize the document state by executing the queued commands,
        // and return a promise to indicate task completion.
        await context.sync();
        console.log('The selection has been highlighted.');
    });

    ```
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'highlightColor: string;'
    return:
      type: string
