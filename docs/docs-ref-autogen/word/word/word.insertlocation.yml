### YamlMime:TSEnum
name: Word.InsertLocation
uid: word!Word.InsertLocation:enum
package: word!
fullName: Word.InsertLocation
summary: Os tipos de local de inserção
remarks: >-
  \[[Conjunto de API: WordApi 1.1](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]


  Para ser usado com uma chamada de API, `obj.insertSomething(newStuff, location);` como Se o local for "Before" ou "After", o novo conteúdo ficará fora do objeto modificado. Se o local for "Start" ou "End", o novo conteúdo será incluído como parte do objeto modificado.
isPreview: false
isDeprecated: false
fields:
