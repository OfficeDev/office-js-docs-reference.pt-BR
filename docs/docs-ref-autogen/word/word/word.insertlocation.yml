  value: "\"Before\""
- name: end
  uid: word!Word.InsertLocation.end:member
  package: word!
  summary: Anexar conteúdo ao conteúdo do objeto de chamada.
  value: "\"End\""
- name: replace
  uid: word!Word.InsertLocation.replace:member
  package: word!
  summary: Substitua o conteúdo do objeto atual.
  value: "\"Replace\""
- name: start
  uid: word!Word.InsertLocation.start:member
  package: word!
  summary: Prepend content to the contents of the calling object.
  value: "\"Start\""
