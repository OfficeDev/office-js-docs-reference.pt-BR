### YamlMime:TSType
name: Word.CommentCollection
uid: word!Word.CommentCollection:class
package: word!
fullName: Word.CommentCollection
summary: Contém uma coleção de [objetos Word.Comment](xref:word!Word.Comment:class) .
remarks: '\[[Conjunto de API: WordApiOnline BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]'
isPreview: true
isDeprecated: false
type: class
properties:
- name: context
  uid: word!Word.CommentCollection#context:member
  package: word!
  fullName: context
  summary: O contexto de solicitação associado ao objeto. Isso conecta o processo do Office do aplicativo host.
  remarks: ''
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'context: RequestContext;'
    return:
      type: <xref uid="word!Word.RequestContext:class" />
- name: items
  uid: word!Word.CommentCollection#items:member
  package: word!
  fullName: items
  summary: Obtém os itens filhos carregados nesta coleção.
  remarks: ''
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'readonly items: Word.Comment[];'
    return:
      type: <xref uid="word!Word.Comment:class" />[]
      description: "\n\n#### <a name=\"examples\"></a>Exemplos\n\n```typescript\n// Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/word/99-preview-apis/manage-comments.yaml\nawait Word.run(async (context) => {\n  let text = $(\"#reply-text\")\n    .val()\n    .toString();\n  let comments = context.document.getSelection().getComments();\n  comments.load(\"items\");\n  await context.sync();\n  let firstActiveComment = comments.items.find((item) => item.resolved !== true);\n  if (firstActiveComment) {\n    let reply = firstActiveComment.reply(text);\n    console.log(\"Reply added\");\n  } else {\n    console.log(\"No active comment was found in the selection so couldn't reply.\");\n  }\n});\n```"
methods:
- name: getFirst()
  uid: word!Word.CommentCollection#getFirst:member(1)
  package: word!
  fullName: getFirst()
  summary: Obtém o primeiro comentário na coleção. Ocorre um erro se essa coleção estiver vazia.
  remarks: >-
    \[[Conjunto de API: WordApiOnline BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]


    #### <a name="examples"></a>Exemplos


    ```typescript

    // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/word/99-preview-apis/manage-comments.yaml

    await Word.run(async (context) => {
      let range = context.document
        .getSelection()
        .getComments()
        .getFirst()
        .getRange();
      range.load("text");
      await context.sync();

      console.log(`Comment location: ${range.text}`);
    });

    ```
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'getFirst(): Word.Comment;'
    return:
      type: <xref uid="word!Word.Comment:class" />
      description: ''
