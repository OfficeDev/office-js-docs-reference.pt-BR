methods:
- name: getFirst()
  uid: word!Word.NoteItemCollection#getFirst:member(1)
  package: word!
  fullName: getFirst()
  summary: Obtém o primeiro item de anotação nesta coleção. Ocorre um erro se essa coleção estiver vazia.
  remarks: >-
    \[[Conjunto de API: WordApiOnline BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]


    #### <a name="examples"></a>Exemplos


    ```typescript

    // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/word/99-preview-apis/manage-footnotes.yaml

    await Word.run(async (context) => {
      let reference = context.document.body.footnotes.getFirst().reference;
      reference.select();
      console.log("The first footnote is selected.");
    });

    ```
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'getFirst(): Word.NoteItem;'
    return:
      type: <xref uid="word!Word.NoteItem:class" />
      description: ''
