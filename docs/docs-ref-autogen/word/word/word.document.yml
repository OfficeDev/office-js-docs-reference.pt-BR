- name: save()
  uid: word!Word.Document#save:member(1)
  package: word!
  fullName: save()
  summary: Salva o documento. Isso usa a convenção de nomenis de arquivo padrão do Word se o documento não tiver sido salvo antes.
  remarks: "\\[[Conjunto de API: WordApi 1.1](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>Exemplos\n\n```typescript\n// Run a batch operation against the Word object model.\nawait Word.run(async (context) => {\n    \n    // Create a proxy object for the document.\n    var thisDocument = context.document;\n\n    // Queue a command to load the document save state (on the saved property).\n    context.load(thisDocument, 'saved');    \n    \n    // Synchronize the document state by executing the queued commands, \n    // and return a promise to indicate task completion.\n    await context.sync();\n        \n    if (thisDocument.saved === false) {\n        // Queue a command to save this document.\n        thisDocument.save();\n        \n        // Synchronize the document state by executing the queued commands, \n        // and return a promise to indicate task completion.\n        await context.sync();\n        console.log('Saved the document');\n    } else {\n        console.log('The document has not changed since the last save.');\n    }\n    });\n```"
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'save(): void;'
    return:
      type: void
      description: ''
