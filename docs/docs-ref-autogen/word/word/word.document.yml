- name: getSelection()
  uid: word!Word.Document#getSelection:member(1)
  package: word!
  fullName: getSelection()
  summary: Obtém a seleção atual do documento. Não há suporte para várias seleções.
  remarks: "\\[[Conjunto de API: WordApi 1.1](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>Exemplos\n\n```typescript\n// Run a batch operation against the Word object model.\nawait Word.run(async (context) => {\n    \n    var textSample = 'This is an example of the insert text method. This is a method ' + \n        'which allows users to insert text into a selection. It can insert text into a ' +\n        'relative location or it can overwrite the current selection. Since the ' +\n        'getSelection method returns a range object, look up the range object documentation ' +\n        'for everything you can do with a selection.';\n    \n    // Create a range proxy object for the current selection.\n    var range = context.document.getSelection();\n    \n    // Queue a command to insert text at the end of the selection.\n    range.insertText(textSample, Word.InsertLocation.end);\n    \n    // Synchronize the document state by executing the queued commands, \n    // and return a promise to indicate task completion.\n    await context.sync();\n    console.log('Inserted the text at the end of the selection.');\n});  \n```"
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'getSelection(): Word.Range;'
    return:
      type: <xref uid="word!Word.Range:class" />
      description: ''
- name: load(options)
  uid: word!Word.Document#load:member(1)
  package: word!
  fullName: load(options)
  summary: Coloca um comando na fila para carregar as propriedades especificadas do objeto. Você deve chamar `context.sync()` antes de ler as propriedades.
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'load(options?: Word.Interfaces.DocumentLoadOptions): Word.Document;'
    parameters:
    - id: options
      description: Fornece opções para quais propriedades do objeto deve ser carregado.
      type: <xref uid="word!Word.Interfaces.DocumentLoadOptions:interface" />
    return:
      type: <xref uid="word!Word.Document:class" />
      description: "\n\n#### <a name=\"examples\"></a>Exemplos\n\n```typescript\n// Run a batch operation against the Word object model.\nawait Word.run(async (context) => {\n    \n    // Create a proxy object for the document.\n    var thisDocument = context.document;\n    \n    // Queue a command to load content control properties.\n    context.load(thisDocument, 'contentControls/id, contentControls/text, contentControls/tag');\n    \n    // Synchronize the document state by executing the queued commands, \n    // and return a promise to indicate task completion.\n    await context.sync();\n    if (thisDocument.contentControls.items.length !== 0) {\n        for (var i = 0; i < thisDocument.contentControls.items.length; i++) {\n            console.log(thisDocument.contentControls.items[i].id);\n            console.log(thisDocument.contentControls.items[i].text);\n            console.log(thisDocument.contentControls.items[i].tag);\n        }\n    } else {\n        console.log('No content controls in this document.');\n    }\n});\n```"
