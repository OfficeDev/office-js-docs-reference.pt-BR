- name: deleteAll()
  uid: word!Word.SettingCollection#deleteAll:member(1)
  package: word!
  fullName: deleteAll()
  summary: Exclui todas as configurações deste add-in.
  remarks: "\\[[Conjunto de API: WordApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>Exemplos\n\n```typescript\n// Run a batch operation against the Word object model.\nawait Word.run(async (context) => {\n\n    // Queue commands add a setting.\n    var settings = context.document.settings;\n    settings.add('startMonth', { month: 'March', year: 1998 });\n\n    // Queue a command to get the count of settings.\n    var count = settings.getCount();\n\n    // Synchronize the document state by executing the queued commands, \n    // and return a promise to indicate task completion.\n    await context.sync();\n    console.log(count.value);\n\n    // Queue a command to delete all settings.\n    settings.deleteAll();\n\n    // Queue a command to get the new count of settings.\n    count = settings.getCount();\n\n    // Synchronize the document state by executing the queued commands, \n    // and return a promise to indicate task completion.\n    await context.sync();\n    console.log(count.value);\n});\n```"
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'deleteAll(): void;'
    return:
      type: void
      description: ''
- name: getCount()
  uid: word!Word.SettingCollection#getCount:member(1)
  package: word!
  fullName: getCount()
  summary: Obtém a contagem de configurações.
  remarks: "\\[[Conjunto de API: WordApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>Exemplos\n\n```typescript\n// Run a batch operation against the Word object model.\nawait Word.run(async (context) => {\n\n    // Queue commands add a setting.\n    var settings = context.document.settings;\n    settings.add('startMonth', { month: 'March', year: 1998 });\n\n    // Queue a command to get the count of settings.\n    var count = settings.getCount();\n\n    // Synchronize the document state by executing the queued commands, \n    // and return a promise to indicate task completion.\n    await context.sync();\n    console.log(count.value);\n\n    // Queue a command to delete all settings.\n    settings.deleteAll();\n\n    // Queue a command to get the new count of settings.\n    count = settings.getCount();\n\n    // Synchronize the document state by executing the queued commands, \n    // and return a promise to indicate task completion.\n    await context.sync();\n    console.log(count.value);\n});\n```"
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'getCount(): OfficeExtension.ClientResult<number>;'
