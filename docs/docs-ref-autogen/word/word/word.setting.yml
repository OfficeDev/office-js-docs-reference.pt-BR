- name: toJSON()
  uid: word!Word.Setting#toJSON:member(1)
  package: word!
  fullName: toJSON()
  summary: Substitui o método JavaScript `toJSON()` para fornecer uma saída mais útil quando um objeto API é passado para `JSON.stringify()`<!-- -->. (`JSON.stringify`<!-- -->, por sua vez, chama o `toJSON` método do objeto que é passado a ele.) Enquanto o objeto Word.Setting original é um objeto API, `toJSON` o método retorna um objeto JavaScript simples (digitado como `Word.Interfaces.SettingData`<!-- -->) que contém cópias rasas de quaisquer propriedades filho carregadas do objeto original.
