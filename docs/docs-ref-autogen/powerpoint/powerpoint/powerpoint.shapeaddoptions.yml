properties:
- name: height
  uid: powerpoint!PowerPoint.ShapeAddOptions#height:member
  package: powerpoint!
  fullName: height
  summary: >-
    Especifica a altura, em pontos, da forma. Quando não for fornecido, um valor padrão será usado. Lança uma `InvalidArgument` exceção quando definido com um valor negativo.


    \[[Conjunto de API: PowerPointApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]
  remarks: ''
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'height?: number;'
    return:
      type: number
- name: left
  uid: powerpoint!PowerPoint.ShapeAddOptions#left:member
  package: powerpoint!
  fullName: left
  summary: >-
    Especifica a distância, em pontos, do lado esquerdo da forma até o lado esquerdo do slide. Quando não for fornecido, um valor padrão será usado.


    \[[Conjunto de API: PowerPointApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]
  remarks: ''
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'left?: number;'
    return:
      type: number
- name: top
  uid: powerpoint!PowerPoint.ShapeAddOptions#top:member
  package: powerpoint!
  fullName: top
  summary: >-
    Especifica a distância, em pontos, da borda superior da forma até a borda superior do slide. Quando não for fornecido, um valor padrão será usado.


    \[[Conjunto de API: PowerPointApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]
  remarks: ''
