name: PowerPoint.Interfaces.ShapeFillLoadOptions
uid: powerpoint!PowerPoint.Interfaces.ShapeFillLoadOptions:interface
package: powerpoint!
fullName: PowerPoint.Interfaces.ShapeFillLoadOptions
summary: >-
  Representa a formatação de preenchimento de um objeto shape.


  \[[Conjunto de API: PowerPointApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]
remarks: ''
