- name: foregroundColor
  uid: powerpoint!PowerPoint.Interfaces.ShapeFillLoadOptions#foregroundColor:member
  package: powerpoint!
  fullName: foregroundColor
  summary: Representa a cor de primeiro plano de preenchimento da forma no formato de cor HTML, no formato \# RRGGBB (por exemplo, "FFA500") ou como uma cor HTML nomeada (por exemplo, "laranja").
  remarks: '\[[Conjunto de API: PowerPointApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'foregroundColor?: boolean;'
    return:
      type: boolean
- name: transparency
  uid: powerpoint!PowerPoint.Interfaces.ShapeFillLoadOptions#transparency:member
  package: powerpoint!
  fullName: transparency
  summary: Especifica a porcentagem de transparência do preenchimento como um valor de 0,0 (opaco) a 1,0 (claro). Retorna se o tipo de forma não dá suporte à transparência ou o preenchimento da forma tem transparência inconsistente, como com `null` um tipo de preenchimento gradiente.
  remarks: '\[[Conjunto de API: PowerPointApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'transparency?: boolean;'
    return:
      type: boolean
