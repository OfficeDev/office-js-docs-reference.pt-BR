### YamlMime:TSType
name: PowerPoint.Interfaces.ShapeFontUpdateData
uid: powerpoint!PowerPoint.Interfaces.ShapeFontUpdateData:interface
package: powerpoint!
fullName: PowerPoint.Interfaces.ShapeFontUpdateData
summary: Uma interface para atualizar dados no objeto ShapeFont, para uso em `shapeFont.set({ ... })`<!-- -->.
remarks: ''
isPreview: false
isDeprecated: false
type: interface
properties:
- name: bold
  uid: powerpoint!PowerPoint.Interfaces.ShapeFontUpdateData#bold:member
  package: powerpoint!
  fullName: bold
  summary: Representa o status da fonte em negrito. Retorna `null` se o `TextRange` incluir fragmentos de texto em negrito e não negrito.
  remarks: '\[[Conjunto de API: PowerPointApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'bold?: boolean;'
    return:
      type: boolean
- name: color
  uid: powerpoint!PowerPoint.Interfaces.ShapeFontUpdateData#color:member
  package: powerpoint!
  fullName: color
  summary: Representação de código de cor HTML da cor do texto (por exemplo, "\#FF0000" representa vermelho). Retorna `null` se o `TextRange` incluir fragmentos de texto com cores diferentes.
  remarks: '\[[Conjunto de API: PowerPointApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'color?: string;'
    return:
      type: string
- name: italic
  uid: powerpoint!PowerPoint.Interfaces.ShapeFontUpdateData#italic:member
  package: powerpoint!
  fullName: italic
  summary: Representa o status da fonte em itálico. Retorna 'null' se 'TextRange' incluir fragmentos de texto itálico e não itálico.
  remarks: '\[[Conjunto de API: PowerPointApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'italic?: boolean;'
    return:
      type: boolean
- name: name
  uid: powerpoint!PowerPoint.Interfaces.ShapeFontUpdateData#name:member
  package: powerpoint!
  fullName: name
  summary: Representa o nome da fonte (por exemplo, "Calibri"). Se o texto for um script complexo ou idioma do leste asiático, este será o nome da fonte correspondente; caso contrário, é o nome da fonte latino.
  remarks: '\[[Conjunto de API: PowerPointApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'name?: string;'
    return:
      type: string
- name: size
  uid: powerpoint!PowerPoint.Interfaces.ShapeFontUpdateData#size:member
  package: powerpoint!
  fullName: size
  summary: Representa o tamanho da fonte em pontos (por exemplo, 11). Retorna nulo se o TextRange incluir fragmentos de texto com tamanhos de fontes diferentes.
  remarks: '\[[Conjunto de API: PowerPointApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'size?: number;'
    return:
      type: number
- name: underline
  uid: powerpoint!PowerPoint.Interfaces.ShapeFontUpdateData#underline:member
  package: powerpoint!
  fullName: underline
  summary: Tipo de sublinhado aplicado à fonte. Retorna `null` se o `TextRange` incluir fragmentos de texto com estilos sublinhados diferentes. Consulte [PowerPoint. ShapeFontUnderlineStyle](xref:powerpoint!PowerPoint.ShapeFontUnderlineStyle:enum) para obter detalhes.
  remarks: '\[[Conjunto de API: PowerPointApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'underline?: PowerPoint.ShapeFontUnderlineStyle | "None" | "Single" | "Double" | "Heavy" | "Dotted" | "DottedHeavy" | "Dash" | "DashHeavy" | "DashLong" | "DashLongHeavy" | "DotDash" | "DotDashHeavy" | "DotDotDash" | "DotDotDashHeavy" | "Wavy" | "WavyHeavy" | "WavyDouble";'
    return:
      type: <xref uid="powerpoint!PowerPoint.ShapeFontUnderlineStyle:enum" /> | "None" | "Single" | "Double" | "Heavy" | "Dotted" | "DottedHeavy" | "Dash" | "DashHeavy" | "DashLong" | "DashLongHeavy" | "DotDash" | "DotDashHeavy" | "DotDotDash" | "DotDotDashHeavy" | "Wavy" | "WavyHeavy" | "WavyDouble"
