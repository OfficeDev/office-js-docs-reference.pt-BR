  summary: Substitui o método JavaScript `toJSON()` para fornecer uma saída mais útil quando um objeto API é passado para `JSON.stringify()`<!-- -->. (`JSON.stringify`<!-- -->, por sua vez, chama `toJSON` o método do objeto que é passado a ele.) Enquanto a versão original PowerPoint. Objeto Presentation é um objeto API, o `toJSON` método retorna um objeto JavaScript simples (digitado como`PowerPoint.Interfaces.PresentationData`<!-- -->) que contém cópias rasas de quaisquer propriedades filho carregadas do objeto original.
