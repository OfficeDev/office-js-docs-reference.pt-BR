methods:
- name: getSubstring(start, length)
  uid: powerpoint!PowerPoint.TextRange#getSubstring:member(1)
  package: powerpoint!
  fullName: getSubstring(start, length)
  summary: Retorna um `TextRange` objeto para a subdistragem no intervalo determinado.
  remarks: '\[[Conjunto de API: PowerPointApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'getSubstring(start: number, length?: number): PowerPoint.TextRange;'
    parameters:
    - id: start
      description: O índice baseado em zero do primeiro caractere a obter do intervalo de texto.
      type: number
    - id: length
      description: Opcional. O número de caracteres a serem retornados no novo intervalo de texto. Se o comprimento for omitido, todos os caracteres do início ao final do último parágrafo do intervalo de texto serão retornados.
      type: number
    return:
      type: <xref uid="powerpoint!PowerPoint.TextRange:class" />
      description: ''
