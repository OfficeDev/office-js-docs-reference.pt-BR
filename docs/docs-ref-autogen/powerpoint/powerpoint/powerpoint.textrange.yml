  remarks: '\[[Conjunto de API: PowerPointApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'readonly paragraphFormat: PowerPoint.ParagraphFormat;'
    return:
      type: <xref uid="powerpoint!PowerPoint.ParagraphFormat:class" />
- name: text
  uid: powerpoint!PowerPoint.TextRange#text:member
  package: powerpoint!
  fullName: text
