- name: toJSON()
  uid: powerpoint!PowerPoint.TextRange#toJSON:member(1)
  package: powerpoint!
  fullName: toJSON()
  summary: Substitui o método JavaScript `toJSON()` para fornecer uma saída mais útil quando um objeto API é passado para `JSON.stringify()`<!-- -->. (`JSON.stringify`<!-- -->, por sua vez, chama `toJSON` o método do objeto que é passado a ele.) Enquanto a versão original PowerPoint. Objeto TextRange é um objeto API, `toJSON` o método retorna um objeto JavaScript simples (digitado como`PowerPoint.Interfaces.TextRangeData`<!-- -->) que contém cópias rasas de quaisquer propriedades filho carregadas do objeto original.
