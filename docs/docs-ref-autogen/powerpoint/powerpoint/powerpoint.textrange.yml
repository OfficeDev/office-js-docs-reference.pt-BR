name: PowerPoint.TextRange
uid: powerpoint!PowerPoint.TextRange:class
package: powerpoint!
fullName: PowerPoint.TextRange
summary: Contém o texto que é anexado a uma forma, bem como propriedades e métodos para manipular o texto.
remarks: '\[[Conjunto de API: PowerPointApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
isPreview: true
isDeprecated: false
type: class
properties:
- name: context
  uid: powerpoint!PowerPoint.TextRange#context:member
  package: powerpoint!
  fullName: context
  summary: O contexto de solicitação associado ao objeto. Isso conecta o processo do Office do aplicativo host.
  remarks: ''
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'context: RequestContext;'
    return:
      type: <xref uid="powerpoint!PowerPoint.RequestContext:class" />
- name: font
  uid: powerpoint!PowerPoint.TextRange#font:member
