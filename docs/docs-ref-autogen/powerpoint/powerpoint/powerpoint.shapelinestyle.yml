name: PowerPoint.ShapeLineStyle
uid: powerpoint!PowerPoint.ShapeLineStyle:enum
package: powerpoint!
fullName: PowerPoint.ShapeLineStyle
summary: >-
  Especifica o estilo de uma linha.


  \[[Conjunto de API: PowerPointApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]
remarks: ''
isPreview: true
isDeprecated: false
fields:
- name: single
  uid: powerpoint!PowerPoint.ShapeLineStyle.single:member
  package: powerpoint!
  summary: Linha única.
  value: "\"Single\""
- name: thickBetweenThin
  uid: powerpoint!PowerPoint.ShapeLineStyle.thickBetweenThin:member
  package: powerpoint!
  summary: Linha grossa com uma linha fina de cada lado.
  value: "\"ThickBetweenThin\""
- name: thickThin
  uid: powerpoint!PowerPoint.ShapeLineStyle.thickThin:member
  package: powerpoint!
  summary: Linha grossa ao lado da linha fina. Para linhas horizontais, a linha espessa está acima da linha fina. Para linhas verticais, a linha espessa fica à esquerda da linha fina.
  value: "\"ThickThin\""
- name: thinThick
  uid: powerpoint!PowerPoint.ShapeLineStyle.thinThick:member
  package: powerpoint!
  summary: Linha grossa ao lado da linha fina. Para linhas horizontais, a linha espessa está abaixo da linha fina. Para linhas verticais, a linha espessa fica à direita da linha fina.
  value: "\"ThinThick\""
- name: thinThin
  uid: powerpoint!PowerPoint.ShapeLineStyle.thinThin:member
  package: powerpoint!
  summary: Duas linhas finas.
  value: "\"ThinThin\""
