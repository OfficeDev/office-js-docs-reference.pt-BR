name: PowerPoint.ShapeLineStyle
uid: powerpoint!PowerPoint.ShapeLineStyle:enum
package: powerpoint!
fullName: PowerPoint.ShapeLineStyle
summary: Especifica o estilo de uma linha.
remarks: '\[[Conjunto de API: PowerPointApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
