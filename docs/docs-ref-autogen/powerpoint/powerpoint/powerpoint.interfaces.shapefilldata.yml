properties:
- name: foregroundColor
  uid: powerpoint!PowerPoint.Interfaces.ShapeFillData#foregroundColor:member
  package: powerpoint!
  fullName: foregroundColor
  summary: Representa a cor de primeiro plano de preenchimento da forma no formato de cor HTML, \#no formato RRGGBB (por exemplo, "FFA500") ou como uma cor HTML nomeada (por exemplo, "laranja").
  remarks: '\[[Conjunto de API: PowerPointApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'foregroundColor?: string;'
    return:
      type: string
- name: transparency
  uid: powerpoint!PowerPoint.Interfaces.ShapeFillData#transparency:member
  package: powerpoint!
  fullName: transparency
  summary: Especifica a porcentagem de transparência do preenchimento como um valor de 0,0 (opaco) a 1,0 (claro). Retorna `null` se o tipo de forma não dá suporte à transparência ou o preenchimento da forma tem transparência inconsistente, como com um tipo de preenchimento gradiente.
  remarks: '\[[Conjunto de API: PowerPointApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'transparency?: number;'
    return:
      type: number
- name: type
  uid: powerpoint!PowerPoint.Interfaces.ShapeFillData#type:member
  package: powerpoint!
  fullName: type
  summary: Retorna o tipo de preenchimento da forma. Consulte [PowerPoint. ShapeFillType](xref:powerpoint!PowerPoint.ShapeFillType:enum) para obter detalhes.
  remarks: '\[[Conjunto de API: PowerPointApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: true
