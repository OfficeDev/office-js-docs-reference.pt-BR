name: PowerPoint.Interfaces.ShapeFillData
uid: powerpoint!PowerPoint.Interfaces.ShapeFillData:interface
package: powerpoint!
fullName: PowerPoint.Interfaces.ShapeFillData
summary: Uma interface que descreve os dados retornados chamando `shapeFill.toJSON()`<!-- -->.
remarks: ''
isPreview: false
isDeprecated: false
type: interface
properties:
- name: foregroundColor
  uid: powerpoint!PowerPoint.Interfaces.ShapeFillData#foregroundColor:member
  package: powerpoint!
  fullName: foregroundColor
  summary: >-
    Representa a cor de primeiro plano de preenchimento da forma no formato de cor HTML, no formato \# RRGGBB (por exemplo, "FFA500") ou como uma cor HTML nomeada (por exemplo, "laranja").


    \[[Conjunto de API: PowerPointApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]
  remarks: ''
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'foregroundColor?: string;'
    return:
      type: string
- name: transparency
  uid: powerpoint!PowerPoint.Interfaces.ShapeFillData#transparency:member
  package: powerpoint!
  fullName: transparency
  summary: >-
    Especifica a porcentagem de transparência do preenchimento como um valor de 0,0 (opaco) a 1,0 (claro). Retorna se o tipo de forma não dá suporte à transparência ou o preenchimento da forma tem transparência inconsistente, como com `null` um tipo de preenchimento gradiente.


    \[[Conjunto de API: PowerPointApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]
  remarks: ''
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'transparency?: number;'
    return:
      type: number
- name: type
  uid: powerpoint!PowerPoint.Interfaces.ShapeFillData#type:member
  package: powerpoint!
  fullName: type
  summary: >-
    Retorna o tipo de preenchimento da forma. Consulte [PowerPoint. ShapeFillType](xref:powerpoint!PowerPoint.ShapeFillType:enum) para obter detalhes.


    \[[Conjunto de API: PowerPointApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]
  remarks: ''
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'type?: PowerPoint.ShapeFillType | "NoFill" | "Solid" | "Gradient" | "Pattern" | "PictureAndTexture" | "SlideBackground";'
    return:
      type: <xref uid="powerpoint!PowerPoint.ShapeFillType:enum" /> | "NoFill" | "Solid" | "Gradient" | "Pattern" | "PictureAndTexture" | "SlideBackground"
