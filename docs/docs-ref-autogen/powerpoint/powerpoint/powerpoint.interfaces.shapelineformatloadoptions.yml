### YamlMime:TSType
name: PowerPoint.Interfaces.ShapeLineFormatLoadOptions
uid: powerpoint!PowerPoint.Interfaces.ShapeLineFormatLoadOptions:interface
package: powerpoint!
fullName: PowerPoint.Interfaces.ShapeLineFormatLoadOptions
summary: Representa a formatação de linha do objeto shape. Para imagens e formas geométricas, a formatação de linha representa a borda da forma.
remarks: '\[[Conjunto de API: PowerPointApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
isPreview: true
isDeprecated: false
type: interface
properties:
- name: $all
  uid: powerpoint!PowerPoint.Interfaces.ShapeLineFormatLoadOptions#$all:member
  package: powerpoint!
  fullName: $all
  summary: 'A `$all` especificação do LoadOptions carrega todas as propriedades escalares (por exemplo: `Range.address`<!-- -->), mas não as propriedades de navegação (por exemplo: `Range.format.fill.color`<!-- -->).'
  remarks: ''
  isPreview: true
  isDeprecated: false
  syntax:
    content: '$all?: boolean;'
    return:
      type: boolean
- name: color
  uid: powerpoint!PowerPoint.Interfaces.ShapeLineFormatLoadOptions#color:member
  package: powerpoint!
  fullName: color
  summary: Representa a cor da linha no formato de cor HTML, no formato \# RRGGBB (por exemplo, "FFA500") ou como uma cor HTML nomeada (por exemplo, "laranja").
  remarks: '\[[Conjunto de API: PowerPointApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'color?: boolean;'
    return:
      type: boolean
- name: dashStyle
  uid: powerpoint!PowerPoint.Interfaces.ShapeLineFormatLoadOptions#dashStyle:member
  package: powerpoint!
  fullName: dashStyle
  summary: Representa o estilo de traço da linha. Retorna nulo quando a linha não estiver visível ou quando existirem estilos de traços inconsistentes. Consulte PowerPoint. ShapeLineDashStyle para obter detalhes.
  remarks: '\[[Conjunto de API: PowerPointApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'dashStyle?: boolean;'
    return:
      type: boolean
- name: style
  uid: powerpoint!PowerPoint.Interfaces.ShapeLineFormatLoadOptions#style:member
  package: powerpoint!
  fullName: style
  summary: Representa o estilo de linha da forma. Retorna nulo quando a linha não estiver visível ou quando existirem estilos inconsistentes. Consulte PowerPoint. ShapeLineStyle para obter detalhes.
  remarks: '\[[Conjunto de API: PowerPointApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'style?: boolean;'
    return:
      type: boolean
- name: transparency
  uid: powerpoint!PowerPoint.Interfaces.ShapeLineFormatLoadOptions#transparency:member
  package: powerpoint!
  fullName: transparency
  summary: Especifica a porcentagem de transparência da linha como um valor de 0,0 (opaco) a 1,0 (claro). Retorna nulo quando a forma possui transparências inconsistentes.
  remarks: '\[[Conjunto de API: PowerPointApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'transparency?: boolean;'
    return:
      type: boolean
- name: visible
  uid: powerpoint!PowerPoint.Interfaces.ShapeLineFormatLoadOptions#visible:member
  package: powerpoint!
  fullName: visible
  summary: Especifica se a formatação de linha de um elemento de forma está visível. Retorna `null` quando a forma tem visibilidades inconsistentes.
  remarks: '\[[Conjunto de API: PowerPointApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'visible?: boolean;'
    return:
      type: boolean
- name: weight
  uid: powerpoint!PowerPoint.Interfaces.ShapeLineFormatLoadOptions#weight:member
  package: powerpoint!
  fullName: weight
  summary: Representa a espessura da linha, em pontos. Retorna `null` quando a linha não está visível ou há pesos de linha inconsistentes.
  remarks: '\[[Conjunto de API: PowerPointApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'weight?: boolean;'
    return:
      type: boolean
