methods:
- name: add(key, value)
  uid: powerpoint!PowerPoint.TagCollection#add:member(1)
  package: powerpoint!
  fullName: add(key, value)
  summary: Adiciona uma nova marca no final da coleção. Se o `key` já existir na coleção, o valor da marca existente será substituído pelo dado `value`<!-- -->.
  remarks: >-
    \[[Conjunto de API: PowerPointApi 1.3](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]


    #### <a name="examples"></a>Exemplos


    ```typescript

    // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/powerpoint/tags/tags.yaml

    await PowerPoint.run(async function(context) {
      const slide = context.presentation.slides.getItemAt(0);
      slide.tags.add("OCEAN", "Indian");
      slide.tags.add("PLANET", "Jupiter");
      slide.tags.add("CONTINENT", "Antarctica");

      await context.sync();

      slide.tags.load("key, value");

      await context.sync();

      for (let i = 0; i < slide.tags.items.length; i++) {
        console.log("Added key " + JSON.stringify(slide.tags.items[i].key) + " with value " +        JSON.stringify(slide.tags.items[i].value));
      }
    });

    ```
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'add(key: string, value: string): void;'
    parameters:
    - id: key
      description: A ID exclusiva de uma marca, que é exclusiva neste `TagCollection`<!-- -->. O parâmetro 'key' não tem maiúsculas de minúsculas, mas é sempre maiúscula quando salvo no documento.
      type: string
    - id: value
      description: O valor da marca.
      type: string
    return:
      type: void
      description: ''
- name: delete(key)
  uid: powerpoint!PowerPoint.TagCollection#delete:member(1)
  package: powerpoint!
  fullName: delete(key)
  summary: Exclui a marca com a determinada `key` nesta coleção. Não faz nada se `key` o não existir.
  remarks: >-
    \[[Conjunto de API: PowerPointApi 1.3](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]


    #### <a name="examples"></a>Exemplos


    ```typescript

    // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/powerpoint/tags/tags.yaml

    await PowerPoint.run(async function (context) {
      let presentationTags = context.presentation.tags;

      presentationTags.delete("COLOR");

      await context.sync();

      console.log(JSON.stringify(presentationTags));
    });

    ```
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'delete(key: string): void;'
    parameters:
    - id: key
      description: A ID exclusiva de uma marca, que é exclusiva neste `TagCollection`<!-- -->. `key` é insensível a maiúsculas e minúsculas.
      type: string
    return:
      type: void
      description: ''
