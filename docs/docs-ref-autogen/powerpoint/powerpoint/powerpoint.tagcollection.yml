- name: getItem(key)
  uid: powerpoint!PowerPoint.TagCollection#getItem:member(1)
  package: powerpoint!
  fullName: getItem(key)
  summary: Obtém uma marca usando sua ID exclusiva. Um erro será lançado se a marca não existir.
  remarks: >-
    \[[Conjunto de API: PowerPointApi 1.3](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]


    #### <a name="examples"></a>Exemplos


    ```typescript

    // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/powerpoint/tags/tags.yaml

    await PowerPoint.run(async function(context) {
      let selectedSlideIndex = await getSelectedSlideIndex();

      // Decrement because the getSelectedSlideByIndex method is 1-based,
      // but the getItemAt method is 0-based.
      selectedSlideIndex = selectedSlideIndex - 1;
      const slide = context.presentation.slides.getItemAt(selectedSlideIndex);
      slide.tags.add("CUSTOMER_TYPE", "Premium");

      await context.sync();

      const audienceTag = slide.tags.getItem("CUSTOMER_TYPE");
      audienceTag.load("key, value");

      await context.sync();

      console.log("Added key " + JSON.stringify(audienceTag.key) + " with value " + JSON.stringify(audienceTag.value));
    });

    ```
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'getItem(key: string): PowerPoint.Tag;'
    parameters:
    - id: key
      description: A ID da marca.
      type: string
    return:
      type: <xref uid="powerpoint!PowerPoint.Tag:class" />
      description: A marca com a ID exclusiva. Se essa marca não existir, será lançado um erro.
