### YamlMime:TSType
name: PowerPoint.Interfaces.ShapeLineFormatUpdateData
uid: powerpoint!PowerPoint.Interfaces.ShapeLineFormatUpdateData:interface
package: powerpoint!
fullName: PowerPoint.Interfaces.ShapeLineFormatUpdateData
summary: Uma interface para atualizar dados no objeto ShapeLineFormat, para uso em `shapeLineFormat.set({ ... })`<!-- -->.
remarks: ''
isPreview: false
isDeprecated: false
type: interface
properties:
- name: color
  uid: powerpoint!PowerPoint.Interfaces.ShapeLineFormatUpdateData#color:member
  package: powerpoint!
  fullName: color
  summary: Representa a cor da linha no formato de cor HTML, \#no formato RRGGBB (por exemplo, "FFA500") ou como uma cor HTML nomeada (por exemplo, "laranja").
  remarks: '\[[Conjunto de API: PowerPointApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'color?: string;'
    return:
      type: string
- name: dashStyle
  uid: powerpoint!PowerPoint.Interfaces.ShapeLineFormatUpdateData#dashStyle:member
  package: powerpoint!
  fullName: dashStyle
  summary: Representa o estilo de traço da linha. Retorna nulo quando a linha não estiver visível ou quando existirem estilos de traços inconsistentes. Consulte PowerPoint. ShapeLineDashStyle para obter detalhes.
  remarks: '\[[Conjunto de API: PowerPointApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'dashStyle?: PowerPoint.ShapeLineDashStyle | "Dash" | "DashDot" | "DashDotDot" | "LongDash" | "LongDashDot" | "RoundDot" | "Solid" | "SquareDot" | "LongDashDotDot" | "SystemDash" | "SystemDot" | "SystemDashDot";'
    return:
      type: <xref uid="powerpoint!PowerPoint.ShapeLineDashStyle:enum" /> | "Dash" | "DashDot" | "DashDotDot" | "LongDash" | "LongDashDot" | "RoundDot" | "Solid" | "SquareDot" | "LongDashDotDot" | "SystemDash" | "SystemDot" | "SystemDashDot"
- name: style
  uid: powerpoint!PowerPoint.Interfaces.ShapeLineFormatUpdateData#style:member
  package: powerpoint!
  fullName: style
  summary: Representa o estilo de linha da forma. Retorna nulo quando a linha não estiver visível ou quando existirem estilos inconsistentes. Consulte PowerPoint. ShapeLineStyle para obter detalhes.
  remarks: '\[[Conjunto de API: PowerPointApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'style?: PowerPoint.ShapeLineStyle | "Single" | "ThickBetweenThin" | "ThickThin" | "ThinThick" | "ThinThin";'
    return:
      type: <xref uid="powerpoint!PowerPoint.ShapeLineStyle:enum" /> | "Single" | "ThickBetweenThin" | "ThickThin" | "ThinThick" | "ThinThin"
- name: transparency
  uid: powerpoint!PowerPoint.Interfaces.ShapeLineFormatUpdateData#transparency:member
  package: powerpoint!
  fullName: transparency
  summary: Especifica a porcentagem de transparência da linha como um valor de 0,0 (opaco) a 1,0 (claro). Retorna nulo quando a forma possui transparências inconsistentes.
  remarks: '\[[Conjunto de API: PowerPointApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'transparency?: number;'
    return:
      type: number
- name: visible
  uid: powerpoint!PowerPoint.Interfaces.ShapeLineFormatUpdateData#visible:member
  package: powerpoint!
  fullName: visible
  summary: Especifica se a formatação de linha de um elemento de forma está visível. Retorna `null` quando a forma tem visibilidades inconsistentes.
  remarks: '\[[Conjunto de API: PowerPointApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'visible?: boolean;'
    return:
      type: boolean
- name: weight
  uid: powerpoint!PowerPoint.Interfaces.ShapeLineFormatUpdateData#weight:member
  package: powerpoint!
  fullName: weight
  summary: Representa a espessura da linha, em pontos. Retorna `null` quando a linha não está visível ou há pesos de linha inconsistentes.
  remarks: '\[[Conjunto de API: PowerPointApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'weight?: number;'
    return:
      type: number
