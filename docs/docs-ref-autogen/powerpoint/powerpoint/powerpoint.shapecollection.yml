- name: addGeometricShape(geometricShapeType, options)
  uid: powerpoint!PowerPoint.ShapeCollection#addGeometricShape:member(1)
  package: powerpoint!
  fullName: addGeometricShape(geometricShapeType, options)
  summary: Adiciona uma forma geométrica ao slide. Retorna um `Shape` objeto que representa a nova forma.
  remarks: "\\[[Conjunto de API: PowerPointApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>Exemplos\n\n```typescript\n// Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/powerpoint/preview-apis/shapes.yaml\nawait PowerPoint.run(async (context) => {\n  var shapes = context.presentation.slides.getItemAt(0).shapes;\n  var hexagon = shapes.addGeometricShape(PowerPoint.GeometricShapeType.hexagon, \n      {\n        left: 100,\n        top: 100,\n        height: 150,\n        width: 150\n      });\n  hexagon.name = \"Hexagon\";\n\n  await context.sync();\n});\n```"
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'addGeometricShape(geometricShapeType: PowerPoint.GeometricShapeType, options?: PowerPoint.ShapeAddOptions): PowerPoint.Shape;'
    parameters:
    - id: geometricShapeType
      description: Especifica o tipo da forma geométrica. Consulte [PowerPoint. GeometricShapeType](xref:powerpoint!PowerPoint.GeometricShapeType:enum) para obter detalhes.
      type: <xref uid="powerpoint!PowerPoint.GeometricShapeType:enum" />
    - id: options
      description: Um parâmetro opcional para especificar as opções adicionais, como a posição da forma.
      type: <xref uid="powerpoint!PowerPoint.ShapeAddOptions:interface" />
    return:
      type: <xref uid="powerpoint!PowerPoint.Shape:class" />
      description: A forma recém-inserida.
