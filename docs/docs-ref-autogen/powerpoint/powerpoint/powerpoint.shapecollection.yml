      description: A forma recém-inserida.
- name: addTextBox(text, options)
  uid: powerpoint!PowerPoint.ShapeCollection#addTextBox:member(1)
  package: powerpoint!
  fullName: addTextBox(text, options)
  summary: Adiciona uma caixa de texto ao slide com o texto fornecido como o conteúdo. Retorna um `Shape` objeto que representa a nova caixa de texto.
  remarks: "\\[[Conjunto de API: PowerPointApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>Exemplos\n\n```typescript\n// Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/powerpoint/preview-apis/shapes.yaml\nawait PowerPoint.run(async (context) => {\n  var shapes = context.presentation.slides.getItemAt(0).shapes;\n  var textbox = shapes.addTextBox(\"Hello!\", \n      { \n        left: 100, \n        top: 300, \n        height: 300, \n        width: 450 \n      });\n  textbox.name = \"Textbox\";\n\n  return context.sync();\n});\n```"
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'addTextBox(text: string, options?: PowerPoint.ShapeAddOptions): PowerPoint.Shape;'
    parameters:
    - id: text
      description: Especifica o texto que será mostrado na caixa de texto criada.
      type: string
    - id: options
      description: Um parâmetro opcional para especificar as opções adicionais, como a posição da caixa de texto.
      type: <xref uid="powerpoint!PowerPoint.ShapeAddOptions:interface" />
    return:
      type: <xref uid="powerpoint!PowerPoint.Shape:class" />
      description: A forma recém-inserida.
