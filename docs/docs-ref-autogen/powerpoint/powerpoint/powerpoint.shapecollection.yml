- name: getItemAt(index)
  uid: powerpoint!PowerPoint.ShapeCollection#getItemAt:member(1)
  package: powerpoint!
  fullName: getItemAt(index)
  summary: Obtém uma forma usando seu índice baseado em zero na coleção. Um erro será lançado se o índice estiver fora do intervalo.
  remarks: >-
    \[[Conjunto de API: PowerPointApi 1.3](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]


    #### <a name="examples"></a>Exemplos


    ```typescript

    // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/powerpoint/tags/tags.yaml

    await PowerPoint.run(async function(context) {
      const slide = context.presentation.slides.getItemAt(0);
      const shape = slide.shapes.getItemAt(0);
      shape.tags.add("MOUNTAIN", "Denali");

      await context.sync();

      const myShapeTag = shape.tags.getItem("MOUNTAIN");
      myShapeTag.load("key, value");

      await context.sync();

      console.log("Added key " + JSON.stringify(myShapeTag.key) + " with value " + JSON.stringify(myShapeTag.value));
    });

    ```
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'getItemAt(index: number): PowerPoint.Shape;'
    parameters:
    - id: index
      description: O índice da forma na coleção.
      type: number
    return:
      type: <xref uid="powerpoint!PowerPoint.Shape:class" />
      description: A forma no índice determinado. Um erro será lançado se o índice estiver fora do intervalo.
