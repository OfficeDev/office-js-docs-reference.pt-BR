- name: addLine(connectorType, options)
  uid: powerpoint!PowerPoint.ShapeCollection#addLine:member(1)
  package: powerpoint!
  fullName: addLine(connectorType, options)
  summary: Adiciona uma linha ao slide. Retorna um `Shape` objeto que representa a nova linha.
  remarks: "\\[[Conjunto de API: PowerPointApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>Exemplos\n\n```typescript\n// Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/powerpoint/preview-apis/shapes.yaml\nawait PowerPoint.run(async (context) => {\n  var shapes = context.presentation.slides.getItemAt(0).shapes;\n\n  // For a line, left and top are the coordinates of the start point,\n  // while height and width are the coordinates of the end point.\n  var line = shapes.addLine(PowerPoint.ConnectorType.straight, \n      { \n        left: 400, \n        top: 200, \n        height: 20, \n        width: 150 \n      });\n  line.name = \"StraightLine\";\n\n  await context.sync();\n});\n```"
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'addLine(connectorType?: PowerPoint.ConnectorType, options?: PowerPoint.ShapeAddOptions): PowerPoint.Shape;'
    parameters:
    - id: connectorType
      description: Especifica o tipo de conector da linha. Se não for fornecido, o `straight` tipo de conector será usado. Consulte [PowerPoint. ConnectorType](xref:powerpoint!PowerPoint.ConnectorType:enum) para obter detalhes.
      type: <xref uid="powerpoint!PowerPoint.ConnectorType:enum" />
    - id: options
      description: Um parâmetro opcional para especificar as opções adicionais, como a posição do objeto shape que contém a linha.
      type: <xref uid="powerpoint!PowerPoint.ShapeAddOptions:interface" />
    return:
      type: <xref uid="powerpoint!PowerPoint.Shape:class" />
      description: A forma recém-inserida.
- name: addLine(connectorTypeString, options)
  uid: powerpoint!PowerPoint.ShapeCollection#addLine:member(2)
