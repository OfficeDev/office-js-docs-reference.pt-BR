properties:
- name: layoutId
  uid: powerpoint!PowerPoint.AddSlideOptions#layoutId:member
  package: powerpoint!
  fullName: layoutId
  summary: Especifica a ID de um Layout de Slide a ser usado para o novo slide. Se não for fornecido, mas um for fornecido, a ID do primeiro layout do `layoutId` Slide Master especificado será `slideMasterId` usada. Se não for fornecido, mas um for fornecido, o layout especificado precisará estar disponível para o `slideMasterId` `layoutId` Slide Master padrão (conforme especificado na `slideMasterId` descrição). Caso contrário, um erro será lançado.
  remarks: '\[[Conjunto de API: PowerPointApi 1.3](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'layoutId?: string;'
    return:
      type: string
- name: slideMasterId
  uid: powerpoint!PowerPoint.AddSlideOptions#slideMasterId:member
  package: powerpoint!
  fullName: slideMasterId
  summary: Especifica a ID de um Slide Master a ser usado para o novo slide. Se não for fornecido, o Slide Master do slide anterior `slideMasterId` será usado. Se não houver nenhum slide anterior, o primeiro Slide Master da apresentação será usado.
  remarks: '\[[Conjunto de API: PowerPointApi 1.3](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'slideMasterId?: string;'
    return:
      type: string
