### YamlMime:TSEnum
name: PowerPoint.TextVerticalAlignment
uid: powerpoint!PowerPoint.TextVerticalAlignment:enum
package: powerpoint!
fullName: PowerPoint.TextVerticalAlignment
summary: >-
  Representa o alinhamento vertical de um [PowerPoint. TextFrame](xref:powerpoint!PowerPoint.TextFrame:class) em um [PowerPoint. Shape](xref:powerpoint!PowerPoint.Shape:class)<!-- -->. Se uma das opções centralizadas estiver selecionada, o conteúdo do `TextFrame` será centralizado horizontalmente dentro `Shape` do grupo como um. Para alterar o alinhamento horizontal de um texto, [consulte PowerPoint. ParagraphFormat](xref:powerpoint!PowerPoint.ParagraphFormat:class) e [PowerPoint. ParagraphHorizontalAlignment](xref:powerpoint!PowerPoint.ParagraphHorizontalAlignment:enum)<!-- -->.


  \[[Conjunto de API: PowerPointApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]
remarks: ''
isPreview: true
isDeprecated: false
fields:
- name: bottom
  uid: powerpoint!PowerPoint.TextVerticalAlignment.bottom:member
  package: powerpoint!
  summary: Especifica que o `TextFrame` deve ser alinhado inferior ao `Shape`<!-- -->.
  value: "\"Bottom\""
- name: bottomCentered
  uid: powerpoint!PowerPoint.TextVerticalAlignment.bottomCentered:member
  package: powerpoint!
  summary: Especifica que a parte inferior `TextFrame` deve ser alinhada verticalmente ao `Shape`<!-- -->. O conteúdo do `TextFrame` será centralizado horizontalmente dentro do `Shape`<!-- -->.
  value: "\"BottomCentered\""
- name: middle
  uid: powerpoint!PowerPoint.TextVerticalAlignment.middle:member
  package: powerpoint!
  summary: Especifica que o `TextFrame` centro deve ser alinhado ao `Shape`<!-- -->.
  value: "\"Middle\""
- name: middleCentered
  uid: powerpoint!PowerPoint.TextVerticalAlignment.middleCentered:member
  package: powerpoint!
  summary: Especifica que o `TextFrame` centro deve ser alinhado verticalmente ao `Shape`<!-- -->. O conteúdo do `TextFrame` será centralizado horizontalmente dentro do `Shape`<!-- -->.
  value: "\"MiddleCentered\""
- name: top
  uid: powerpoint!PowerPoint.TextVerticalAlignment.top:member
  package: powerpoint!
  summary: Especifica que o `TextFrame` deve ser alinhado superior ao `Shape`<!-- -->.
  value: "\"Top\""
- name: topCentered
  uid: powerpoint!PowerPoint.TextVerticalAlignment.topCentered:member
  package: powerpoint!
  summary: Especifica que o `TextFrame` deve ser alinhado verticalmente à parte superior `Shape`<!-- -->. O conteúdo do `TextFrame` será centralizado horizontalmente dentro do `Shape`<!-- -->.
  value: "\"TopCentered\""
