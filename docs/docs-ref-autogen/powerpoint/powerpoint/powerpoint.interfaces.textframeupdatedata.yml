properties:
- name: autoSizeSetting
  uid: powerpoint!PowerPoint.Interfaces.TextFrameUpdateData#autoSizeSetting:member
  package: powerpoint!
  fullName: autoSizeSetting
  summary: >-
    As configurações de redação automáticas do quadro de texto. Um quadro de texto pode ser configurado para ajustar automaticamente o texto ao quadro de texto, para ajustar automaticamente o quadro do texto ao texto ou não executar qualquer dimensionamento automático.


    \[[Conjunto de API: PowerPointApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]
  remarks: ''
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'autoSizeSetting?: PowerPoint.ShapeAutoSize | "AutoSizeNone" | "AutoSizeTextToFitShape" | "AutoSizeShapeToFitText" | "AutoSizeMixed";'
    return:
      type: <xref uid="powerpoint!PowerPoint.ShapeAutoSize:enum" /> | "AutoSizeNone" | "AutoSizeTextToFitShape" | "AutoSizeShapeToFitText" | "AutoSizeMixed"
