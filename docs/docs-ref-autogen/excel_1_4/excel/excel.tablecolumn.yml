      description: ''
- name: getRange()
  uid: excel!Excel.TableColumn#getRange:member(1)
  package: excel!
  fullName: getRange()
  summary: Obtém o objeto de intervalo associado a toda a coluna.
  remarks: "\\[[Conjunto de API: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>Exemplos\n\n```typescript\nawait Excel.run(async (context) => { \n    var tableName = 'Table1';\n    var columns = context.workbook.tables.getItem(tableName).columns.getItemAt(0);\n    var columnRange = columns.getRange();\n    columnRange.load('address');\n    await context.sync();\n    \n    console.log(columnRange.address);\n});\n```"
  isPreview: false
