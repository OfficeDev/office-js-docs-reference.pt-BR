      type: any[][]
methods:
- name: delete()
  uid: excel!Excel.TableColumn#delete:member(1)
  package: excel!
  fullName: delete()
  summary: Exclui a coluna da tabela.
  remarks: "\\[[Conjunto de API: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>Exemplos\n\n```typescript\nawait Excel.run(async (context) => { \n    var tableName = 'Table1';\n    var column = context.workbook.tables.getItem(tableName).columns.getItemAt(2);\n    column.delete();\n    await context.sync(); \n});\n```"
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'delete(): void;'
    return:
      type: void
      description: ''
- name: getDataBodyRange()
  uid: excel!Excel.TableColumn#getDataBodyRange:member(1)
  package: excel!
  fullName: getDataBodyRange()
  summary: Obtém o objeto de intervalo associado ao corpo de dados da coluna.
  remarks: "\\[[Conjunto de API: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>Exemplos\n\n```typescript\nawait Excel.run(async (context) => { \n    var tableName = 'Table1';\n    var column = context.workbook.tables.getItem(tableName).columns.getItemAt(0);\n    var dataBodyRange = column.getDataBodyRange();\n    dataBodyRange.load('address');\n    await context.sync();\n    \n    console.log(dataBodyRange.address);\n});\n```"
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'getDataBodyRange(): Excel.Range;'
    return:
      type: <xref uid="excel!Excel.Range:class" />
      description: ''
