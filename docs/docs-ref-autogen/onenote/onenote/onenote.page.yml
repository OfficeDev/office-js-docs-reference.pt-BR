methods:
- name: addOutline(left, top, html)
  uid: onenote!OneNote.Page#addOutline:member(1)
  package: onenote!
  fullName: addOutline(left, top, html)
  summary: Adiciona uma estrutura de página em uma posição especificada.
  remarks: "\\[[Conjunto de API: OneNoteApi 1.1](/office/dev/add-ins/reference/requirement-sets/onenote-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>Exemplos\n\n```typescript\nawait OneNote.run(async (context) => {\n\n    // Gets the active page.\n    var page = context.application.getActivePage();\n\n    // Queue a command to add an outline with given html.\n    var outline = page.addOutline(200, 200,\n\"<p>Images and a table below:</p> \\\n <img src=\\\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAUAAAAFCAYAAACNbyblAAAAHElEQVQI12P4//8/w38GIAXDIBKE0DHxgljNBAAO9TXL0Y4OHwAAAABJRU5ErkJggg==\\\"> \\\n <img src=\\\"http://imagenes.es.sftcdn.net/es/scrn/6653000/6653659/microsoft-onenote-2013-01-535x535.png\\\"> \\\n <table> \\\n   <tr> \\\n     <td>Jill</td> \\\n     <td>Smith</td> \\\n     <td>50</td> \\\n   </tr> \\\n   <tr> \\\n     <td>Eve</td> \\\n     <td>Jackson</td> \\\n     <td>94</td> \\\n   </tr> \\\n </table>\"     \n        );\n\n    // Run the queued commands, and return a promise to indicate task completion.\n    await context.sync();\n});\n```"
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'addOutline(left: number, top: number, html: string): OneNote.Outline;'
    parameters:
    - id: left
      description: A posição esquerda do canto superior esquerdo da estrutura de tópicos.
      type: number
    - id: top
      description: A posição superior do canto superior esquerdo da estrutura de tópicos.
      type: number
    - id: html
      description: Uma cadeia de caracteres que descreve a apresentação visual da estrutura de tópicos. Consulte [HTML com suporte](https://docs.microsoft.com/office/dev/add-ins/onenote/onenote-add-ins-page-content#supported-html) para a API JavaScript OneNote de complementos.
      type: string
    return:
      type: <xref uid="onenote!OneNote.Outline:class" />
      description: ''
