- name: getItem(index)
  uid: onenote!OneNote.ParagraphCollection#getItem:member(1)
  package: onenote!
  fullName: getItem(index)
  summary: Obtém um objeto Paragraph pela ID ou pelo índice na coleção. Somente leitura.
  remarks: '\[[Conjunto de API: OneNoteApi 1.1](/office/dev/add-ins/reference/requirement-sets/onenote-api-requirement-sets) \]'
