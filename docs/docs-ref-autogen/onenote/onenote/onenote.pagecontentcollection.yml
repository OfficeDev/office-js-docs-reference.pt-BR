name: OneNote.PageContentCollection
uid: onenote!OneNote.PageContentCollection:class
package: onenote!
fullName: OneNote.PageContentCollection
summary: Representa o conteúdo de uma página, como um conjunto de objetos PageContent.
remarks: '\[[Conjunto de API: OneNoteApi 1.1](/office/dev/add-ins/reference/requirement-sets/onenote-api-requirement-sets) \]'
isPreview: false
isDeprecated: false
type: class
properties:
