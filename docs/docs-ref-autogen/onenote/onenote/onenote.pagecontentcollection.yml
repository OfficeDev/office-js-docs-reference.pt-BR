  uid: onenote!OneNote.PageContentCollection#context:member
  package: onenote!
  fullName: context
  summary: O contexto de solicitação associado ao objeto. Isso conecta o processo do Office do aplicativo host.
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'context: RequestContext;'
    return:
      type: <xref uid="onenote!OneNote.RequestContext:class" />
- name: count
  uid: onenote!OneNote.PageContentCollection#count:member
  package: onenote!
  fullName: count
  summary: Retorna a quantidade de conteúdo da página no conjunto. Somente leitura.
  remarks: '\[[Conjunto de API: OneNoteApi 1.1](/office/dev/add-ins/reference/requirement-sets/onenote-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'readonly count: number;'
    return:
      type: number
- name: items
  uid: onenote!OneNote.PageContentCollection#items:member
  package: onenote!
  fullName: items
  summary: Obtém os itens filhos carregados nesta coleção.
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'readonly items: OneNote.PageContent[];'
    return:
      type: <xref uid="onenote!OneNote.PageContent:class" />[]
methods:
- name: getItem(index)
  uid: onenote!OneNote.PageContentCollection#getItem:member(1)
  package: onenote!
  fullName: getItem(index)
  summary: Obtém um objeto PageContent pela ID ou pelo índice na coleção. Somente leitura.
  remarks: '\[[Conjunto de API: OneNoteApi 1.1](/office/dev/add-ins/reference/requirement-sets/onenote-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'getItem(index: number | string): OneNote.PageContent;'
    parameters:
    - id: index
      description: A ID do objeto PageContent ou o local do índice do objeto PageContent na coleção.
      type: number | string
    return:
      type: <xref uid="onenote!OneNote.PageContent:class" />
      description: ''
- name: getItemAt(index)
  uid: onenote!OneNote.PageContentCollection#getItemAt:member(1)
  package: onenote!
  fullName: getItemAt(index)
  summary: Obtém um conteúdo de página na posição dela na coleção.
  remarks: >-
    \[[Conjunto de API: OneNoteApi 1.1](/office/dev/add-ins/reference/requirement-sets/onenote-api-requirement-sets) \]


    #### <a name="examples"></a>Exemplos


    ```typescript

    await OneNote.run(async (context) => {

        var page = context.application.getActivePage();
        var pageContents = page.contents;
        var firstPageContent = pageContents.getItemAt(0);
        firstPageContent.load('type');

        // Run the queued commands, and return a promise to indicate task completion.
        await context.sync();

        console.log("The first page content item is of type: " + firstPageContent.type);
        await context.sync();
    });

    ```
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'getItemAt(index: number): OneNote.PageContent;'
    parameters:
    - id: index
      description: Valor de índice do objeto a ser recuperado. Indexados com zero.
      type: number
    return:
      type: <xref uid="onenote!OneNote.PageContent:class" />
      description: ''
- name: load(options)
  uid: onenote!OneNote.PageContentCollection#load:member(1)
  package: onenote!
  fullName: load(options)
  summary: Coloca um comando na fila para carregar as propriedades especificadas do objeto. Você deve chamar `context.sync()` antes de ler as propriedades.
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'load(options?: OneNote.Interfaces.PageContentCollectionLoadOptions & OneNote.Interfaces.CollectionLoadOptions): OneNote.PageContentCollection;'
    parameters:
    - id: options
      description: Fornece opções para quais propriedades do objeto deve ser carregado.
      type: <xref uid="onenote!OneNote.Interfaces.PageContentCollectionLoadOptions:interface" /> & <xref uid="onenote!OneNote.Interfaces.CollectionLoadOptions:interface" />
    return:
      type: <xref uid="onenote!OneNote.PageContentCollection:class" />
      description: ''
- name: load(propertyNames)
  uid: onenote!OneNote.PageContentCollection#load:member(2)
  package: onenote!
  fullName: load(propertyNames)
  summary: Coloca um comando na fila para carregar as propriedades especificadas do objeto. Você deve chamar `context.sync()` antes de ler as propriedades.
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'load(propertyNames?: string | string[]): OneNote.PageContentCollection;'
    parameters:
    - id: propertyNames
      description: Uma cadeia de caracteres delimitada por vírgulas ou uma matriz de cadeias de caracteres que especificam as propriedades a ser carregadas.
      type: string | string[]
    return:
      type: <xref uid="onenote!OneNote.PageContentCollection:class" />
      description: "\n\n#### <a name=\"examples\"></a>Exemplos\n\n```typescript\nawait OneNote.run(async (context) => {\n\n    // Get the collection of pageContent items from the page.\n    var pageContents = context.application.getActivePage().contents;\n\n    // Queue a command to load the type of each pageContent.\n    pageContents.load(\"type\");\n\n    // Run the queued commands, and return a promise to indicate task completion.\n    await context.sync();\n\n    $.each(pageContents.items, function(index, pageContent) {\n        console.log(\"PageContent type: \" + pageContent.type);\n    });\n});\n```"
- name: load(propertyNamesAndPaths)
  uid: onenote!OneNote.PageContentCollection#load:member(3)
  package: onenote!
  fullName: load(propertyNamesAndPaths)
  summary: Coloca um comando na fila para carregar as propriedades especificadas do objeto. Você deve chamar `context.sync()` antes de ler as propriedades.
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'load(propertyNamesAndPaths?: OfficeExtension.LoadOption): OneNote.PageContentCollection;'
    parameters:
    - id: propertyNamesAndPaths
      description: '`propertyNamesAndPaths.select` é uma cadeia de caracteres delimitada por vírgulas que especifica as propriedades a ser carregadas e `propertyNamesAndPaths.expand` é uma cadeia de caracteres delimitada por vírgulas que especifica as propriedades de navegação a ser carregadas.'
      type: <xref uid="office!OfficeExtension.LoadOption:interface" />
    return:
      type: <xref uid="onenote!OneNote.PageContentCollection:class" />
