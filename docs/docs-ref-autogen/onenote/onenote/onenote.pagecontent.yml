methods:
- name: delete()
  uid: onenote!OneNote.PageContent#delete:member(1)
  package: onenote!
  fullName: delete()
  summary: Exclui o objeto PageContent.
  remarks: >-
    \[[Conjunto de API: OneNoteApi 1.1](/office/dev/add-ins/reference/requirement-sets/onenote-api-requirement-sets) \]


    #### <a name="examples"></a>Exemplos


    ```javascript

    OneNote.run(function (context) {

        var page = context.application.getActivePage();
        var pageContents = page.contents;

        var firstPageContent = pageContents.getItemAt(0);
        firstPageContent.load('type');

        // Run the queued commands, and return a promise to indicate task completion.
        return context.sync()
            .then(function () {
                if(firstPageContent.isNull === false) {
                    firstPageContent.delete();
                    return context.sync();
                }
            });
    })

    .catch(function(error) {
        console.log("Error: " + error);
        if (error instanceof OfficeExtension.Error) {
            console.log("Debug info: " + JSON.stringify(error.debugInfo));
        }
    });

    ```
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'delete(): void;'
    return:
      type: void
      description: ''
