- name: ocrData
  uid: onenote!OneNote.Image#ocrData:member
  package: onenote!
  fullName: ocrData
  summary: Obtém os dados obtidos por OCR (reconhecimento óptico de caracteres) dessa imagem, como texto OCR e idioma.
  remarks: "\\[[Conjunto de API: OneNoteApi 1.1](/office/dev/add-ins/reference/requirement-sets/onenote-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>Exemplos\n\n```typescript\nvar image = null;\n\nawait OneNote.run(async (context) => {\n    // Get the current outline.\n    var outline = context.application.getActiveOutline();\n\n    // Queue a command to load paragraphs and their types.\n    outline.load(\"paragraphs\")\n    await context.sync();\n\n    for (var i=0; i < outline.paragraphs.items.length; i++) {\n        var paragraph = outline.paragraphs.items[i];\n        if (paragraph.type == \"Image\")\n        {\n            image = paragraph.image;\n        }\n    }\n    if (image != null) {\n        image.load(\"ocrData\");\n    }\n\n    await context.sync();\n            \n    // Log ocrText and ocrLanguageId.\n    console.log(image.ocrData.ocrText);\n    console.log(image.ocrData.ocrLanguageId);\n});\n```"
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'readonly ocrData: OneNote.ImageOcrData;'
    return:
      type: <xref uid="onenote!OneNote.ImageOcrData:interface" />
