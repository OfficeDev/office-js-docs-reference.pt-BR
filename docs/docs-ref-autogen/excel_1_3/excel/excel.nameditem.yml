methods:
- name: getRange()
  uid: excel!Excel.NamedItem#getRange:member(1)
  package: excel!
  fullName: getRange()
  summary: Retorna o objeto Range associado ao nome. Gerará um erro se o tipo do item nomeado não for um intervalo.
  remarks: "\\[[Conjunto de API: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>Exemplos\n\n```typescript\n// Returns the Range object that is associated with the name.\n// Returns `null` if the name is not of type Range.\n// Note: This API currently supports only the Workbook scoped items.\nawait Excel.run(async (context) => { \n    var names = context.workbook.names;\n    var range = names.getItem('MyRange').getRange();\n    range.load('address');\n    await context.sync();\n\n    console.log(range.address);\n});\n```"
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'getRange(): Excel.Range;'
    return:
      type: <xref uid="excel!Excel.Range:class" />
      description: ''
