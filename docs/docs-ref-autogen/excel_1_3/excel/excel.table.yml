- name: convertToRange()
  uid: excel!Excel.Table#convertToRange:member(1)
  package: excel!
  fullName: convertToRange()
  summary: Converte a tabela em um intervalo de células normal. Todos os dados são preservados.
  remarks: "\\[[Conjunto de API: ExcelApi 1.2](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>Exemplos\n\n```typescript\nawait Excel.run(async (context) => { \n    var tableName = 'Table1';\n    var table = context.workbook.tables.getItem(tableName);\n    table.convertToRange();\n    await context.sync(); \n});\n```"
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'convertToRange(): Excel.Range;'
    return:
      type: <xref uid="excel!Excel.Range:class" />
