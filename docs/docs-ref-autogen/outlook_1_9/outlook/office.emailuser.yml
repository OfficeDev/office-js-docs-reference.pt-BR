### YamlMime:TSType
name: Office.EmailUser
uid: outlook!Office.EmailUser:interface
package: outlook!
fullName: Office.EmailUser
summary: >-
  Representa uma conta de email em um Exchange Server.


  `EmailUser`os objetos são recebidos principalmente [em entidades MeetingSuggestion](xref:outlook!Office.MeetingSuggestion:interface) e [TaskSuggestion](xref:outlook!Office.TaskSuggestion:interface) extraídas de um Outlook item. Para saber mais sobre esse cenário, consulte [Extract entity strings from an Outlook item](https://docs.microsoft.com/office/dev/add-ins/outlook/extract-entity-strings-from-an-item)<!-- -->.
remarks: "**[Nível mínimo de permissão](https://docs.microsoft.com/office/dev/add-ins/outlook/understanding-outlook-add-in-permissions) <!-- -->**:`ReadItem`\n\n**[Modo Outlook aplicável](https://docs.microsoft.com/office/dev/add-ins/outlook/outlook-add-ins-overview#extension-points) <!-- -->**: Leitura\n\n#### <a name=\"examples\"></a>Exemplos\n\n```javascript\n// The following example is an excerpt from a larger sample.\n// For the full sample, visit https://docs.microsoft.com/office/dev/add-ins/outlook/extract-entity-strings-from-an-item.\n\n// Gets instances of the task suggestion entity on the item.\nfunction myGetTaskSuggestions()\n{\n    var htmlText = \"\";\n\n    // Gets an array of TaskSuggestion objects, each array element \n    // containing an instance of a task suggestion entity from \n    // the current item.\n    var tasksArray = _MyEntities.taskSuggestions;\n\n    // Iterates through each instance of a task suggestion.\n    for (var i = 0; i < tasksArray.length; i++)\n    {\n        // Gets the string that was identified as a task suggestion.\n        htmlText += \"TaskString : <span>\" + \n        tasksArray[i].taskString + \"</span><br/>\";\n\n        // Gets an array of assignees for that instance of a task \n        // suggestion. Each assignee is represented by an \n        // EmailUser object.\n        var assigneesArray = tasksArray[i].assignees;\n        for (var j = 0; j < assigneesArray.length; j++)\n        {\n            htmlText += \"Assignee : ( \";\n            // Gets the displayName property of the assignee.\n            htmlText += \"displayName = <span>\" + assigneesArray[j].displayName + \n            \"</span> , \";\n\n            // Gets the emailAddress property of each assignee.\n            // This is the SMTP address of the assignee.\n            htmlText += \"emailAddress = <span>\" + assigneesArray[j].emailAddress + \n                \"</span>\";\n\n            htmlText += \" )<br/>\";\n        }\n\n        htmlText += \"<hr/>\";\n    }\n\n    document.getElementById(\"entities_box\").innerHTML = htmlText;\n}\n```"
