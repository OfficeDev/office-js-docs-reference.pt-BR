### YamlMime:TSType
name: OfficeRuntime.Auth
uid: office-runtime!OfficeRuntime.Auth:interface
package: office-runtime!
fullName: OfficeRuntime.Auth
summary: Interface que contém APIs relacionadas à autorização.
remarks: Os métodos nesta interface são equivalentes aos da `Office.auth` interface. Se novos tipos de autenticação são adicionados no futuro, eles serão adicionados apenas à `Office.auth` interface. Para simplificar, os exemplos de código em toda a documentação usam `Office.auth`<!-- -->.
isPreview: false
isDeprecated: false
type: interface
methods:
- name: getAccessToken(options)
  uid: office-runtime!OfficeRuntime.Auth#getAccessToken:member(1)
  package: office-runtime!
  fullName: getAccessToken(options)
  summary: >-
    Chama o ponto de extremidade do Azure Active Directory V 2.0 para obter um token de acesso para o aplicativo Web do seu suplemento. Permite que os complementos identifiquem os usuários. O código do lado do servidor pode usar esse token para acessar o Microsoft Graph aplicativo Web do complemento usando o [fluxo "on behalf of" OAuth](https://docs.microsoft.com/azure/active-directory/develop/active-directory-v2-protocols-oauth-on-behalf-of)<!-- -->. Essa API exige uma configuração de logon única que preencha o suplemento para um aplicativo do Azure. Os usuários do Office entram com Contas Organizacionais e Contas da Microsoft. O Microsoft Azure retorna tokens destinados a ambos os tipos de conta de usuário para acessar recursos no Microsoft Graph.


    **Importante**: Outlook, essa API não será suportada se o complemento for carregado em uma caixa de correio Outlook.com ou Gmail.
  remarks: '**Hosts**: Excel, Outlook, PowerPoint, Word'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'getAccessToken(options?: AuthOptions): Promise<string>;'
    parameters:
    - id: options
      description: Opcional. Aceita um `AuthOptions` objeto para definir comportamentos de login.
      type: <xref uid="office-runtime!OfficeRuntime.AuthOptions:interface" />
    return:
      type: Promise&lt;string&gt;
      description: Promessa ao token de acesso.
