### YamlMime:TSType
name: Office.DialogParentMessageReceivedEventArgs
uid: office!Office.DialogParentMessageReceivedEventArgs:interface
package: office!
fullName: Office.DialogParentMessageReceivedEventArgs
summary: >-
  Fornece informações sobre a mensagem da página pai que gerou o `DialogParentMessageReceived` evento.


  Para adicionar um manipulador de eventos para o `DialogParentMessageReceived` evento, use o `addHandlerAsync` método do [Office. Objeto UI](xref:office!Office.UI:interface).
remarks: ''
isPreview: false
isDeprecated: false
type: interface
properties:
- name: message
  uid: office!Office.DialogParentMessageReceivedEventArgs#message:member
  package: office!
  fullName: message
  summary: Obtém o conteúdo da mensagem enviada da página pai, que pode ser qualquer cadeia de caracteres ou dados stringified.
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'message: string;'
    return:
      type: string
- name: origin
  uid: office!Office.DialogParentMessageReceivedEventArgs#origin:member
  package: office!
  fullName: origin
  summary: Obtém o domínio da página pai que chamou `Dialog.messageChild`<!-- -->.
  remarks: '**Conjunto de requisitos**: [DialogOrigin 1.1](https://docs.microsoft.com/javascript/api/requirement-sets/common/dialog-origin-requirement-sets)<!-- -->. A propriedade está `undefined` em clientes que não suportam esse conjunto de requisitos.'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'origin: string | undefined;'
    return:
      type: string | undefined
- name: type
  uid: office!Office.DialogParentMessageReceivedEventArgs#type:member
  package: office!
  fullName: type
  summary: Obtém uma [Office. Valor de enumeração EventType](xref:office!Office.EventType:enum) que identifica o tipo de evento que foi gerado.
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'type: EventType;'
    return:
      type: <xref uid="office!Office.EventType:enum" />
