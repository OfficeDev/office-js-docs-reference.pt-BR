### YamlMime:TSType
name: OfficeExtension.ClientObject
uid: office!OfficeExtension.ClientObject:class
package: office!
fullName: OfficeExtension.ClientObject
summary: Um objeto proxy abstrato que representa um objeto em um Office documento. Você cria objetos proxy do contexto (ou de outros objetos proxy), adiciona comandos a uma fila para agir no objeto e sincroniza o estado do objeto proxy com o documento chamando `context.sync()`<!-- -->.
remarks: ''
isPreview: false
isDeprecated: false
type: class
properties:
- name: context
  uid: office!OfficeExtension.ClientObject#context:member
  package: office!
  fullName: context
  summary: O contexto de solicitação associado ao objeto
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'context: ClientRequestContext;'
    return:
      type: <xref uid="office!OfficeExtension.ClientRequestContext:class" />
- name: isNullObject
  uid: office!OfficeExtension.ClientObject#isNullObject:member
  package: office!
  fullName: isNullObject
  summary: Retorna um valor booleano para saber se o objeto correspondente é um objeto nulo. Você deve chamar `context.sync()` antes de ler a propriedade isNullObject.
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'isNullObject: boolean;'
    return:
      type: boolean
