### YamlMime:TSType
name: Office.Auth
uid: office!Office.Auth:interface
package: office!
fullName: Office.Auth
summary: O namespace Office Auth,`Office.auth`<!-- -->, fornece um método que permite que o Office cliente obtenha um token de acesso ao aplicativo Web do complemento. Indiretamente, isso também habilita o suplemento para acessar os dados do Microsoft Graph do usuário sem exigir que o usuário se conecte uma segunda vez.
remarks: ''
isPreview: false
isDeprecated: false
type: interface
methods:
- name: getAccessToken(options)
  uid: office!Office.Auth#getAccessToken:member(1)
  package: office!
  fullName: getAccessToken(options)
  summary: Chama o ponto de extremidade do Azure Active Directory V 2.0 para obter um token de acesso para o aplicativo Web do seu suplemento. Permite que os complementos identifiquem os usuários. O código do lado do servidor pode usar esse token para acessar o Microsoft Graph aplicativo Web do complemento usando o [fluxo OAuth "on behalf of"](https://docs.microsoft.com/azure/active-directory/develop/active-directory-v2-protocols-oauth-on-behalf-of)<!-- -->. Essa API exige uma configuração de logon única que preencha o suplemento para um aplicativo do Azure. Office usuários entrar com Contas Organizacionais e Contas da Microsoft. O Microsoft Azure retorna tokens destinados a ambos os tipos de conta de usuário para acessar recursos no Microsoft Graph.
  remarks: >-
    **Hosts**: Excel, OneNote, Outlook, PowerPoint, Word


    **Importante**: no Outlook, essa API não será suportada se o complemento for carregado em uma caixa de correio Outlook.com ou Gmail.


    **Conjunto de requisitos**: [IdentityAPI 1.3](https://docs.microsoft.com/javascript/api/requirement-sets/common/identity-api-requirement-sets)
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'getAccessToken(options?: AuthOptions): Promise<string>;'
    parameters:
    - id: options
      description: Opcional. Aceita um objeto `AuthOptions` para definir comportamentos de login.
      type: <xref uid="office!Office.AuthOptions:interface" />
    return:
      type: Promise&lt;string&gt;
      description: Promessa ao token de acesso.
- name: getAccessTokenAsync(options, callback)
  uid: office!Office.Auth#getAccessTokenAsync:member(1)
  package: office!
  fullName: getAccessTokenAsync(options, callback)
  summary: >-
    Chama o ponto de extremidade do Azure Active Directory V 2.0 para obter um token de acesso para o aplicativo Web do seu suplemento. Permite que os complementos identifiquem os usuários. O código do lado do servidor pode usar esse token para acessar o Microsoft Graph aplicativo Web do complemento usando o [fluxo OAuth "on behalf of"](https://docs.microsoft.com/azure/active-directory/develop/active-directory-v2-protocols-oauth-on-behalf-of)<!-- -->.


    **Importante**: no Outlook, essa API não será suportada se o complemento for carregado em uma caixa de correio Outlook.com ou Gmail.


    **Aviso**: `getAccessTokenAsync` foi preterido. Use em `Office.auth.getAccessToken` vez disso.
  remarks: >-
    **Hosts**: Excel, OneNote, Outlook, PowerPoint, Word


    **Conjunto de requisitos**: [IdentityAPI 1.3](https://docs.microsoft.com/javascript/api/requirement-sets/common/identity-api-requirement-sets)


    Essa API exige uma configuração de logon única que preencha o suplemento para um aplicativo do Azure. Office usuários entrar com Contas Organizacionais e Contas da Microsoft. O Microsoft Azure retorna tokens destinados a ambos os tipos de conta de usuário para acessar recursos no Microsoft Graph.


    #### <a name="examples"></a>Exemplos


    ```javascript

    Office.context.auth.getAccessTokenAsync(function(result) {
        if (result.status === "succeeded") {
            var token = result.value;
            // ...
        } else {
            console.log("Error obtaining token", result.error);
        }
    });

    ```
  isPreview: false
  isDeprecated: true
  customDeprecatedMessage: Use `Office.auth.getAccessToken` instead.
  syntax:
    content: 'getAccessTokenAsync(options?: AuthOptions, callback?: (result: AsyncResult<string>) => void): void;'
    parameters:
    - id: options
      description: Opcional. Aceita um objeto `AuthOptions` para definir comportamentos de login.
      type: <xref uid="office!Office.AuthOptions:interface" />
    - id: callback
      description: Opcional. Aceita um método de retorno que possa analisar o token de ID de usuário ou usar o token fluxo "em nome de" para obter acesso ao Microsoft Graph. Se `AsyncResult.status` for "bem-sucedido", o `AsyncResult.value` valor bruto AAD v. token de acesso 2.0 formatado.
      type: '(result: <xref uid="office!Office.AsyncResult:interface" />&lt;string&gt;) =&gt; void'
    return:
      type: void
      description: ''
