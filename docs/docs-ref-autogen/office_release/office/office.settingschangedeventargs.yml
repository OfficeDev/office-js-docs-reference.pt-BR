### YamlMime:TSType
name: Office.SettingsChangedEventArgs
uid: office!Office.SettingsChangedEventArgs:interface
package: office!
fullName: Office.SettingsChangedEventArgs
summary: >-
  Fornece informações sobre as configurações que geraram o evento settingsChanged.


  Para adicionar um manipulador de eventos para o evento settingsChanged, use o método addHandlerAsync do [objeto Office.Configurações.](xref:office!Office.Settings:interface)


  O evento settingsChanged é acionada somente quando o script do seu complemento chama o método Configurações.saveAsync para manter a cópia na memória das configurações no arquivo de documento. O evento settingsChanged não é disparado quando os métodos Settings.set ou Settings.remove são chamados.


  O evento settingsChanged foi projetado para permitir que você lida com possíveis conflitos quando dois ou mais usuários estão tentando salvar configurações ao mesmo tempo quando seu complemento é usado em um documento compartilhado (coautor).


  **Importante**: o código do seu complemento pode registrar um manipulador para o evento settingsChanged quando o complemento estiver em execução com qualquer cliente do Excel, mas o evento será acionado somente quando o complemento for carregado com uma planilha aberta no Excel na Web e mais de um usuário estiver editando a planilha (coautor). Portanto, efetivamente, o evento settingsChanged é suportado somente Excel na Web em cenários de coautor.
remarks: ''
isPreview: false
