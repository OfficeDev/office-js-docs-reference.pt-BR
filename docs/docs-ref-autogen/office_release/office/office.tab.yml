### YamlMime:TSType
name: Office.Tab
uid: office!Office.Tab:interface
package: office!
fullName: Office.Tab
summary: Representa uma guia individual e o estado que ela deve ter. Para exemplos de código, consulte [Enable and Disable Add-in Commands](https://docs.microsoft.com/office/dev/add-ins/design/disable-add-in-commands) and [Create custom contextual tabs](https://docs.microsoft.com/office/dev/add-ins/design/contextual-tabs)<!-- -->.
remarks: '**Conjunto de requisitos**: [RibbonAPI 1.1](https://docs.microsoft.com/javascript/api/requirement-sets/common/ribbon-api-requirement-sets)'
isPreview: false
isDeprecated: false
type: interface
properties:
- name: controls
  uid: office!Office.Tab#controls:member
  package: office!
  fullName: controls
  summary: Especifica um ou mais controles na guia, como itens de menu, botões, etc.
  remarks: Quando o `Tab` objeto faz parte de uma [Office. Objeto RibbonUpdaterData](xref:office!Office.RibbonUpdaterData:interface) passado para o método `requestUpdate` Office[. Faixa de Opções](xref:office!Office.Ribbon:interface)<!-- -->, essa propriedade especifica as IDs dos controles cujo status habilitado deve ser alterado. No entanto, se houver `groups` uma propriedade na guia, `controls` essa propriedade será ignorada e as propriedades dos grupos especificados devem ser usadas para alterar o status habilitado.
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'controls?: Control[];'
    return:
      type: <xref uid="office!Office.Control:interface" />[]
- name: groups
  uid: office!Office.Tab#groups:member
  package: office!
  fullName: groups
  summary: Especifica um ou mais grupos de controle na guia.
  remarks: >-
    Quando o `Tab` objeto faz parte de uma [Office. Objeto RibbonUpdaterData](xref:office!Office.RibbonUpdaterData:interface) passado para o método `requestUpdate` Office[. Faixa de Opções](xref:office!Office.Ribbon:interface)<!-- -->, as `controls` propriedades dos vários [Office. Os](xref:office!Office.Group:interface) objetos group especificam quais controles têm seu status habilitado alterado; a `controls` propriedade do `Tab` objeto é ignorada.


    **Conjunto de requisitos**: [RibbonAPI 1.1](https://docs.microsoft.com/javascript/api/requirement-sets/common/ribbon-api-requirement-sets)
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'groups?: Group[];'
    return:
      type: <xref uid="office!Office.Group:interface" />[]
- name: id
  uid: office!Office.Tab#id:member
  package: office!
  fullName: id
  summary: Identificador da guia conforme especificado no manifesto.
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'id: string;'
    return:
      type: string
- name: visible
  uid: office!Office.Tab#visible:member
  package: office!
  fullName: visible
  summary: Especifica se a guia está visível na faixa de opções. Usado apenas com guias contextuais.
  remarks: '**Conjunto de requisitos**: [RibbonAPI 1.2](https://docs.microsoft.com/javascript/api/requirement-sets/common/ribbon-api-requirement-sets)'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'visible?: boolean;'
    return:
      type: boolean
