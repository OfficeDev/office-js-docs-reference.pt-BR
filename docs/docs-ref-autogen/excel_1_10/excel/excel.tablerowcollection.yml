- name: getItemAt(index)
  uid: excel!Excel.TableRowCollection#getItemAt:member(1)
  package: excel!
  fullName: getItemAt(index)
  summary: >-
    Obtém uma linha com base em sua posição na coleção.


    Observe que, diferentemente de intervalos ou colunas, que se ajustarão se novas linhas ou colunas são adicionadas antes delas, um objeto representa o `TableRow` local físico da linha de tabela, mas não os dados. Ou seja, se os dados são organizados ou se novas linhas são adicionadas, uma linha de tabela continuará a apontar para o índice para o qual foi criado.
  remarks: >-
    \[[Conjunto de API: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]


    #### <a name="examples"></a>Exemplos


    ```typescript

    await Excel.run(async (context) => {
        var tablerow = context.workbook.tables.getItem('Table1').rows.getItemAt(0);
        tablerow.load('values');
        await context.sync();
        console.log(tablerow.values);
    });

    ```
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'getItemAt(index: number): Excel.TableRow;'
    parameters:
    - id: index
      description: Valor de índice do objeto a ser recuperado. Indexados com zero.
      type: number
    return:
      type: <xref uid="excel!Excel.TableRow:class" />
      description: ''
