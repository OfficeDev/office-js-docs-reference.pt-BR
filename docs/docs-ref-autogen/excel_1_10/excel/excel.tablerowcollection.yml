methods:
- name: add(index, values, alwaysInsert)
  uid: excel!Excel.TableRowCollection#add:member(1)
  package: excel!
  fullName: add(index, values, alwaysInsert)
  summary: >-
    Adiciona uma ou mais linhas à tabela. O objeto de retorno será a parte superior das linhas adicionadas recentemente.


    Observe que, diferentemente de intervalos ou colunas, que se ajustarão se novas linhas ou colunas são adicionadas antes delas, um objeto representa o `TableRow` local físico da linha de tabela, mas não os dados. Ou seja, se os dados são organizados ou se novas linhas são adicionadas, uma linha de tabela continuará a apontar para o índice para o qual foi criado.
  remarks: "\\[[Conjunto de API: ExcelApi 1.1 para adicionar uma única linha; 1.4 permite adicionar várias linhas.](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>Exemplos\n\n```typescript\nawait Excel.run(async (context) => { \n    var tables = context.workbook.tables;\n    var values = [[\"Sample\", \"Values\", \"For\", \"New\", \"Row\"]];\n    var row = tables.getItem(\"Table1\").rows.add(null, values);\n    row.load('index');\n    await context.sync();\n    \n    console.log(row.index);\n});\n```"
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'add(index?: number, values?: Array<Array<boolean | string | number>> | boolean | string | number, alwaysInsert?: boolean): Excel.TableRow;'
    parameters:
    - id: index
      description: Opcional. Especifica a posição relativa da nova linha. Se for null ou -1, a adição ocorre no final. Todas as linhas abaixo da linha inserida serão deslocadas para baixo. Indexado com zero.
      type: number
    - id: values
      description: Opcional. Uma matriz 2D de valores não formatados da linha de tabela.
      type: Array&lt;Array&lt;boolean | string | number&gt;&gt; | boolean | string | number
    - id: alwaysInsert
      description: ''
      type: boolean
    return:
      type: <xref uid="excel!Excel.TableRow:class" />
      description: ''
