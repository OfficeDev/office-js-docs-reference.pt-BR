### YamlMime:TSEnum
name: Excel.CalcErrorCellValueSubType
uid: excel!Excel.CalcErrorCellValueSubType:enum
package: excel!
fullName: Excel.CalcErrorCellValueSubType
summary: Representa tipos de \# CALC! errors.
remarks: '\[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
isPreview: true
isDeprecated: false
fields:
- name: arrayOfArrays
  uid: excel!Excel.CalcErrorCellValueSubType.arrayOfArrays:member
  package: excel!
  summary: Um erro causado pela inclusão de uma matriz em uma matriz. Exibe como tipo de erro \# CALC! em Excel.
  value: "\"ArrayOfArrays\""
- name: arrayOfRanges
  uid: excel!Excel.CalcErrorCellValueSubType.arrayOfRanges:member
  package: excel!
  summary: Um erro causado pela inclusão de um intervalo em uma matriz. Exibe como tipo de erro \# CALC! em Excel.
  value: "\"ArrayOfRanges\""
- name: dataTableReferencedPendingFormula
  uid: excel!Excel.CalcErrorCellValueSubType.dataTableReferencedPendingFormula:member
  package: excel!
  summary: Um erro causado por uma tabela de dados fazendo referência a uma fórmula pendente. A fórmula pendente provavelmente é assíncrona. Exibe como tipo de erro \# CALC! em Excel.
  value: "\"DataTableReferencedPendingFormula\""
- name: emptyArray
  uid: excel!Excel.CalcErrorCellValueSubType.emptyArray:member
  package: excel!
  summary: Um erro causado por uma matriz vazia. Exibe como tipo de erro \# CALC! em Excel.
  value: "\"EmptyArray\""
- name: lambdaInCell
  uid: excel!Excel.CalcErrorCellValueSubType.lambdaInCell:member
  package: excel!
  summary: Um erro causado pela avaliação da fórmula de uma célula a um valor lambda. Exibe como tipo de erro \# CALC! em Excel.
  value: "\"LambdaInCell\""
- name: tooManyCells
  uid: excel!Excel.CalcErrorCellValueSubType.tooManyCells:member
  package: excel!
  summary: Um erro causado por uma função fazendo referência a muitas células. Exibe como tipo de erro \# CALC! em Excel.
  value: "\"TooManyCells\""
- name: unknown
  uid: excel!Excel.CalcErrorCellValueSubType.unknown:member
  package: excel!
  summary: Um tipo desconhecido de erro. Exibe como tipo de erro \# CALC! em Excel.
  value: "\"Unknown\""
- name: unsupportedLifting
  uid: excel!Excel.CalcErrorCellValueSubType.unsupportedLifting:member
  package: excel!
  summary: Um erro causado pela tentativa de levantar uma fórmula sem suporte (como uma UDF dinâmica) sobre uma matriz. Exibe como tipo de erro \# CALC! em Excel.
  value: "\"UnsupportedLifting\""
