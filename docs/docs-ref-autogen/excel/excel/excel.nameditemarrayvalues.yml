- name: valuesAsJson
  uid: excel!Excel.NamedItemArrayValues#valuesAsJson:member
  package: excel!
  fullName: valuesAsJson
  summary: Uma representação JSON dos valores nesta matriz de item nomeada. Ao contrário `NamedItemArrayValues.values`<!-- -->, `NamedItemArrayValues.valuesAsJson` oferece suporte a todos os tipos de dados que podem estar em uma célula. Exemplos incluem valores de número formatados e imagens da Web, além dos valores padrão booleano, número e cadeia de caracteres. Os dados retornados dessa API sempre se alinham com a localidade en-US. Para recuperar dados na localidade de exibição do usuário, use `NamedItemArrayValues.valuesAsJsonLocal`<!-- -->.
  remarks: '\[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'readonly valuesAsJson: CellValue[][];'
    return:
      type: <xref uid="excel!Excel.CellValue:type" />[][]
- name: valuesAsJsonLocal
  uid: excel!Excel.NamedItemArrayValues#valuesAsJsonLocal:member
  package: excel!
  fullName: valuesAsJsonLocal
  summary: Uma representação JSON dos valores nesta matriz de item nomeada. Ao contrário `NamedItemArrayValues.values`<!-- -->, `NamedItemArrayValues.valuesAsJsonLocal` oferece suporte a todos os tipos de dados que podem estar em uma célula. Exemplos incluem valores de número formatados e imagens da Web, além dos valores padrão booleano, número e cadeia de caracteres. Os dados retornados dessa API sempre se alinham com a localidade de exibição do usuário. Para recuperar dados independentes da localidade, use `NamedItemArrayValues.valuesAsJson`<!-- -->.
  remarks: '\[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'readonly valuesAsJsonLocal: CellValue[][];'
    return:
      type: <xref uid="excel!Excel.CellValue:type" />[][]
