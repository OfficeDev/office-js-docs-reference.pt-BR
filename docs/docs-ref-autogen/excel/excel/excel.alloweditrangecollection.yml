- name: add(title, rangeAddress, options)
  uid: excel!Excel.AllowEditRangeCollection#add:member(1)
  package: excel!
  fullName: add(title, rangeAddress, options)
  summary: Adiciona um `AllowEditRange` objeto à coleção. A proteção de planilha deve ser desabilitada ou pausada para que esse método funcione corretamente. Se a proteção da planilha estiver habilitada e não pausada, esse método lançará um erro e a `AccessDenied` operação de adicionar falhará.
  remarks: '\[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'add(title: string, rangeAddress: string, options?: Excel.AllowEditRangeOptions): void;'
    parameters:
    - id: title
      description: A cadeia de caracteres de título `AllowEditRange` do objeto a ser adicionado.
      type: string
    - id: rangeAddress
      description: O endereço de intervalo do `AllowEditRange` objeto a ser adicionado.
      type: string
    - id: options
      description: Opções adicionais a serem adicionadas ao `AllowEditRange` objeto, como a senha.
      type: <xref uid="excel!Excel.AllowEditRangeOptions:interface" />
    return:
      type: void
      description: ''
