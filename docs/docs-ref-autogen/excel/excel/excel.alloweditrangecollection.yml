name: Excel.AllowEditRangeCollection
uid: excel!Excel.AllowEditRangeCollection:class
package: excel!
fullName: Excel.AllowEditRangeCollection
summary: Representa o conjunto de `AllowEditRange` objetos encontrados em uma planilha. `AllowEditRange` os objetos funcionam com propriedades de proteção de planilha. Quando a proteção da planilha está habilitada, um objeto pode ser usado para permitir a edição de um intervalo específico, mantendo a proteção no restante `AllowEditRange` da planilha.
remarks: '\[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
isPreview: true
isDeprecated: false
type: class
