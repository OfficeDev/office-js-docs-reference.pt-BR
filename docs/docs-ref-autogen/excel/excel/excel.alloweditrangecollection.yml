- name: pauseProtection(password)
  uid: excel!Excel.AllowEditRangeCollection#pauseProtection:member(1)
  package: excel!
  fullName: pauseProtection(password)
  summary: Pausa a proteção da planilha para todos os objetos da coleção que têm a `AllowEditRange` senha dada para o usuário em uma determinada sessão. Esse método só pausa a proteção para os objetos se a proteção da planilha `AllowEditRange` estiver habilitada e não pausada. Se a proteção da planilha não puder ser pausada, esse método lançará um erro e falhará ao pausar a `UnsupportedOperation` proteção para o intervalo. Se a senha não corresponder a nenhum objeto na coleção, esse método lançará um erro e falhará ao pausar a proteção para qualquer `AllowEditRange` `BadPassword` intervalo na coleção.
  remarks: '\[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'pauseProtection(password: string): void;'
    parameters:
    - id: password
      description: A senha para pausar a proteção nos `AllowEditRange` objetos.
      type: string
    return:
      type: void
      description: ''
