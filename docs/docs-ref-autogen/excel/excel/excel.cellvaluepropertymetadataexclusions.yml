isDeprecated: false
type: interface
properties:
- name: autoComplete
  uid: excel!Excel.CellValuePropertyMetadataExclusions#autoComplete:member
  package: excel!
  fullName: autoComplete
  summary: True representa que a propriedade é excluída das propriedades mostradas pela conclusão automática. False e indefinido representam o comportamento padrão de incluir a propriedade.
  remarks: '\[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'autoComplete?: boolean;'
    return:
      type: boolean
- name: calcCompare
  uid: excel!Excel.CellValuePropertyMetadataExclusions#calcCompare:member
  package: excel!
  fullName: calcCompare
  summary: True representa que a propriedade é excluída das propriedades usadas para comparar valores de células durante o recalcal. False e indefinido representam o comportamento padrão de incluir a propriedade.
  remarks: '\[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'calcCompare?: boolean;'
    return:
      type: boolean
- name: cardView
  uid: excel!Excel.CellValuePropertyMetadataExclusions#cardView:member
  package: excel!
  fullName: cardView
  summary: True representa que a propriedade é excluída das propriedades mostradas pelo exibição de cartão. False e indefinido representam o comportamento padrão de incluir a propriedade.
  remarks: '\[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'cardView?: boolean;'
    return:
      type: boolean
- name: dotNotation
  uid: excel!Excel.CellValuePropertyMetadataExclusions#dotNotation:member
  package: excel!
  fullName: dotNotation
  summary: True representa que a propriedade é excluída das propriedades que podem ser acessadas por meio da função FIELDVALUE. False e indefinido representam o comportamento padrão de incluir a propriedade.
  remarks: '\[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
