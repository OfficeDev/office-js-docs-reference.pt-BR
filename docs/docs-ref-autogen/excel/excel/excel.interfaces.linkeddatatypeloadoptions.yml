name: Excel.Interfaces.LinkedDataTypeLoadOptions
uid: excel!Excel.Interfaces.LinkedDataTypeLoadOptions:interface
package: excel!
fullName: Excel.Interfaces.LinkedDataTypeLoadOptions
summary: >-
  Representa um tipo de dados vinculado. Um tipo de dados vinculado é um tipo de dados conectado a uma fonte de dados online.


  \[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets)\]
remarks: ''
isPreview: true
isDeprecated: false
type: interface
properties:
- name: $all
  uid: excel!Excel.Interfaces.LinkedDataTypeLoadOptions#$all:member
  package: excel!
  fullName: $all
  summary: 'A `$all` especificação do LoadOptions carrega todas as propriedades escalares (por exemplo: `Range.address`<!-- -->), mas não as propriedades de navegação (por exemplo: `Range.format.fill.color`<!-- -->).'
  remarks: ''
  isPreview: true
  isDeprecated: false
  syntax:
    content: '$all?: boolean;'
    return:
      type: boolean
- name: dataProvider
  uid: excel!Excel.Interfaces.LinkedDataTypeLoadOptions#dataProvider:member
  package: excel!
  fullName: dataProvider
  summary: >-
    O nome do provedor de dados do tipo de dados vinculado. Isso pode mudar quando as informações são recuperadas do serviço.


    \[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets)\]
  remarks: ''
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'dataProvider?: boolean;'
    return:
      type: boolean
- name: lastRefreshed
  uid: excel!Excel.Interfaces.LinkedDataTypeLoadOptions#lastRefreshed:member
  package: excel!
  fullName: lastRefreshed
  summary: >-
    A data e a hora do fuso horário local desde que a lista de trabalho foi aberta quando o tipo de dados vinculado foi atualizado pela última vez. Retorna `undefined` se o tipo de dados vinculado não tiver sido atualizado.


    \[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets)\]
  remarks: ''
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'lastRefreshed?: boolean;'
    return:
      type: boolean
- name: name
  uid: excel!Excel.Interfaces.LinkedDataTypeLoadOptions#name:member
  package: excel!
  fullName: name
  summary: >-
