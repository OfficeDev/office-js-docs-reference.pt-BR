name: Excel.ConnectErrorCellValueSubType
uid: excel!Excel.ConnectErrorCellValueSubType:enum
package: excel!
fullName: Excel.ConnectErrorCellValueSubType
summary: Representa tipos de \# CONNECT! errors.
remarks: '\[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
isPreview: true
isDeprecated: false
fields:
- name: dataTypeNoConnection
  uid: excel!Excel.ConnectErrorCellValueSubType.dataTypeNoConnection:member
  package: excel!
  summary: Um erro causado por nenhuma conexão de serviço para tipos de dados vinculados. Exibe como tipo de erro \# CONNECT! em Excel.
  value: "\"DataTypeNoConnection\""
- name: dataTypeServiceError
  uid: excel!Excel.ConnectErrorCellValueSubType.dataTypeServiceError:member
  package: excel!
  summary: Um erro causado por um problema no serviço para tipos de dados vinculados. Exibe como tipo de erro \# CONNECT! em Excel.
  value: "\"DataTypeServiceError\""
- name: externalLinks
  uid: excel!Excel.ConnectErrorCellValueSubType.externalLinks:member
  package: excel!
  summary: Um erro causado por um problema com os links externos. Exibe como tipo de erro \# CONNECT! em Excel.
  value: "\"ExternalLinks\""
- name: externalLinksAccessFailed
  uid: excel!Excel.ConnectErrorCellValueSubType.externalLinksAccessFailed:member
  package: excel!
  summary: Um erro causado por uma falha ao acessar links externos. Exibe como tipo de erro \# CONNECT! em Excel.
  value: "\"ExternalLinksAccessFailed\""
- name: externalLinksFailedToRefresh
  uid: excel!Excel.ConnectErrorCellValueSubType.externalLinksFailedToRefresh:member
  package: excel!
  summary: Um erro causado por links externos que não foram atualizados. Exibe como tipo de erro \# CONNECT! em Excel.
  value: "\"ExternalLinksFailedToRefresh\""
- name: externalLinksFileTooLarge
  uid: excel!Excel.ConnectErrorCellValueSubType.externalLinksFileTooLarge:member
  package: excel!
  summary: Um erro causado por um link externo para um arquivo que excede a capacidade de tamanho do arquivo. Exibe como tipo de erro \# CONNECT! em Excel.
  value: "\"ExternalLinksFileTooLarge\""
- name: externalLinksInvalidRequest
  uid: excel!Excel.ConnectErrorCellValueSubType.externalLinksInvalidRequest:member
  package: excel!
  summary: Um erro causado por uma solicitação inválida ao resolver um link externo. Exibe como tipo de erro \# CONNECT! em Excel.
  value: "\"ExternalLinksInvalidRequest\""
- name: externalLinksNonCloudLocation
  uid: excel!Excel.ConnectErrorCellValueSubType.externalLinksNonCloudLocation:member
  package: excel!
  summary: Um erro causado por um link externo para um local que não seja de nuvem, como um link para um arquivo Excel que é salvo em um computador local, em vez de em um local de nuvem. Exibe como tipo de erro \# CONNECT! em Excel.
  value: "\"ExternalLinksNonCloudLocation\""
- name: externalLinksServerError
  uid: excel!Excel.ConnectErrorCellValueSubType.externalLinksServerError:member
  package: excel!
  summary: Um erro causado por um erro de servidor ao resolver um link externo. Exibe como tipo de erro \# CONNECT! em Excel.
  value: "\"ExternalLinksServerError\""
- name: externalLinksThrottledByHost
  uid: excel!Excel.ConnectErrorCellValueSubType.externalLinksThrottledByHost:member
  package: excel!
  summary: Um erro causado pela throttling de um host de link externo. Exibe como tipo de erro \# CONNECT! em Excel.
  value: "\"ExternalLinksThrottledByHost\""
- name: externalLinksUnAuthenticated
  uid: excel!Excel.ConnectErrorCellValueSubType.externalLinksUnAuthenticated:member
  package: excel!
  summary: Um erro causado pela falta de autenticação para links externos. Exibe como tipo de erro \# CONNECT! em Excel.
  value: "\"ExternalLinksUnAuthenticated\""
- name: genericServerError
  uid: excel!Excel.ConnectErrorCellValueSubType.genericServerError:member
  package: excel!
  summary: Um erro causado por um erro retornado do servidor. Exibe como tipo de erro \# CONNECT! em Excel.
  value: "\"GenericServerError\""
- name: missingContent
  uid: excel!Excel.ConnectErrorCellValueSubType.missingContent:member
  package: excel!
  summary: Um erro causado pela falta de conteúdo. Exibe como tipo de erro \# CONNECT! em Excel.
  value: "\"MissingContent\""
- name: outdatedLinkedEntity
  uid: excel!Excel.ConnectErrorCellValueSubType.outdatedLinkedEntity:member
  package: excel!
  summary: Um erro causado por uma entidade vinculada desatualizada. Exibe como tipo de erro \# CONNECT! em Excel.
  value: "\"OutdatedLinkedEntity\""
- name: requestThrottle
  uid: excel!Excel.ConnectErrorCellValueSubType.requestThrottle:member
  package: excel!
  summary: Um erro causado pela throttling de solicitação. Exibe como tipo de erro \# CONNECT! em Excel.
  value: "\"RequestThrottle\""
- name: serviceError
  uid: excel!Excel.ConnectErrorCellValueSubType.serviceError:member
  package: excel!
  summary: Um erro causado por um problema com o serviço. Exibe como tipo de erro \# CONNECT! em Excel.
  value: "\"ServiceError\""
- name: unknown
  uid: excel!Excel.ConnectErrorCellValueSubType.unknown:member
  package: excel!
  summary: Um tipo desconhecido de erro. Exibe como tipo de erro \# CONNECT! em Excel.
  value: "\"Unknown\""
