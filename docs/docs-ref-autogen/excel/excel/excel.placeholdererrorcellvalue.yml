name: Excel.PlaceholderErrorCellValue
uid: excel!Excel.PlaceholderErrorCellValue:interface
package: excel!
fullName: Excel.PlaceholderErrorCellValue
summary: Representa o valor de uma célula que contém um \#BUSY! . Esse tipo de erro é usado como um espaço reservado enquanto o valor de uma célula é baixado.
remarks: '\[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
isPreview: true
isDeprecated: false
type: interface
properties:
- name: basicType
  uid: excel!Excel.PlaceholderErrorCellValue#basicType:member
  package: excel!
  fullName: basicType
  summary: Representa o valor que seria retornado por uma `Range.valueTypes` célula com esse valor.
  remarks: '\[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'basicType?: RangeValueType.error | "Error";'
    return:
      type: <xref uid="excel!Excel.RangeValueType.error:member" /> | "Error"
- name: basicValue
  uid: excel!Excel.PlaceholderErrorCellValue#basicValue:member
  package: excel!
  fullName: basicValue
  summary: Representa o valor que seria retornado por uma `Range.values` célula com esse valor. Quando acessado por meio de uma propriedade, esse valor de cadeia de caracteres se alinha com a `valuesAsJson` localidade en-US. Quando acessado por meio de `valuesAsJsonLocal` uma propriedade, esse valor de cadeia de caracteres se alinha com a localidade de exibição do usuário.
  remarks: '\[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'basicValue?: "#BUSY!" | string;'
    return:
      type: "\"#BUSY!\" | string"
