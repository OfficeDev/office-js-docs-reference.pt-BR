  fullName: target
  summary: '`PlaceholderErrorCellValue` é usado durante o processamento, enquanto os dados são baixados. A `target` propriedade representa os dados que estão baixando, os dados para os quais o `PlaceholderErrorCellValue` objeto é um espaço reservado.'
  remarks: '\[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
