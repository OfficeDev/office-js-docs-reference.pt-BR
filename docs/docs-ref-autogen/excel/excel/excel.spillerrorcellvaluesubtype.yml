### YamlMime:TSEnum
name: Excel.SpillErrorCellValueSubType
uid: excel!Excel.SpillErrorCellValueSubType:enum
package: excel!
fullName: Excel.SpillErrorCellValueSubType
summary: Representa tipos de \# SPILL! errors.
remarks: '\[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
isPreview: true
isDeprecated: false
fields:
- name: collision
  uid: excel!Excel.SpillErrorCellValueSubType.collision:member
  package: excel!
  summary: Um erro causado por uma matriz dinâmica tentando vazar dados em uma célula que não está vazia. Exibe como tipo de erro \# SPILL! em Excel.
  value: "\"Collision\""
- name: indeterminateSize
  uid: excel!Excel.SpillErrorCellValueSubType.indeterminateSize:member
  package: excel!
  summary: Um erro causado por uma fórmula de matriz dinâmica que não pode ser avaliada em um único cálculo. Exibe como tipo de erro \# SPILL! em Excel.
  value: "\"IndeterminateSize\""
- name: mergedCell
  uid: excel!Excel.SpillErrorCellValueSubType.mergedCell:member
  package: excel!
  summary: Um erro causado por uma célula mesclada bloqueando uma matriz dinâmica. Exibe como tipo de erro \# SPILL! em Excel.
  value: "\"MergedCell\""
- name: outOfMemoryWhileCalc
  uid: excel!Excel.SpillErrorCellValueSubType.outOfMemoryWhileCalc:member
  package: excel!
  summary: Um erro causado pela memória insuficiente ao tentar calcular uma fórmula de matriz dinâmica. Exibe como tipo de erro \# SPILL! em Excel.
  value: "\"OutOfMemoryWhileCalc\""
- name: table
  uid: excel!Excel.SpillErrorCellValueSubType.table:member
  package: excel!
  summary: Um erro causado pela inserção de uma fórmula de matriz dinâmica em uma tabela. Exibe como tipo de erro \# SPILL! em Excel.
  value: "\"Table\""
- name: unknown
  uid: excel!Excel.SpillErrorCellValueSubType.unknown:member
  package: excel!
  summary: Um tipo desconhecido de erro. Exibe como tipo de erro \# SPILL! em Excel.
  value: "\"Unknown\""
- name: worksheetEdge
  uid: excel!Excel.SpillErrorCellValueSubType.worksheetEdge:member
  package: excel!
  summary: Um erro causado por uma matriz dinâmica que tenta derrubar a borda da planilha. Exibe como tipo de erro \# SPILL! em Excel.
  value: "\"WorksheetEdge\""
