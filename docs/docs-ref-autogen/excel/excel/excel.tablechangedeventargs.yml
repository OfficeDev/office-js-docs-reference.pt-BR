  uid: excel!Excel.TableChangedEventArgs#type:member
  package: excel!
  fullName: type
  summary: Obtém o tipo do evento. Consulte `Excel.EventType` para obter detalhes.
  remarks: '\[[Conjunto de API: ExcelApi 1.7](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
