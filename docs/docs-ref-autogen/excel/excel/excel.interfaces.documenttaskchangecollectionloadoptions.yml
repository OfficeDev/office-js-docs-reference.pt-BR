    content: 'assignee?: boolean;'
    return:
      type: boolean
- name: changedBy
  uid: excel!Excel.Interfaces.DocumentTaskChangeCollectionLoadOptions#changedBy:member
  package: excel!
  fullName: changedBy
  summary: 'Para CADA ITEM na coleção: Representa o usuário que criou ou alterou a tarefa.'
  remarks: '\[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'changedBy?: boolean;'
    return:
      type: boolean
- name: commentId
  uid: excel!Excel.Interfaces.DocumentTaskChangeCollectionLoadOptions#commentId:member
  package: excel!
  fullName: commentId
  summary: 'Para CADA ITEM na coleção: Representa a ID do ou ao qual a alteração `Comment` `CommentReply` de tarefa está ancorada.'
