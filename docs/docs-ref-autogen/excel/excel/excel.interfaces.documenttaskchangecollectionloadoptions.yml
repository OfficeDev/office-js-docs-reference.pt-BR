  uid: excel!Excel.Interfaces.DocumentTaskChangeCollectionLoadOptions#type:member
  package: excel!
  fullName: type
  summary: 'Para CADA ITEM na coleção: Representa o tipo de ação do registro de alteração de tarefa. Alguns exemplos de tipos de ação são `assign`<!-- -->, `undo`<!-- -->e `setPriority`<!-- -->.'
  remarks: '\[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'type?: boolean;'
    return:
      type: boolean
