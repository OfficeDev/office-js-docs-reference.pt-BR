- name: createdDateTime
  uid: excel!Excel.Interfaces.DocumentTaskChangeCollectionLoadOptions#createdDateTime:member
  package: excel!
  fullName: createdDateTime
  summary: 'Para CADA ITEM na coleção: Representa a data e a hora de criação do registro de alteração de tarefa. Todas as datas estão em UTC.'
  remarks: '\[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'createdDateTime?: boolean;'
    return:
      type: boolean
- name: dueDateTime
  uid: excel!Excel.Interfaces.DocumentTaskChangeCollectionLoadOptions#dueDateTime:member
  package: excel!
  fullName: dueDateTime
  summary: 'Para CADA ITEM na coleção: representa a data e a hora de vencimento da tarefa, no fuso horário UTC. Ele é usado para o tipo `setSchedule` de registro de alteração. Pode ser definido como para remover a data e a hora de `null` vencimento. Ele deve ser definido em conjunto com `startDateTime` para evitar conflitos.'
  remarks: '\[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'dueDateTime?: boolean;'
    return:
      type: boolean
- name: id
  uid: excel!Excel.Interfaces.DocumentTaskChangeCollectionLoadOptions#id:member
  package: excel!
  fullName: id
  summary: 'Para CADA ITEM da coleção: ID do registro de alteração de tarefa.'
  remarks: '\[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'id?: boolean;'
    return:
      type: boolean
- name: percentComplete
  uid: excel!Excel.Interfaces.DocumentTaskChangeCollectionLoadOptions#percentComplete:member
  package: excel!
  fullName: percentComplete
  summary: 'Para CADA ITEM na coleção: Representa a porcentagem de conclusão da tarefa. Ele é usado para o tipo `setPercentComplete` de registro de alteração. Esse é um valor entre 0 e 100, onde 100 representa uma tarefa concluída. Alterar esse valor para 100 também conclui o comentário associado. Alterar a conclusão de 100 para um valor inferior reativa o comentário associado.'
  remarks: '\[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'percentComplete?: boolean;'
    return:
      type: boolean
- name: priority
  uid: excel!Excel.Interfaces.DocumentTaskChangeCollectionLoadOptions#priority:member
  package: excel!
  fullName: priority
  summary: 'Para CADA ITEM na coleção: representa a prioridade da tarefa. Ele é usado para o tipo `setPriority` de registro de alteração. Esse é um valor entre 0 e 10, sendo 5 a prioridade padrão se não estiver definida e onde 0 representa a prioridade mais alta.'
  remarks: '\[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'priority?: boolean;'
    return:
      type: boolean
- name: startDateTime
  uid: excel!Excel.Interfaces.DocumentTaskChangeCollectionLoadOptions#startDateTime:member
  package: excel!
  fullName: startDateTime
  summary: 'Para CADA ITEM na coleção: Representa a data e a hora de início da tarefa, no fuso horário UTC. Ele é usado para o tipo `setSchedule` de registro de alteração. Pode ser definido como `null` para remover a data e a hora de início. Ele deve ser definido em conjunto com `dueDateTime` para evitar conflitos.'
  remarks: '\[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'startDateTime?: boolean;'
    return:
      type: boolean
