  uid: excel!Excel.Interfaces.DocumentTaskChangeCollectionLoadOptions#title:member
  package: excel!
  fullName: title
  summary: 'Para CADA ITEM na coleção: Representa o título da tarefa. Ele é usado para o tipo `setTitle` de registro de alteração.'
  remarks: '\[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
