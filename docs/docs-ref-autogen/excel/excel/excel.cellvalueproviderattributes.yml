### YamlMime:TSType
name: Excel.CellValueProviderAttributes
uid: excel!Excel.CellValueProviderAttributes:interface
package: excel!
fullName: Excel.CellValueProviderAttributes
summary: >-
  O objeto attributes do provedor representa o conjunto de detalhes usados na exibição de cartão para fornecer informações de identidade visual especificadas para um tipo que oferece suporte a atributos `CellValue` do provedor.


  \[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]
remarks: ''
isPreview: false
isDeprecated: false
type: interface
properties:
- name: description
  uid: excel!Excel.CellValueProviderAttributes#description:member
  package: excel!
  fullName: description
  summary: >-
    Representa a propriedade de descrição do provedor usada no exibição de cartão se nenhum logotipo for especificado. Se um logotipo for especificado, ele será usado como texto da dica de ferramenta.


    \[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'description?: string;'
    return:
      type: string
- name: logoSourceAddress
  uid: excel!Excel.CellValueProviderAttributes#logoSourceAddress:member
  package: excel!
  fullName: logoSourceAddress
  summary: >-
    Representa uma URL usada para baixar uma imagem que será usada como um logotipo no exibição de cartão.


    \[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'logoSourceAddress?: string;'
    return:
      type: string
- name: logoTargetAddress
  uid: excel!Excel.CellValueProviderAttributes#logoTargetAddress:member
  package: excel!
  fullName: logoTargetAddress
  summary: >-
    Representa uma URL que será o destino de navegação se o usuário clicar no elemento logo no modo de exibição de cartão.


    \[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'logoTargetAddress?: string;'
    return:
      type: string
