### YamlMime:TSType
name: Excel.WorksheetMovedEventArgs
uid: excel!Excel.WorksheetMovedEventArgs:interface
package: excel!
fullName: Excel.WorksheetMovedEventArgs
summary: >-
  Notifica quando uma planilha é movida dentro de uma pasta de trabalho.


  Se uma planilha for movida de uma posição dentro da pasta de trabalho para outra por meio da interface do usuário Excel, essa API disparará um evento. Observe que, se a posição de uma planilha mudar como resultado da movimentação de uma planilha diferente, esse evento não disparará para ambas as alterações de posição. Esse evento dispara apenas para a movimentação da planilha primária, e não qualquer alteração de posição da planilha que ocorre como resultado dessa movimentação primária.
remarks: '\[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
isPreview: true
isDeprecated: false
type: interface
