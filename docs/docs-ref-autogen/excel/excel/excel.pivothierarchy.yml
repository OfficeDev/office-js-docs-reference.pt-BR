- name: fields
  uid: excel!Excel.PivotHierarchy#fields:member
  package: excel!
  fullName: fields
  summary: Retorna PivotFields associados a PivotHierarchy.
  remarks: >-
    \[[Conjunto de API: ExcelApi 1.8](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]


    #### <a name="examples"></a>Exemplos


    ```typescript

    // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/excel/38-pivottable/pivottable-pivotfilters.yaml

    await Excel.run(async (context) => {
      // Add a PivotFilter to filter on the values correlated with a row.

      // Get the PivotTable.
      const pivotTable = context.workbook.worksheets.getActiveWorksheet().pivotTables.getItem("Farm Sales");

      // Get the "Farm" field.
      const field = pivotTable.hierarchies.getItem("Farm").fields.getItem("Farm");

      // Filter to only include rows with more than 500 wholesale crates sold.
      const filter: Excel.PivotValueFilter = {
        condition: Excel.ValueFilterCondition.greaterThan,
        comparator: 500,
        value: "Sum of Crates Sold Wholesale"
      };

      // Apply the value filter to the field.
      field.applyFilter({ valueFilter: filter });

      await context.sync();
    });

    ```
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'readonly fields: Excel.PivotFieldCollection;'
    return:
      type: <xref uid="excel!Excel.PivotFieldCollection:class" />
