- name: text
  uid: excel!Excel.Interfaces.RangeViewLoadOptions#text:member
  package: excel!
  fullName: text
  summary: Valores de texto do intervalo especificado. O valor de texto não depende da largura da célula. A \# substituição de sinal que acontece Excel interface do usuário não afetará o valor de texto retornado pela API.
  remarks: '\[[Conjunto de API: ExcelApi 1.3](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'text?: boolean;'
    return:
      type: boolean
- name: values
  uid: excel!Excel.Interfaces.RangeViewLoadOptions#values:member
  package: excel!
  fullName: values
  summary: 'Representa os valores brutos da exibição do intervalo especificado. Os dados retornados podem ser dos tipos: cadeia de caracteres, número ou booliano. Células que contêm um erro retornarão a cadeia de caracteres de erro.'
  remarks: '\[[Conjunto de API: ExcelApi 1.3](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'values?: boolean;'
    return:
      type: boolean
- name: valuesAsJson
  uid: excel!Excel.Interfaces.RangeViewLoadOptions#valuesAsJson:member
  package: excel!
  fullName: valuesAsJson
  summary: Uma representação JSON dos valores nas células nesse intervalo. Ao contrário `RangeView.values`<!-- -->, `RangeView.valuesAsJson` oferece suporte a todos os tipos de dados que podem estar em uma célula. Exemplos incluem valores de número formatados e imagens da Web, além dos valores padrão booleano, número e cadeia de caracteres. Os dados retornados dessa API sempre se alinham com a localidade en-US. Para recuperar dados na localidade de exibição do usuário, use `RangeView.valuesAsJsonLocal`<!-- -->.
  remarks: '\[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'valuesAsJson?: boolean;'
    return:
      type: boolean
- name: valuesAsJsonLocal
  uid: excel!Excel.Interfaces.RangeViewLoadOptions#valuesAsJsonLocal:member
  package: excel!
  fullName: valuesAsJsonLocal
  summary: Uma representação JSON dos valores nas células nesse intervalo. Ao contrário `RangeView.values`<!-- -->, `RangeView.valuesAsJsonLocal` oferece suporte a todos os tipos de dados que podem estar em uma célula. Exemplos incluem valores de número formatados e imagens da Web, além dos valores padrão booleano, número e cadeia de caracteres. Os dados retornados dessa API sempre se alinham com a localidade de exibição do usuário. Para recuperar dados independentes da localidade, use `RangeView.valuesAsJson`<!-- -->.
  remarks: '\[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'valuesAsJsonLocal?: boolean;'
    return:
      type: boolean
