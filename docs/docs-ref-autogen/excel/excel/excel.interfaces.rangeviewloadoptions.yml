- name: formulas
  uid: excel!Excel.Interfaces.RangeViewLoadOptions#formulas:member
  package: excel!
  fullName: formulas
  summary: Representa a fórmula em notação A1. Se uma célula não tiver fórmula, seu valor será retornado.
