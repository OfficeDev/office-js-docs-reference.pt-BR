- name: valuesAsJson
  uid: excel!Excel.Interfaces.RangeViewCollectionLoadOptions#valuesAsJson:member
  package: excel!
  fullName: valuesAsJson
  summary: 'Para CADA ITEM na coleção: uma representação JSON dos valores nas células nesse intervalo. Ao contrário `RangeView.values`<!-- -->, `RangeView.valuesAsJson` oferece suporte a todos os tipos de dados que podem estar em uma célula. Exemplos incluem valores de número formatados e imagens da Web, além dos valores padrão booleano, número e cadeia de caracteres. Os dados retornados dessa API sempre se alinham com a localidade en-US. Para recuperar dados na localidade de exibição do usuário, use `RangeView.valuesAsJsonLocal`<!-- -->.'
  remarks: '\[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'valuesAsJson?: boolean;'
    return:
      type: boolean
- name: valuesAsJsonLocal
  uid: excel!Excel.Interfaces.RangeViewCollectionLoadOptions#valuesAsJsonLocal:member
  package: excel!
  fullName: valuesAsJsonLocal
  summary: 'Para CADA ITEM na coleção: uma representação JSON dos valores nas células nesse intervalo. Ao contrário `RangeView.values`<!-- -->, `RangeView.valuesAsJsonLocal` oferece suporte a todos os tipos de dados que podem estar em uma célula. Exemplos incluem valores de número formatados e imagens da Web, além dos valores padrão booleano, número e cadeia de caracteres. Os dados retornados dessa API sempre se alinham com a localidade de exibição do usuário. Para recuperar dados independentes da localidade, use `RangeView.valuesAsJson`<!-- -->.'
  remarks: '\[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
