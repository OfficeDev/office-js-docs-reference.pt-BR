- name: setPassword(password)
  uid: excel!Excel.WorksheetProtection#setPassword:member(1)
  package: excel!
  fullName: setPassword(password)
  summary: Altera a senha associada ao `WorksheetProtection` objeto. Definir a senha como uma cadeia de caracteres vazia ("") ou como `null` removerá a proteção de senha do `WorksheetProtection` objeto. A proteção de planilha deve ser habilitada e pausada para que esse método funcione corretamente. Se a proteção da planilha estiver desabilitada, esse método lançará um `InvalidOperation` erro e falhará ao alterar a senha. Se a proteção da planilha estiver habilitada e não pausada, `AccessDenied` esse método lançará um erro e falhará ao alterar a senha.
  remarks: '\[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'setPassword(password?: string): void;'
    parameters:
    - id: password
      description: A senha associada ao `WorksheetProtection` objeto.
      type: string
    return:
      type: void
      description: ''
