- name: pauseProtection(password)
  uid: excel!Excel.WorksheetProtection#pauseProtection:member(1)
  package: excel!
  fullName: pauseProtection(password)
  summary: Pausa a proteção da planilha para o objeto de planilha determinado para o usuário em uma determinada sessão. Se a senha estiver incorreta, esse método lançará um `UnsupportedOperation` erro e falhará ao pausar a proteção. Este método não alterará o estado de proteção se a proteção da planilha não estiver habilitada ou já estiver pausada.
  remarks: '\[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
