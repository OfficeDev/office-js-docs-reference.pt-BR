properties:
- name: writable
  uid: excel!Excel.CellValueExtraProperties#writable:member
  package: excel!
  fullName: writable
  summary: Representa se isso `CellValue` será usado para substituir uma célula. Quando false, as APIs que usariam isso `CellValue` para substituir uma célula ignorarão esse valor sem lançar um erro. O valor padrão é true.
  remarks: '\[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'writable?: boolean;'
    return:
      type: boolean
- name: writableNote
  uid: excel!Excel.CellValueExtraProperties#writableNote:member
  package: excel!
  fullName: writableNote
  summary: 'Representa uma explicação sobre por que `CellValue.writable` é especificado como false. Observação: essa cadeia de caracteres só estará disponível se `writable` for especificada como false.'
  remarks: '\[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
