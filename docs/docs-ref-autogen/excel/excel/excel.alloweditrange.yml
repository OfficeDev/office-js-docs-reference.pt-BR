      type: boolean
- name: title
  uid: excel!Excel.AllowEditRange#title:member
  package: excel!
  fullName: title
  summary: Especifica o título do objeto. A proteção de planilha deve ser desabilitada ou pausada para que esse método funcione corretamente. Se a proteção da planilha estiver habilitada e não pausada, esse método lançará um erro e falhará `AccessDenied` ao definir o título. Se já existir uma cadeia de caracteres com a mesma cadeia de caracteres ou se a cadeia de caracteres estiver ou vazia (""), esse método lançará um erro e falhará ao `AllowEditRange` `null` definir o `InvalidArgument` título.
  remarks: '\[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'title: string;'
    return:
      type: string
