- name: pauseProtection(password)
  uid: excel!Excel.AllowEditRange#pauseProtection:member(1)
  package: excel!
  fullName: pauseProtection(password)
  summary: Pausa a proteção da planilha para o `AllowEditRange` objeto dado para o usuário em uma determinada sessão. Esse método só pausa a proteção do objeto se a proteção da planilha `AllowEditRange` estiver habilitada e não pausada. Se a proteção da planilha não puder ser pausada, esse método lançará um erro e falhará ao pausar a `UnsupportedOperation` proteção para o intervalo. Se a senha estiver incorreta, esse método lançará um erro e falhará ao pausar a `InvalidArgument` proteção para o intervalo.
  remarks: '\[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'pauseProtection(password?: string): void;'
    parameters:
    - id: password
      description: A senha associada ao `AllowEditRange` objeto.
      type: string
    return:
      type: void
      description: ''
