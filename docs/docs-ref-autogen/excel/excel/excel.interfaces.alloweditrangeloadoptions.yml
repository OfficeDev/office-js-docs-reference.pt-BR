### YamlMime:TSType
name: Excel.Interfaces.AllowEditRangeLoadOptions
uid: excel!Excel.Interfaces.AllowEditRangeLoadOptions:interface
package: excel!
fullName: Excel.Interfaces.AllowEditRangeLoadOptions
summary: Representa um `AllowEditRange` objeto encontrado em uma planilha. Esse objeto funciona com propriedades de proteção de planilha. Quando a proteção da planilha está habilitada, um objeto pode ser usado para permitir a edição de um intervalo específico, mantendo a proteção no restante `AllowEditRange` da planilha.
remarks: '\[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
isPreview: true
isDeprecated: false
type: interface
properties:
- name: $all
  uid: excel!Excel.Interfaces.AllowEditRangeLoadOptions#$all:member
  package: excel!
  fullName: $all
  summary: 'A `$all` especificação do LoadOptions carrega todas as propriedades escalares (por exemplo: `Range.address`<!-- -->), mas não as propriedades de navegação (por exemplo: `Range.format.fill.color`<!-- -->).'
  remarks: ''
  isPreview: true
  isDeprecated: false
  syntax:
    content: '$all?: boolean;'
    return:
      type: boolean
- name: address
  uid: excel!Excel.Interfaces.AllowEditRangeLoadOptions#address:member
  package: excel!
  fullName: address
  summary: Especifica o intervalo associado ao objeto. A proteção de planilha deve ser desabilitada ou pausada para que esse método funcione corretamente. Se a proteção da planilha estiver habilitada e não pausada, esse método lançará um erro e falhará `AccessDenied` ao definir o intervalo.
  remarks: '\[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'address?: boolean;'
    return:
      type: boolean
- name: isPasswordProtected
  uid: excel!Excel.Interfaces.AllowEditRangeLoadOptions#isPasswordProtected:member
  package: excel!
  fullName: isPasswordProtected
  summary: Especifica se a `AllowEditRange` senha está protegida.
  remarks: '\[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'isPasswordProtected?: boolean;'
    return:
      type: boolean
- name: title
  uid: excel!Excel.Interfaces.AllowEditRangeLoadOptions#title:member
  package: excel!
  fullName: title
  summary: Especifica o título do objeto. A proteção de planilha deve ser desabilitada ou pausada para que esse método funcione corretamente. Se a proteção da planilha estiver habilitada e não pausada, esse método lançará um erro e falhará `AccessDenied` ao definir o título. Se já existir uma cadeia de caracteres com a mesma cadeia de caracteres ou se a cadeia de caracteres estiver ou vazia (""), esse método lançará um erro e falhará ao `AllowEditRange` `null` definir o `InvalidArgument` título.
  remarks: '\[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'title?: boolean;'
    return:
      type: boolean
