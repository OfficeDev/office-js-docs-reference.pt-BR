### YamlMime:TSType
name: Excel.FormattedNumberCellValue
uid: excel!Excel.FormattedNumberCellValue:interface
package: excel!
fullName: Excel.FormattedNumberCellValue
summary: Representa o valor de uma célula que contém um número com uma cadeia de caracteres de formato. As cadeias de caracteres de formato de número devem estar em conformidade Excel diretrizes. Para saber mais, confira [Revisar diretrizes para personalizar um formato de número](https://support.microsoft.com/office/review-guidelines-for-customizing-a-number-format-c0a1d1fa-d3f4-4018-96b7-9c9354dd99f5)<!-- -->. Nesse cenário, o formato é aplicado ao valor e não à célula, portanto, o valor mantém sua cadeia de caracteres de formato ao longo do cálculo.
remarks: '\[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
isPreview: true
isDeprecated: false
type: interface
properties:
- name: basicType
  uid: excel!Excel.FormattedNumberCellValue#basicType:member
  package: excel!
  fullName: basicType
  summary: Representa o valor que seria retornado por `Range.valueTypes` uma célula com esse valor.
  remarks: '\[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'basicType?: RangeValueType.double | "Double";'
    return:
