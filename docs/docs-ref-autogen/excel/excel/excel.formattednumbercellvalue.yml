### YamlMime:TSType
name: Excel.FormattedNumberCellValue
uid: excel!Excel.FormattedNumberCellValue:interface
package: excel!
fullName: Excel.FormattedNumberCellValue
summary: >-
  Representa o valor de uma célula que contém um número com uma cadeia de caracteres de formato. As cadeias de caracteres de formato de número devem estar em conformidade Excel diretrizes. Para saber mais, confira [Revisar diretrizes para personalizar um formato de número](https://support.microsoft.com/office/review-guidelines-for-customizing-a-number-format-c0a1d1fa-d3f4-4018-96b7-9c9354dd99f5)<!-- -->. Nesse cenário, o formato é aplicado ao valor e não à célula, portanto, o valor mantém sua cadeia de caracteres de formato ao longo do cálculo.


  \[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]
remarks: ''
isPreview: false
isDeprecated: false
type: interface
properties:
- name: numberFormat
  uid: excel!Excel.FormattedNumberCellValue#numberFormat:member
  package: excel!
  fullName: numberFormat
  summary: >-
    Retorna a cadeia de caracteres de formato de número usada para exibir esse valor. As cadeias de caracteres de formato de número devem estar em conformidade Excel diretrizes. Para saber mais, confira [Revisar diretrizes para personalizar um formato de número](https://support.microsoft.com/office/review-guidelines-for-customizing-a-number-format-c0a1d1fa-d3f4-4018-96b7-9c9354dd99f5)<!-- -->.


    \[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'numberFormat: string;'
    return:
      type: string
