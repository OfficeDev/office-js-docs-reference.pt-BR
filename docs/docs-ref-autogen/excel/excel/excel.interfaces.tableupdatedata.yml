- name: name
  uid: excel!Excel.Interfaces.TableUpdateData#name:member
  package: excel!
  fullName: name
  summary: >-
    Nome da tabela.


    O nome definido da tabela deve seguir as diretrizes especificadas no [artigo Renomear Excel tabela.](https://support.microsoft.com/office/fbf49a4f-82a3-43eb-8ba2-44d21233b114)
