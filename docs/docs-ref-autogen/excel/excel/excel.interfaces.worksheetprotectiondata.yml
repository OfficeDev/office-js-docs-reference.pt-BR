  fullName: allowEditRanges
  summary: Especifica o objeto `AllowEditRangeCollection` encontrado nesta planilha. Esta é uma coleção de objetos `AllowEditRange` , que funcionam com propriedades de proteção de planilha. Quando a proteção da planilha está habilitada, `AllowEditRange` um objeto pode ser usado para permitir a edição de um intervalo específico, mantendo a proteção no restante da planilha.
