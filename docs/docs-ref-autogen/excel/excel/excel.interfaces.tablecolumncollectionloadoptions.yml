  uid: excel!Excel.Interfaces.TableColumnCollectionLoadOptions#filter:member
  package: excel!
  fullName: filter
  summary: 'Para CADA ITEM na coleção: Recupera o filtro aplicado à coluna.'
  remarks: '\[[Conjunto de API: ExcelApi 1.2](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'filter?: Excel.Interfaces.FilterLoadOptions;'
    return:
      type: <xref uid="excel!Excel.Interfaces.FilterLoadOptions:interface" />
- name: id
  uid: excel!Excel.Interfaces.TableColumnCollectionLoadOptions#id:member
  package: excel!
  fullName: id
  summary: 'Para CADA ITEM na coleção: retorna uma chave exclusiva que identifica a coluna dentro da tabela.'
  remarks: '\[[Conjunto de API: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'id?: boolean;'
    return:
      type: boolean
- name: index
  uid: excel!Excel.Interfaces.TableColumnCollectionLoadOptions#index:member
  package: excel!
  fullName: index
  summary: 'Para CADA ITEM na coleção: Retorna o número de índice da coluna dentro da coleção de colunas da tabela. Indexados com zero.'
  remarks: '\[[Conjunto de API: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'index?: boolean;'
    return:
      type: boolean
- name: name
  uid: excel!Excel.Interfaces.TableColumnCollectionLoadOptions#name:member
  package: excel!
  fullName: name
  summary: 'Para CADA ITEM da coleção: Especifica o nome da coluna da tabela.'
  remarks: '\[[Conjunto de API: ExcelApi 1.1 para obter o nome; 1,4 para defini-lo.](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'name?: boolean;'
    return:
      type: boolean
- name: values
  uid: excel!Excel.Interfaces.TableColumnCollectionLoadOptions#values:member
  package: excel!
  fullName: values
  summary: 'Para CADA ITEM na coleção: Representa os valores brutos do intervalo especificado. Os dados retornados podem ser uma cadeia de caracteres, número ou booleano. Células que contêm um erro retornarão a cadeia de caracteres de erro. Se o valor retornado começar com um sinal de mais ("+"), menos ("-"), ou igual ("="), Excel interpretará esse valor como uma fórmula.'
  remarks: '\[[Conjunto de API: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'values?: boolean;'
    return:
      type: boolean
- name: valuesAsJson
  uid: excel!Excel.Interfaces.TableColumnCollectionLoadOptions#valuesAsJson:member
  package: excel!
  fullName: valuesAsJson
  summary: 'Para CADA ITEM na coleção: uma representação JSON dos valores nas células nesta coluna de tabela. Ao contrário `TableColumn.values`<!-- -->, `TableColumn.valuesAsJson` oferece suporte a todos os tipos de dados que podem estar em uma célula. Exemplos incluem valores de número formatados e imagens da Web, além dos valores padrão booleano, número e cadeia de caracteres. Os dados retornados dessa API sempre se alinham com a localidade en-US. Para recuperar dados na localidade de exibição do usuário, use `TableColumn.valuesAsJsonLocal`<!-- -->.'
  remarks: '\[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'valuesAsJson?: boolean;'
    return:
      type: boolean
- name: valuesAsJsonLocal
  uid: excel!Excel.Interfaces.TableColumnCollectionLoadOptions#valuesAsJsonLocal:member
  package: excel!
  fullName: valuesAsJsonLocal
  summary: 'Para CADA ITEM na coleção: uma representação JSON dos valores nas células nesta coluna de tabela. Ao contrário `TableColumn.values`<!-- -->, `TableColumn.valuesAsJsonLocal` oferece suporte a todos os tipos de dados que podem estar em uma célula. Exemplos incluem valores de número formatados e imagens da Web, além dos valores padrão booleano, número e cadeia de caracteres. Os dados retornados dessa API sempre se alinham com a localidade de exibição do usuário. Para recuperar dados independentes da localidade, use `TableColumn.valuesAsJson`<!-- -->.'
  remarks: '\[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'valuesAsJsonLocal?: boolean;'
    return:
      type: boolean
