- name: $all
  uid: excel!Excel.Interfaces.TableColumnCollectionLoadOptions#$all:member
  package: excel!
  fullName: $all
  summary: 'A especificação `$all` do LoadOptions carrega todas as propriedades escalares (por exemplo: `Range.address`<!-- -->), mas não as propriedades de navegação (por exemplo: `Range.format.fill.color`<!-- -->).'
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: '$all?: boolean;'
    return:
      type: boolean
