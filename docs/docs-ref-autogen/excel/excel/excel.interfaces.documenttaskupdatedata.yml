  isPreview: true
  isDeprecated: false
  syntax:
    content: 'percentComplete?: number;'
    return:
      type: number
- name: priority
  uid: excel!Excel.Interfaces.DocumentTaskUpdateData#priority:member
  package: excel!
  fullName: priority
  summary: Especifica a prioridade da tarefa. Esse é um valor entre 0 e 10, onde 0 representa a prioridade mais alta.
  remarks: '\[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'priority?: number;'
