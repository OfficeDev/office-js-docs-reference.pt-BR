- name: percentComplete
  uid: excel!Excel.Interfaces.DocumentTaskUpdateData#percentComplete:member
  package: excel!
  fullName: percentComplete
  summary: Especifica a porcentagem de conclusão da tarefa. Esse é um valor entre 0 e 100, onde 100 representa uma tarefa concluída.
