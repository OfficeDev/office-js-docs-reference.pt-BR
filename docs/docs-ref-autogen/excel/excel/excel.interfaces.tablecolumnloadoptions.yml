  fullName: index
  summary: Retorna o número de índice da coluna na coleção de colunas da tabela. Indexado com zero.
  remarks: '\[[Conjunto de API: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'index?: boolean;'
