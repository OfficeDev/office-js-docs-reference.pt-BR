      type: boolean
- name: filter
  uid: excel!Excel.Interfaces.TableColumnLoadOptions#filter:member
  package: excel!
  fullName: filter
  summary: Recupera o filtro aplicado à coluna.
  remarks: '\[[Conjunto de API: ExcelApi 1.2](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
