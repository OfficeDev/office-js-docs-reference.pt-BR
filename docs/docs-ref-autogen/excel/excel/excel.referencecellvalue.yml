### YamlMime:TSType
name: Excel.ReferenceCellValue
uid: excel!Excel.ReferenceCellValue:interface
package: excel!
fullName: Excel.ReferenceCellValue
summary: Representa uma referência em `referencedValues`<!-- -->. Um cenário para usar essa referência é evitar duplicar objetos de valor de célula (como um `EntityCellValue`<!-- -->). Definir um objeto de valor de célula uma vez em `referencedValues`<!-- -->, e, em seguida, fazer referência a esse valor de célula de muitos lugares usando um `ReferenceCellValue` onde o valor duplicado teria surgido.
remarks: '\[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
isPreview: true
isDeprecated: false
type: interface
