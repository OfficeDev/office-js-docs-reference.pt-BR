package: excel!
fullName: Excel.Interfaces.TableRowUpdateData
summary: Uma interface para atualizar dados no objeto TableRow, para uso em `tableRow.set({ ... })`<!-- -->.
remarks: ''
isPreview: false
isDeprecated: false
type: interface
properties:
- name: values
  uid: excel!Excel.Interfaces.TableRowUpdateData#values:member
  package: excel!
  fullName: values
  summary: Representa os valores brutos do intervalo especificado. Os dados retornados podem ser uma cadeia de caracteres, número ou booleano. Células que contêm um erro retornarão a cadeia de caracteres de erro. Se o valor retornado começar com um sinal de mais ("+"), menos ("-"), ou igual ("="), Excel interpretará esse valor como uma fórmula.
  remarks: '\[[Conjunto de API: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'values?: any[][];'
    return:
      type: any[][]
- name: valuesAsJson
  uid: excel!Excel.Interfaces.TableRowUpdateData#valuesAsJson:member
  package: excel!
  fullName: valuesAsJson
  summary: Uma representação JSON dos valores nas células nesta linha de tabela. Ao contrário `TableRow.values`<!-- -->, `TableRow.valuesAsJson` oferece suporte a todos os tipos de dados que podem estar em uma célula.
  remarks: '\[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'valuesAsJson?: CellValue[][];'
    return:
      type: <xref uid="excel!Excel.CellValue:type" />[][]
