### YamlMime:TSType
name: Excel.Interfaces.TableColumnUpdateData
uid: excel!Excel.Interfaces.TableColumnUpdateData:interface
package: excel!
fullName: Excel.Interfaces.TableColumnUpdateData
summary: Uma interface para atualizar dados no objeto TableColumn, para uso em `tableColumn.set({ ... })`<!-- -->.
remarks: ''
isPreview: false
isDeprecated: false
type: interface
properties:
- name: name
  uid: excel!Excel.Interfaces.TableColumnUpdateData#name:member
  package: excel!
  fullName: name
  summary: Especifica o nome da coluna da tabela.
  remarks: '\[[Conjunto de API: ExcelApi 1.1 para obter o nome; 1,4 para defini-lo.](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'name?: string;'
    return:
      type: string
- name: values
  uid: excel!Excel.Interfaces.TableColumnUpdateData#values:member
  package: excel!
  fullName: values
  summary: Representa os valores brutos do intervalo especificado. Os dados retornados podem ser uma cadeia de caracteres, número ou booleano. Células que contêm um erro retornarão a cadeia de caracteres de erro. Se o valor retornado começar com um sinal de mais ("+"), menos ("-"), ou igual ("="), Excel interpretará esse valor como uma fórmula.
  remarks: '\[[Conjunto de API: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'values?: any[][];'
    return:
      type: any[][]
- name: valuesAsJson
  uid: excel!Excel.Interfaces.TableColumnUpdateData#valuesAsJson:member
  package: excel!
  fullName: valuesAsJson
  summary: Uma representação JSON dos valores nas células nesta coluna de tabela. Ao contrário `TableColumn.values`<!-- -->, `TableColumn.valuesAsJson` oferece suporte a todos os tipos de dados que podem estar em uma célula. Exemplos incluem valores de número formatados e imagens da Web, além dos valores padrão booleano, número e cadeia de caracteres. Os dados retornados dessa API sempre se alinham com a localidade en-US. Para recuperar dados na localidade de exibição do usuário, use `TableColumn.valuesAsJsonLocal`<!-- -->.
  remarks: '\[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'valuesAsJson?: CellValue[][];'
    return:
      type: <xref uid="excel!Excel.CellValue:type" />[][]
- name: valuesAsJsonLocal
  uid: excel!Excel.Interfaces.TableColumnUpdateData#valuesAsJsonLocal:member
  package: excel!
  fullName: valuesAsJsonLocal
  summary: Uma representação JSON dos valores nas células nesta coluna de tabela. Ao contrário `TableColumn.values`<!-- -->, `TableColumn.valuesAsJsonLocal` oferece suporte a todos os tipos de dados que podem estar em uma célula. Exemplos incluem valores de número formatados e imagens da Web, além dos valores padrão booleano, número e cadeia de caracteres. Os dados retornados dessa API sempre se alinham com a localidade de exibição do usuário. Para recuperar dados independentes da localidade, use `TableColumn.valuesAsJson`<!-- -->.
  remarks: '\[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'valuesAsJsonLocal?: CellValue[][];'
    return:
      type: <xref uid="excel!Excel.CellValue:type" />[][]
