remarks: '\[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
isPreview: true
isDeprecated: false
type: interface
properties:
- name: address
  uid: excel!Excel.WebImageCellValue#address:member
  package: excel!
  fullName: address
  summary: Representa a URL da qual a imagem será baixada. Essa imagem deve ser hospedada em um servidor compatível com HTTPS.
  remarks: >-
    \[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]


    #### <a name="examples"></a>Exemplos


    ```typescript

    // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/excel/85-preview-apis/data-types-web-image.yaml

    await Excel.run(async (context) => {
      // This method retrieves the image URL from the selected cell and opens that image in a new browser tab.

      // Load the active cell information.
      const activeCell = context.workbook.getActiveCell();
      activeCell.load("valuesAsJson");
      await context.sync();

      // Get image URL from the active cell.
      const values = activeCell.valuesAsJson;
      const webImageData = values[0][0] as Excel.WebImageCellValue;
      const webImageUrl = webImageData.address;

      if (!webImageUrl) {
        console.log("The selected cell is missing an image URL. Select a cell that contains an image.");
        return;
      }

      // Open the image URL in a new browser tab.
      const tab = window.open(webImageData.address, "_blank");
    });

    ```
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'address: string;'
    return:
      type: string
