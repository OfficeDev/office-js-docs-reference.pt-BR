### YamlMime:TSType
name: Excel.WebImageCellValue
uid: excel!Excel.WebImageCellValue:interface
package: excel!
fullName: Excel.WebImageCellValue
summary: Representa o valor de uma célula que contém uma imagem baixada da Internet.
remarks: '\[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
isPreview: true
isDeprecated: false
type: interface
properties:
- name: address
  uid: excel!Excel.WebImageCellValue#address:member
  package: excel!
  fullName: address
  summary: Representa a URL da qual a imagem será baixada. Essa imagem deve ser hospedada em um servidor compatível com HTTPS.
  remarks: '\[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'address: string;'
    return:
      type: string
- name: altText
  uid: excel!Excel.WebImageCellValue#altText:member
  package: excel!
  fullName: altText
  summary: Representa o texto alternativo que pode ser usado em cenários de acessibilidade para descrever o que a imagem representa.
  remarks: '\[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'altText?: string;'
    return:
      type: string
- name: attribution
  uid: excel!Excel.WebImageCellValue#attribution:member
  package: excel!
  fullName: attribution
  summary: Representa informações de atribuição para descrever os requisitos de origem e licença para usar essa imagem.
  remarks: '\[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'attribution?: CellValueAttributionAttributes[];'
    return:
      type: <xref uid="excel!Excel.CellValueAttributionAttributes:interface" />[]
- name: primitive
  uid: excel!Excel.WebImageCellValue#primitive:member
  package: excel!
  fullName: primitive
  summary: Representa o valor que seria retornado por `Range.values` uma célula com esse valor.
  remarks: '\[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'primitive?: "#VALUE!";'
    return:
      type: "\"#VALUE!\""
- name: primitiveType
  uid: excel!Excel.WebImageCellValue#primitiveType:member
  package: excel!
  fullName: primitiveType
  summary: Representa o valor que seria retornado por `Range.valueTypes` uma célula com esse valor.
  remarks: '\[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'primitiveType?: RangeValueType.error | "Error";'
    return:
      type: <xref uid="excel!Excel.RangeValueType.error:member" /> | "Error"
- name: provider
  uid: excel!Excel.WebImageCellValue#provider:member
  package: excel!
  fullName: provider
  summary: Representa informações que descrevem a entidade ou indivíduo que forneceu a imagem. Essas informações podem ser usadas para identidade visual em cartões de imagem.
  remarks: '\[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'provider?: CellValueProviderAttributes;'
    return:
      type: <xref uid="excel!Excel.CellValueProviderAttributes:interface" />
- name: relatedImagesAddress
  uid: excel!Excel.WebImageCellValue#relatedImagesAddress:member
  package: excel!
  fullName: relatedImagesAddress
  summary: Representa a URL de uma página da Web com imagens consideradas relacionadas a isso `WebImageCellValue`<!-- -->.
  remarks: '\[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'relatedImagesAddress?: string;'
    return:
      type: string
- name: type
  uid: excel!Excel.WebImageCellValue#type:member
  package: excel!
  fullName: type
  summary: Representa o tipo desse valor de célula.
  remarks: '\[[Conjunto de API: ExcelApi BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'type: CellValueType.webImage | "WebImage";'
    return:
      type: <xref uid="excel!Excel.CellValueType.webImage:member" /> | "WebImage"
