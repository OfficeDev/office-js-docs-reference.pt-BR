methods:
- name: getById(id)
  uid: word!Word.ContentControlCollection#getById:member(1)
  package: word!
  fullName: getById(id)
  summary: Obtém um controle de conteúdo pelo respectivo identificador. Ocorre um erro se não houver um controle de conteúdo com o identificador nesta coleção.
  remarks: >-
    \[[Conjunto de API: WordApi 1.1](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]


    #### <a name="examples"></a>Exemplos


    ```typescript

    // Run a batch operation against the Word object model.

    await Word.run(async (context) => {

        // Create a proxy object for the content control that contains a specific id.
        var contentControl = context.document.contentControls.getById(30086310);

        // Queue a command to load the text property for a content control.
        context.load(contentControl, 'text');

        // Synchronize the document state by executing the queued commands,
        // and return a promise to indicate task completion.
        await context.sync();
        console.log('The content control with that Id has been found in this document.');
    });

    ```
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'getById(id: number): Word.ContentControl;'
    parameters:
    - id: id
      description: Obrigatória. Um identificador de controle de conteúdo.
      type: number
    return:
      type: <xref uid="word!Word.ContentControl:class" />
      description: ''
- name: getByIdOrNullObject(id)
  uid: word!Word.ContentControlCollection#getByIdOrNullObject:member(1)
  package: word!
  fullName: getByIdOrNullObject(id)
  summary: Obtém um controle de conteúdo pelo respectivo identificador. Retorna um objeto nulo se não houver um controle de conteúdo com o identificador nesta coleção.
  remarks: >-
    \[[Conjunto de API: WordApi 1.3](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]


    #### <a name="examples"></a>Exemplos


    ```typescript

    // Run a batch operation against the Word object model.

    await Word.run(async (context) => {

        // Create a proxy object for the content control that contains a specific id.
        var contentControl = context.document.contentControls.getByIdOrNullObject(30086310);

        // Queue a command to load the text property for a content control.
        context.load(contentControl, 'text');

        // Synchronize the document state by executing the queued commands,
        // and return a promise to indicate task completion.
        await context.sync();
        if (contentControl.isNullObject) {
            console.log('There is no content control with that ID.')
        } else {
            console.log('The content control with that ID has been found in this document.');
        }
    });

    ```
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'getByIdOrNullObject(id: number): Word.ContentControl;'
    parameters:
    - id: id
      description: Obrigatória. Um identificador de controle de conteúdo.
      type: number
    return:
      type: <xref uid="word!Word.ContentControl:class" />
      description: ''
- name: getByTag(tag)
  uid: word!Word.ContentControlCollection#getByTag:member(1)
  package: word!
  fullName: getByTag(tag)
  summary: Obtém os controles de conteúdo com a marca especificada.
  remarks: >-
    \[[Conjunto de API: WordApi 1.1](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]


    #### <a name="examples"></a>Exemplos


    ```typescript

    // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/word/90-scenarios/doc-assembly.yaml

    await Word.run(async (context) => {
        let contentControls = context.document.contentControls.getByTag("customer");
        contentControls.load("text");

        await context.sync();

        for (let i = 0; i < contentControls.items.length; i++) {
          contentControls.items[i].insertText("Fabrikam", "Replace");
        }

        await context.sync();
    });

    ```
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'getByTag(tag: string): Word.ContentControlCollection;'
    parameters:
    - id: tag
      description: Obrigatória. Uma marca definida em um controle de conteúdo.
      type: string
    return:
      type: <xref uid="word!Word.ContentControlCollection:class" />
      description: ''
- name: getByTitle(title)
  uid: word!Word.ContentControlCollection#getByTitle:member(1)
  package: word!
  fullName: getByTitle(title)
  summary: Obtém os controles de conteúdo com o título especificado.
  remarks: "\\[[Conjunto de API: WordApi 1.1](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>Exemplos\n\n```typescript\n// Run a batch operation against the Word object model.\nawait Word.run(async (context) => {\n\n    // Create a proxy object for the content controls collection that contains a specific title.\n    var contentControlsWithTitle = context.document.contentControls.getByTitle('Enter Customer Address Here');\n\n    // Queue a command to load the text property for all of content controls with a specific title.\n    context.load(contentControlsWithTitle, 'text');\n\n    // Synchronize the document state by executing the queued commands,\n    // and return a promise to indicate task completion.\n    await context.sync();\n    if (contentControlsWithTitle.items.length === 0) {\n        console.log(\n            \"There isn't a content control with a title of 'Enter Customer Address Here' in this document.\");\n    } else {\n        console.log(\n            \"The first content control with the title of 'Enter Customer Address Here' has this text: \" + \n            contentControlsWithTitle.items[0].text);\n    }\n});\n\n// The Word-Add-in-DocumentAssembly sample has another example of using the getByTitle method.\n// https://github.com/OfficeDev/Word-Add-in-DocumentAssembly\n```"
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'getByTitle(title: string): Word.ContentControlCollection;'
    parameters:
    - id: title
      description: Obrigatória. O título de um controle de conteúdo.
      type: string
    return:
      type: <xref uid="word!Word.ContentControlCollection:class" />
      description: ''
