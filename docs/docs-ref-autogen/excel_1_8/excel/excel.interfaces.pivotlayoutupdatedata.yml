properties:
- name: layoutType
  uid: excel!Excel.Interfaces.PivotLayoutUpdateData#layoutType:member
  package: excel!
  fullName: layoutType
  summary: Essa propriedade indica o PivotLayoutType de todos os campos da Tabela Dinâmica. Se os campos têm diferentes estados, ele será nulo.
  remarks: '\[[Conjunto de API: ExcelApi 1.8](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'layoutType?: Excel.PivotLayoutType | "Compact" | "Tabular" | "Outline";'
    return:
      type: <xref uid="excel!Excel.PivotLayoutType:enum" /> | "Compact" | "Tabular" | "Outline"
- name: showColumnGrandTotals
  uid: excel!Excel.Interfaces.PivotLayoutUpdateData#showColumnGrandTotals:member
  package: excel!
  fullName: showColumnGrandTotals
  summary: Especifica se o relatório de tabela dinâmica mostra totais grandes para colunas.
  remarks: '\[[Conjunto de API: ExcelApi 1.8](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'showColumnGrandTotals?: boolean;'
    return:
      type: boolean
- name: showRowGrandTotals
  uid: excel!Excel.Interfaces.PivotLayoutUpdateData#showRowGrandTotals:member
