### YamlMime:TSType
name: Excel.InsertWorksheetOptions
uid: excel!Excel.InsertWorksheetOptions:interface
package: excel!
fullName: Excel.InsertWorksheetOptions
summary: As opções que definem quais planilhas inserir e onde na pasta de trabalho as novas planilhas serão inseridas.
remarks: '\[[Conjunto de API: ExcelApi 1.13](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
isPreview: false
isDeprecated: false
type: interface
properties:
- name: positionType
  uid: excel!Excel.InsertWorksheetOptions#positionType:member
  package: excel!
  fullName: positionType
  summary: A posição de inserção, na pasta de trabalho atual, das novas planilhas. Consulte `Excel.WorksheetPositionType` para obter detalhes. A posição padrão é "End".
  remarks: '\[[Conjunto de API: ExcelApi 1.13](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'positionType?: Excel.WorksheetPositionType | "None" | "Before" | "After" | "Beginning" | "End";'
    return:
      type: <xref uid="excel!Excel.WorksheetPositionType:enum" /> | "None" | "Before" | "After" | "Beginning" | "End"
- name: relativeTo
  uid: excel!Excel.InsertWorksheetOptions#relativeTo:member
  package: excel!
  fullName: relativeTo
  summary: A planilha na pasta de trabalho atual que é referenciada para o `WorksheetPositionType` parâmetro. O padrão é `null`<!-- -->. Se o `relativeTo` parâmetro não estiver definido, as planilhas serão inseridas com base em `positionType`<!-- -->, no início ou no final da manual de trabalho atual.
  remarks: '\[[Conjunto de API: ExcelApi 1.13](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'relativeTo?: Worksheet | string;'
    return:
      type: <xref uid="excel!Excel.Worksheet:class" /> | string
- name: sheetNamesToInsert
  uid: excel!Excel.InsertWorksheetOptions#sheetNamesToInsert:member
  package: excel!
  fullName: sheetNamesToInsert
  summary: Os nomes de planilhas individuais a inserir. Por padrão, todas as planilhas da pasta de trabalho de origem são inseridas.
  remarks: '\[[Conjunto de API: ExcelApi 1.13](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'sheetNamesToInsert?: string[];'
    return:
      type: string[]
