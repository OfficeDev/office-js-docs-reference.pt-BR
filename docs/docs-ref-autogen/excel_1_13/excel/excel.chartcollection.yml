events:
- name: onActivated
  uid: excel!Excel.ChartCollection#onActivated:member
  package: excel!
  fullName: onActivated
  summary: Ocorre quando um gráfico é ativado.
  remarks: "\\[[Conjunto de API: ExcelApi 1.8](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>Exemplos\n\n```typescript\n// Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/excel/30-events/events-chart-activated.yaml\nawait Excel.run(async (context) => {\n\n    const pieChart = context.workbook.worksheets.getActiveWorksheet().charts.getItem(\"Pie\");\n\n    // Register the onActivated and onDeactivated event handlers.\n    pieChart.onActivated.add(chartActivated);\n    pieChart.onDeactivated.add(chartDeactivated);\n\n    await context.sync();\n\n    console.log(\"Added handlers for Chart onActivated and onDeactivated events.\");\n});\n```\n```typescript\n// Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/excel/30-events/events-chart-activated.yaml\nasync function chartActivated(event) {\n    await Excel.run(async (context) => {\n        // Retrieve the worksheet.\n        const sheet = context.workbook.worksheets.getActiveWorksheet();\n\n        // Retrieve the activated chart by ID and load the name of the chart. \n        const activatedChart = sheet.charts.getItem(event.chartId);\n        activatedChart.load([\"name\"]);\n        await context.sync();\n\n        // Print out the activated chart's data.\n        console.log(`A chart was activated. ID: ${event.chartId}. Chart name: ${activatedChart.name}.`);\n    });\n}\n```"
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'readonly onActivated: OfficeExtension.EventHandlers<Excel.ChartActivatedEventArgs>;'
    return:
      type: <xref uid="office!OfficeExtension.EventHandlers:class" />&lt;<xref uid="excel!Excel.ChartActivatedEventArgs:interface" />&gt;
- name: onAdded
  uid: excel!Excel.ChartCollection#onAdded:member
  package: excel!
  fullName: onAdded
  summary: Ocorre quando um novo gráfico é adicionado à planilha.
  remarks: >-
    \[[Conjunto de API: ExcelApi 1.8](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]


    #### <a name="examples"></a>Exemplos


    ```typescript

    await Excel.run(async (context) => {
        context.workbook.worksheets.getActiveWorksheet()
            .charts.onAdded.add(function (event) {
            return Excel.run(async (context) => {
                console.log("A chart has been added with ID: " + event.chartId);
                await context.sync();
            });
        });
        await context.sync();
    });

    ```
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'readonly onAdded: OfficeExtension.EventHandlers<Excel.ChartAddedEventArgs>;'
    return:
      type: <xref uid="office!OfficeExtension.EventHandlers:class" />&lt;<xref uid="excel!Excel.ChartAddedEventArgs:interface" />&gt;
- name: onDeactivated
  uid: excel!Excel.ChartCollection#onDeactivated:member
  package: excel!
  fullName: onDeactivated
  summary: Ocorre quando um gráfico é desativado.
  remarks: >-
    \[[Conjunto de API: ExcelApi 1.8](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]


    #### <a name="examples"></a>Exemplos


    ```typescript

    // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/excel/30-events/events-chart-activated.yaml

    await Excel.run(async (context) => {

        const pieChart = context.workbook.worksheets.getActiveWorksheet().charts.getItem("Pie");

        // Register the onActivated and onDeactivated event handlers.
        pieChart.onActivated.add(chartActivated);
        pieChart.onDeactivated.add(chartDeactivated);

        await context.sync();

        console.log("Added handlers for Chart onActivated and onDeactivated events.");
    });

    ```

    ```typescript

    // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/excel/30-events/events-chart-activated.yaml

    async function chartDeactivated(event) {
        await Excel.run(async (context) => {
            // Callback function for when the chart is deactivated.
            console.log("The pie chart is NOT active.");
        });
    }

    ```
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'readonly onDeactivated: OfficeExtension.EventHandlers<Excel.ChartDeactivatedEventArgs>;'
    return:
      type: <xref uid="office!OfficeExtension.EventHandlers:class" />&lt;<xref uid="excel!Excel.ChartDeactivatedEventArgs:interface" />&gt;
