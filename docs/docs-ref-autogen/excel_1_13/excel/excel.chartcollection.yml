- name: getItem(name)
  uid: excel!Excel.ChartCollection#getItem:member(1)
  package: excel!
  fullName: getItem(name)
  summary: Obtém um gráfico usando o respectivo nome. Quando houver vários gráficos com o mesmo nome, o sistema retornará o primeiro deles.
  remarks: "\\[[Conjunto de API: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>Exemplos\n\n```typescript\n// Get the number of charts.\nawait Excel.run(async (context) => { \n    var charts = context.workbook.worksheets.getItem(\"Sheet1\").charts;\n    charts.load('count');\n    await context.sync();\n    \n    console.log(\"charts: Count= \" + charts.count);\n});\n```"
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'getItem(name: string): Excel.Chart;'
    parameters:
    - id: name
      description: Nome do gráfico a recuperar.
      type: string
    return:
      type: <xref uid="excel!Excel.Chart:class" />
      description: ''
- name: getItemAt(index)
  uid: excel!Excel.ChartCollection#getItemAt:member(1)
  package: excel!
  fullName: getItemAt(index)
  summary: Obtém um gráfico com base em sua posição no conjunto.
  remarks: "\\[[Conjunto de API: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>Exemplos\n\n```typescript\nawait Excel.run(async (context) => { \n    var lastPosition = context.workbook.worksheets.getItem(\"Sheet1\").charts.count - 1;\n    var chart = context.workbook.worksheets.getItem(\"Sheet1\").charts.getItemAt(lastPosition);\n    await context.sync();\n\n    console.log(chart.name);\n});\n```"
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'getItemAt(index: number): Excel.Chart;'
    parameters:
    - id: index
      description: Valor de índice do objeto a ser recuperado. Indexados com zero.
      type: number
    return:
      type: <xref uid="excel!Excel.Chart:class" />
      description: ''
