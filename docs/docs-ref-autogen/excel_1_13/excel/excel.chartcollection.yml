methods:
- name: add(type, sourceData, seriesBy)
  uid: excel!Excel.ChartCollection#add:member(1)
  package: excel!
  fullName: add(type, sourceData, seriesBy)
  summary: Cria um novo gráfico.
  remarks: "\\[[Conjunto de API: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>Exemplos\n\n```typescript\n// Add a chart of chartType \"ColumnClustered\" on worksheet \"Charts\" \n// with sourceData from range \"A1:B4\" and seriresBy set to \"auto\".\nawait Excel.run(async (context) => {\n    const sheet = context.workbook.worksheets.getItem(\"Sheet1\");\n    var rangeSelection = \"A1:B4\";\n    var range = sheet.getRange(rangeSelection);\n    var chart = sheet.charts.add(\n    Excel.ChartType.columnClustered, \n    range, \n    Excel.ChartSeriesBy.auto);\n    await context.sync();\n\n    console.log(\"New Chart Added\");\n});\n```"
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'add(type: Excel.ChartType, sourceData: Range, seriesBy?: Excel.ChartSeriesBy): Excel.Chart;'
    parameters:
    - id: type
      description: Representa o tipo de um gráfico. Consulte `Excel.ChartType` para obter detalhes.
      type: <xref uid="excel!Excel.ChartType:enum" />
    - id: sourceData
      description: O `Range` objeto correspondente aos dados de origem.
      type: <xref uid="excel!Excel.Range:class" />
    - id: seriesBy
      description: Opcional. Especifica a forma como as colunas ou linhas são usadas como série de dados no gráfico. Consulte `Excel.ChartSeriesBy` para obter detalhes.
      type: <xref uid="excel!Excel.ChartSeriesBy:enum" />
    return:
      type: <xref uid="excel!Excel.Chart:class" />
      description: ''
