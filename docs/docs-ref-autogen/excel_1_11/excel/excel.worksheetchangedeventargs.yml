### YamlMime:TSType
name: Excel.WorksheetChangedEventArgs
uid: excel!Excel.WorksheetChangedEventArgs:interface
package: excel!
fullName: Excel.WorksheetChangedEventArgs
summary: Fornece informações sobre a planilha que gerou o evento alterado.
remarks: '\[[Conjunto de API: ExcelApi 1.7](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
isPreview: false
isDeprecated: false
type: interface
properties:
- name: address
  uid: excel!Excel.WorksheetChangedEventArgs#address:member
  package: excel!
  fullName: address
  summary: Obtém o endereço do intervalo que representa a área alterada de uma planilha específica.
  remarks: '\[[Conjunto de API: ExcelApi 1.7](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'address: string;'
    return:
      type: string
- name: changeType
  uid: excel!Excel.WorksheetChangedEventArgs#changeType:member
  package: excel!
  fullName: changeType
  summary: Obtém o tipo de alteração que representa como o evento alterado é disparado. Consulte `Excel.DataChangeType` para obter detalhes.
  remarks: '\[[Conjunto de API: ExcelApi 1.7](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'changeType: Excel.DataChangeType | "Unknown" | "RangeEdited" | "RowInserted" | "RowDeleted" | "ColumnInserted" | "ColumnDeleted" | "CellInserted" | "CellDeleted";'
    return:
      type: <xref uid="excel!Excel.DataChangeType:enum" /> | "Unknown" | "RangeEdited" | "RowInserted" | "RowDeleted" | "ColumnInserted" | "ColumnDeleted" | "CellInserted" | "CellDeleted"
- name: details
  uid: excel!Excel.WorksheetChangedEventArgs#details:member
  package: excel!
  fullName: details
  summary: Representa as informações sobre os detalhes da alteração. Essa propriedade pode ser recuperada quando o evento alterado é disparado em uma única célula. Se o evento alterado for disparado em várias células, essa propriedade não poderá ser recuperada.
  remarks: >-
    \[[Conjunto de API: ExcelApi 1.9](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]


    #### <a name="examples"></a>Exemplos


    ```javascript

    // This function would be used as an event handler for the Worksheet.onChanged event.

    function onWorksheetChanged(eventArgs) {
        Excel.run(function (context) {
            var details = eventArgs.details;
            var address = eventArgs.address;

            // Print the before and after types and values to the console.
            console.log(`Change at ${address}: was ${details.valueBefore}(${details.valueTypeBefore}),`
                + ` now is ${details.valueAfter}(${details.valueTypeAfter})`);
            return context.sync();
        });
    }

    ```
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'details: Excel.ChangedEventDetail;'
    return:
      type: <xref uid="excel!Excel.ChangedEventDetail:interface" />
