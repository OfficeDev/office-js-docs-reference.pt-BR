### YamlMime:TSType
name: Excel.TableRow
uid: excel!Excel.TableRow:class
package: excel!
fullName: Excel.TableRow
summary: >-
  Representa uma linha em uma tabela.


  Observe que, diferentemente de intervalos ou colunas, que se ajustarão se novas linhas ou colunas são adicionadas antes delas, um objeto representa o `TableRow` local físico da linha de tabela, mas não os dados. Ou seja, se os dados são organizados ou se novas linhas são adicionadas, uma linha de tabela continuará a apontar para o índice para o qual foi criado.
remarks: '\[[Conjunto de API: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
isPreview: false
isDeprecated: false
type: class
