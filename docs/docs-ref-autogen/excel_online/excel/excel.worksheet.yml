- name: showOutlineLevels(rowLevels, columnLevels)
  uid: excel!Excel.Worksheet#showOutlineLevels:member(1)
  package: excel!
  fullName: showOutlineLevels(rowLevels, columnLevels)
  summary: Mostra grupos de linhas ou colunas por seus níveis de contorno. Descreve grupos e resume uma lista de dados na planilha. Os `rowLevels` parâmetros `columnLevels` e especificam quantos níveis do contorno serão exibidos. O intervalo de argumentos aceitável está entre 0 e 8. Um valor 0 não altera a exibição atual. Um valor maior do que o número atual de níveis exibe todos os níveis.
  remarks: >-
    \[[Conjunto de API: ExcelApi 1.10](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]


    #### <a name="examples"></a>Exemplos


    ```typescript

    // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/excel/42-range/outline.yaml

    Excel.run(async (context) => {
        const sheet = context.workbook.worksheets.getActiveWorksheet();

        // This collapses the entire outline.
        sheet.showOutlineLevels(1, 1);
        await context.sync();
    });

    ```

