- name: onColumnSorted
  uid: excel!Excel.Worksheet#onColumnSorted:member
  package: excel!
  fullName: onColumnSorted
  summary: Ocorre quando uma ou mais colunas são classificadas. Isso acontece como resultado de uma operação de classificação da esquerda para a direita.
  remarks: >-
    \[[Conjunto de API: ExcelApi 1.10](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]


    #### <a name="examples"></a>Exemplos


    ```typescript

    // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/excel/30-events/event-column-and-row-sort.yaml

    await Excel.run(async (context) => {
        console.log("Adding column handler");
        const sheet = context.workbook.worksheets.getActiveWorksheet();

        // This will fire whenever a column has been moved as the result of a sort action.
        sheet.onColumnSorted.add((event) => {
            return Excel.run((context) => {
                console.log("Column sorted: " + event.address);
                const sheet = context.workbook.worksheets.getActiveWorksheet();

                // Clear formatting for section, then highlight the sorted area.
                sheet.getRange("A1:E5").format.fill.clear();
                if (event.address !== "") {
                    sheet.getRanges(event.address).format.fill.color = "yellow";
                }

                return context.sync();
            });
        });
    });

    ```
