- name: valueAxis
  uid: excel!Excel.ChartAxes#valueAxis:member
  package: excel!
  fullName: valueAxis
  summary: Representa o eixo dos valores em um eixo.
  remarks: "\\[[Conjunto de API: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>Exemplos\n\n```typescript\n// Set the maximum, minimum, majorUnit, minorUnit of valueAxis.\nawait Excel.run(async (context) => { \n    var chart = context.workbook.worksheets.getItem(\"Sheet1\").charts.getItem(\"Chart1\");    \n    chart.axes.valueAxis.maximum = 5;\n    chart.axes.valueAxis.minimum = 0;\n    chart.axes.valueAxis.majorUnit = 1;\n    chart.axes.valueAxis.minorUnit = 0.2;\n    await context.sync();\n\n    console.log(\"Axis Settings Changed\");\n});\n```"
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'readonly valueAxis: Excel.ChartAxis;'
    return:
      type: <xref uid="excel!Excel.ChartAxis:class" />
