- name: onActivated
  uid: excel!Excel.Workbook#onActivated:member
  package: excel!
  fullName: onActivated
  summary: 'Ocorre quando a guia de trabalho é ativada. Observação: esse evento não será a incêndio quando a workbook for aberta.'
  remarks: >-
    \[[Conjunto de API: ExcelApi 1.13](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]


    #### <a name="examples"></a>Exemplos


    ```typescript

    // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/excel/30-events/events-workbook-activated.yaml

    async function workbookActivated(event: Excel.WorkbookActivatedEventArgs) {
      await Excel.run(async (context) => {
        // Callback function for when the workbook is activated.
        console.log("The workbook was activated.");
      });
    }

    ```

    ```typescript

    // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/excel/30-events/events-workbook-activated.yaml

    await Excel.run(async (context) => {
      const workbook = context.workbook;

      // Register the workbook activated event handler.
      workbook.onActivated.add(workbookActivated);

      await context.sync();
      console.log("Added event handler for workbook activated.");
    });

    ```
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'readonly onActivated: OfficeExtension.EventHandlers<Excel.WorkbookActivatedEventArgs>;'
    return:
      type: <xref uid="office!OfficeExtension.EventHandlers:class" />&lt;<xref uid="excel!Excel.WorkbookActivatedEventArgs:interface" />&gt;
