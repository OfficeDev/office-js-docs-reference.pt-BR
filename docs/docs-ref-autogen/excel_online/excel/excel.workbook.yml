- name: insertWorksheetsFromBase64(base64File, options)
  uid: excel!Excel.Workbook#insertWorksheetsFromBase64:member(1)
  package: excel!
  fullName: insertWorksheetsFromBase64(base64File, options)
  summary: >-
    Insere as planilhas especificadas de uma pasta de trabalho de origem na pasta de trabalho atual.


    *Observação**: Atualmente, essa API só tem suporte para Office no Windows, Mac e na Web.
  remarks: "\\[[Conjunto de API: ExcelApi 1.13](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>Exemplos\n\n```javascript\n// Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/excel/50-workbook/workbook-insert-external-worksheets.yaml\n// Retrieve the file and set up an HTML FileReader element. \nconst myFile = <HTMLInputElement>document.getElementById(\"file\");\nconst reader = new FileReader();\n\nreader.onload = (event) => {\n    // Remove the metadata before the base64-encoded string.\n    const startIndex = reader.result.toString().indexOf(\"base64,\");\n    externalWorkbook = reader.result.toString().substr(startIndex + 7);\n};\n\n// Read the file as a data URL so that we can parse the base64-encoded string.\nreader.readAsDataURL(myFile.files[0]);\n```\n```typescript\n// Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/excel/50-workbook/workbook-insert-external-worksheets.yaml\nawait Excel.run(async (context) => {\n    // Retrieve the source workbook.\n    const workbook = context.workbook;\n    \n    // Set up the insert options.\n    var options = {\n        sheetNamesToInsert: [], // Insert all the worksheets from the source workbook.\n        positionType: Excel.WorksheetPositionType.after, // Insert after the `relativeTo` sheet.\n        relativeTo: \"Sheet1\" // The sheet relative to which the other worksheets will be inserted. Used with `positionType`.\n    };\n    \n    // Insert the new worksheets.\n    workbook.insertWorksheetsFromBase64(externalWorkbook, options);\n    await context.sync();\n});\n```"
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'insertWorksheetsFromBase64(base64File: string, options?: Excel.InsertWorksheetOptions): OfficeExtension.ClientResult<string[]>;'
    parameters:
    - id: base64File
      description: Obrigatório. A cadeia de caracteres codificada com base64 que representa o arquivo da pasta de trabalho de origem.
      type: string
    - id: options
      description: Opcional. As opções que definem quais planilhas inserir e onde na pasta de trabalho as novas planilhas serão inseridas. Por padrão, todas as planilhas da pasta de trabalho de origem são inseridas no final da pasta de trabalho atual.
      type: <xref uid="excel!Excel.InsertWorksheetOptions:interface" />
    return:
      type: <xref uid="office!OfficeExtension.ClientResult:class" />&lt;string[]&gt;
      description: Uma matriz de IDs correspondente a cada planilha recém-inserida.
