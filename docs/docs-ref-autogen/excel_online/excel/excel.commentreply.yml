- name: content
  uid: excel!Excel.CommentReply#content:member
  package: excel!
  fullName: content
  summary: O conteúdo da resposta ao comentário. A cadeia de caracteres é texto sem texto.
  remarks: >-
    \[[Conjunto de API: ExcelApi 1.10](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]


    #### <a name="examples"></a>Exemplos


    ```typescript

    // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/excel/12-comment/comment-replies.yaml

    await Excel.run(async (context) => {
        const sheet = context.workbook.worksheets.getItem("Comments");
        const comment = sheet.comments.getItemAt(0);
        const reply = comment.replies.getItemAt(0);
        reply.load("content");
        // Sync to load the content of the comment reply.
        await context.sync();

        // Append "Please!" to the end of the comment reply.
        reply.content += " Please!";
        await context.sync();
    });

    ```
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'content: string;'
    return:
      type: string
