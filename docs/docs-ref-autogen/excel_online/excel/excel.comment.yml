  package: excel!
  fullName: resolved
  summary: O status do thread de comentário. Um valor de `true` meios para que o thread de comentário seja resolvido.
  remarks: >-
    \[[Conjunto de API: ExcelApi 1.11](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]


    #### <a name="examples"></a>Exemplos


    ```typescript

    // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/excel/12-comment/comment-resolution.yaml

    await Excel.run(async (context) => {
        const sheet = context.workbook.worksheets.getItem("Comments");
        sheet.comments.getItemAt(0).resolved = true;
        await context.sync();
    });

