- name: position
  uid: excel!Excel.Worksheet#position:member
  package: excel!
  fullName: position
  summary: A posição baseada em zero da planilha na pasta de trabalho.
  remarks: "\\[[Conjunto de API: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>Exemplos\n\n```typescript\n// Set worksheet position.\nawait Excel.run(async (context) => { \n    var wSheetName = 'Sheet1';\n    var worksheet = context.workbook.worksheets.getItem(wSheetName);\n    worksheet.position = 2;\n    await context.sync(); \n});\n```"
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'position: number;'
    return:
      type: number
- name: tables
  uid: excel!Excel.Worksheet#tables:member
  package: excel!
  fullName: tables
  summary: Coleção de tabelas que fazem parte da planilha.
  remarks: '\[[Conjunto de API: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
