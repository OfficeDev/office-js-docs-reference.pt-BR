name: Excel.Binding
uid: excel!Excel.Binding:class
package: excel!
fullName: Excel.Binding
summary: Representa uma associação do Office.js definida na pasta de trabalho.
remarks: '\[[Conjunto de API: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
isPreview: false
isDeprecated: false
type: class
properties:
- name: context
  uid: excel!Excel.Binding#context:member
  package: excel!
  fullName: context
  summary: O contexto de solicitação associado ao objeto. Isso conecta o processo do Office do aplicativo host.
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'context: RequestContext;'
    return:
      type: <xref uid="excel!Excel.RequestContext:class" />
- name: id
  uid: excel!Excel.Binding#id:member
  package: excel!
  fullName: id
  summary: Representa o identificador de associação.
  remarks: '\[[Conjunto de API: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'readonly id: string;'
    return:
      type: string
- name: type
  uid: excel!Excel.Binding#type:member
  package: excel!
  fullName: type
  summary: Retorna o tipo da associação. Consulte `Excel.BindingType` para obter detalhes.
  remarks: '\[[Conjunto de API: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
