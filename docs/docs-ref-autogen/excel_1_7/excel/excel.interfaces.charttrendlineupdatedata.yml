      type: any
- name: movingAveragePeriod
  uid: excel!Excel.Interfaces.ChartTrendlineUpdateData#movingAveragePeriod:member
  package: excel!
  fullName: movingAveragePeriod
  summary: Representa o período de uma linha de tendência de gráfico. Aplicável apenas às linhas de tendência com o tipo `MovingAverage`<!-- -->.
  remarks: '\[[Conjunto de API: ExcelApi 1.7](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'movingAveragePeriod?: number;'
    return:
      type: number
- name: name
  uid: excel!Excel.Interfaces.ChartTrendlineUpdateData#name:member
  package: excel!
  fullName: name
  summary: Representa o nome da linha de tendência. Pode ser definido como um valor de cadeia de caracteres, um `null` valor representa valores automáticos. O valor retornado sempre é uma cadeia de caracteres.
  remarks: '\[[Conjunto de API: ExcelApi 1.7](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'name?: string;'
    return:
      type: string
