    content: 'format?: Excel.Interfaces.ChartTrendlineFormatUpdateData;'
    return:
      type: <xref uid="excel!Excel.Interfaces.ChartTrendlineFormatUpdateData:interface" />
- name: intercept
  uid: excel!Excel.Interfaces.ChartTrendlineUpdateData#intercept:member
  package: excel!
  fullName: intercept
  summary: Representa o valor de intercepção da linha de tendência. Pode ser definido como um valor numérico ou uma cadeia de caracteres vazia (para valores automáticos de eixo). O valor retornado sempre é um número.
  remarks: '\[[Conjunto de API: ExcelApi 1.7](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'intercept?: any;'
