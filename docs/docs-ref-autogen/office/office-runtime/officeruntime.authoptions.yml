### YamlMime:TSType
name: OfficeRuntime.AuthOptions
uid: office-runtime!OfficeRuntime.AuthOptions:interface
package: office-runtime!
fullName: OfficeRuntime.AuthOptions
summary: Fornece opções para a experiência do usuário quando Office obtém um token de acesso para o AAD v. 2.0 com o método`getAccessToken`.
remarks: Os métodos nesta interface são equivalentes aos da `Office.AuthOptions` interface. Se novos tipos de autenticação são adicionados no futuro, eles serão adicionados apenas à `Office.AuthOptions` interface. Para simplificar, os exemplos de código em toda a documentação usam `Office.AuthOptions`<!-- -->.
isPreview: false
isDeprecated: false
type: interface
properties:
- name: allowConsentPrompt
  uid: office-runtime!OfficeRuntime.AuthOptions#allowConsentPrompt:member
  package: office-runtime!
  fullName: allowConsentPrompt
  summary: Permite Office obter um token de acesso silenciosamente ou por meio do consentimento interativo, se for necessário. O valor padrão é `false`<!-- -->. Se definido como `false`<!-- -->, Office tentará silenciosamente obter um token de acesso. Se não conseguir fazer isso, Office retornará um erro descritivo. Se definido como `true`<!-- -->, Office mostrará uma interface do usuário de consentimento interativo depois que ela não conseguir silenciosamente um token de acesso. O prompt permitirá apenas o consentimento para o escopo AAD perfil, não para nenhum escopo Graph Microsoft.
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'allowConsentPrompt?: boolean;'
    return:
      type: boolean
- name: allowSignInPrompt
  uid: office-runtime!OfficeRuntime.AuthOptions#allowSignInPrompt:member
  package: office-runtime!
  fullName: allowSignInPrompt
  summary: Permite Office obter um token de acesso silenciosamente fornecido que está presente ou mostrar interface do usuário interativa para entrar no usuário. O valor padrão é `false`<!-- -->. Se definido como `false`<!-- -->, Office tentará silenciosamente obter um token de acesso. Se não conseguir fazer isso, Office retornará um erro descritivo. Se definido como `true`<!-- -->, Office mostrará uma interface do usuário de entrada interativa depois que ela não conseguir silenciosamente um token de acesso.
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'allowSignInPrompt?: boolean;'
    return:
      type: boolean
- name: asyncContext
  uid: office-runtime!OfficeRuntime.AuthOptions#asyncContext:member
  package: office-runtime!
  fullName: asyncContext
  summary: Um item definido pelo usuário de qualquer tipo retornado, inalterado, na propriedade do objeto que é `asyncContext` passado para um retorno de `AsyncResult` chamada.
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'asyncContext?: any;'
    return:
      type: any
- name: authChallenge
  uid: office-runtime!OfficeRuntime.AuthOptions#authChallenge:member
  package: office-runtime!
  fullName: authChallenge
  summary: Faz Office solicitar que o usuário forneça o fator adicional quando o local que está sendo direcionado pela Microsoft Graph requer autenticação multifator. O valor da cadeia de caracteres identifica o tipo de fator adicional necessário. Na maioria dos casos, você não sabe no momento do desenvolvimento se o locatário do usuário requer um fator adicional ou qual deve ser a cadeia de caracteres. Portanto, essa opção seria usada em uma chamada de "segunda tentativa" depois que o Microsoft Graph enviou um erro solicitando o fator adicional e contendo a cadeia de caracteres que deve ser usada com a `getAccessToken` `authChallenge` opção.
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'authChallenge?: string;'
    return:
      type: string
- name: forceAddAccount
  uid: office-runtime!OfficeRuntime.AuthOptions#forceAddAccount:member
  package: office-runtime!
  fullName: forceAddAccount
  summary: Solicita que o usuário adicione sua conta Office (ou alternar para ela, se ela já tiver sido adicionada). O valor padrão é `false`<!-- -->.
  remarks: ''
  isPreview: false
  isDeprecated: true
  customDeprecatedMessage: Use `allowSignInPrompt` instead.
  syntax:
    content: 'forceAddAccount?: boolean;'
    return:
      type: boolean
- name: forceConsent
  uid: office-runtime!OfficeRuntime.AuthOptions#forceConsent:member
  package: office-runtime!
  fullName: forceConsent
  summary: Faz com que o Office exiba a experiência de consentimento do suplemento. Será útil se as permissões do Azure do suplemento tiverem sido alteradas ou se o consentimento do usuário tiver sido revogado. O valor padrão é `false`<!-- -->.
  remarks: ''
  isPreview: false
  isDeprecated: true
  customDeprecatedMessage: Use `allowConsentPrompt` instead.
  syntax:
    content: 'forceConsent?: boolean;'
    return:
      type: boolean
- name: forMSGraphAccess
  uid: office-runtime!OfficeRuntime.AuthOptions#forMSGraphAccess:member
  package: office-runtime!
  fullName: forMSGraphAccess
  summary: Faz Office retornar um erro descritivo quando o add-in deseja acessar o Microsoft Graph e o usuário/administrador não concedeu consentimento para Graph escopos. O valor padrão é `false`<!-- -->. Office dá suporte apenas ao consentimento para Graph escopos quando o complemento foi implantado por um administrador de locatários. Essas informações não estarão disponíveis durante o desenvolvimento. A configuração dessa opção fará com que Office informe o seu complemento antecipadamente (retornando um erro descritivo) se o acesso Graph `true` falhar.
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'forMSGraphAccess?: boolean;'
    return:
      type: boolean
