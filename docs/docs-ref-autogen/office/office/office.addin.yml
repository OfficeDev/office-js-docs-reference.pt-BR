### YamlMime:TSType
name: Office.Addin
uid: office!Office.Addin:interface
package: office!
fullName: Office.Addin
summary: Representa a funcionalidade de nível de complemento para operar ou configurar vários aspectos do complemento.
remarks: ''
isPreview: false
isDeprecated: false
type: interface
properties:
- name: beforeDocumentCloseNotification
  uid: office!Office.Addin#beforeDocumentCloseNotification:member
  package: office!
  fullName: beforeDocumentCloseNotification
  summary: Representa uma caixa de diálogo de notificação modal que pode aparecer quando o usuário tenta fechar um documento. O documento não será fechado até que o usuário responda.
  remarks: '\[[Conjunto de API: SharedRuntime BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/javascript-api-for-office) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'beforeDocumentCloseNotification: BeforeDocumentCloseNotification;'
    return:
      type: <xref uid="office!Office.BeforeDocumentCloseNotification:interface" />
methods:
- name: getStartupBehavior()
  uid: office!Office.Addin#getStartupBehavior:member(1)
  package: office!
  fullName: getStartupBehavior()
  summary: Obtém o comportamento de inicialização atual do complemento.
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'getStartupBehavior(): Promise<Office.StartupBehavior>;'
    return:
      type: Promise&lt;<xref uid="office!Office.StartupBehavior:enum" />&gt;
      description: ''
- name: hide()
  uid: office!Office.Addin#hide:member(1)
  package: office!
  fullName: hide()
  summary: Oculta o painel de tarefas.
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'hide(): Promise<void>;'
    return:
      type: Promise&lt;void&gt;
      description: Uma promessa que é resolvida quando a interface do usuário está oculta.
- name: onVisibilityModeChanged(handler)
  uid: office!Office.Addin#onVisibilityModeChanged:member(1)
  package: office!
  fullName: onVisibilityModeChanged(handler)
  summary: Adiciona um manipulador para o `onVisibilityModeChanged` evento.
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: >-
      onVisibilityModeChanged(
                  handler: (message: VisibilityModeChangedMessage) => void,
              ): Promise<() => Promise<void>>;
    parameters:
    - id: handler
      description: A função de manipulador que é chamada quando o evento é emitido. Essa função recebe uma mensagem para o componente de recebimento.
      type: '(message: <xref uid="office!Office.VisibilityModeChangedMessage:interface" />) =&gt; void'
    return:
      type: Promise&lt;() =&gt; Promise&lt;void&gt;&gt;
      description: Uma promessa que resolve uma função quando o manipulador é adicionado. Chamá-lo remove o manipulador.
- name: setStartupBehavior(behavior)
  uid: office!Office.Addin#setStartupBehavior:member(1)
  package: office!
  fullName: setStartupBehavior(behavior)
  summary: Define o comportamento de inicialização do complemento para quando o documento for aberto na próxima vez.
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'setStartupBehavior(behavior: Office.StartupBehavior): Promise<void>;'
    parameters:
    - id: behavior
      description: Especifica o comportamento de inicialização do complemento.
      type: <xref uid="office!Office.StartupBehavior:enum" />
    return:
      type: Promise&lt;void&gt;
      description: ''
- name: showAsTaskpane()
  uid: office!Office.Addin#showAsTaskpane:member(1)
  package: office!
  fullName: showAsTaskpane()
  summary: Mostra o painel de tarefas associado ao complemento.
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'showAsTaskpane(): Promise<void>;'
    return:
      type: Promise&lt;void&gt;
      description: Uma promessa que é resolvida quando a interface do usuário é mostrada.
