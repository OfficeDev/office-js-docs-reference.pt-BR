### YamlMime:TSType
name: Office.BeforeDocumentCloseNotification
uid: office!Office.BeforeDocumentCloseNotification:interface
package: office!
fullName: Office.BeforeDocumentCloseNotification
summary: Representa uma caixa de diálogo de notificação modal que pode aparecer quando o usuário tenta fechar um documento. O documento não será fechado até que o usuário responda. A caixa de diálogo de notificação permitirá que o usuário confirme a solicitação para fechar o documento ou cancelar a solicitação para fechar o documento.
remarks: '\[[Conjunto de API: SharedRuntime BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/javascript-api-for-office) \]'
isPreview: true
isDeprecated: false
type: interface
methods:
- name: disable()
  uid: office!Office.BeforeDocumentCloseNotification#disable:member(1)
  package: office!
  fullName: disable()
  summary: Impede que a caixa de diálogo de notificação apareça quando o usuário tenta fechar um documento.
  remarks: '\[[Conjunto de API: SharedRuntime BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/javascript-api-for-office) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'disable(): Promise<void>;'
    return:
      type: Promise&lt;void&gt;
      description: ''
- name: enable()
  uid: office!Office.BeforeDocumentCloseNotification#enable:member(1)
  package: office!
  fullName: enable()
  summary: Habilita uma caixa de diálogo de notificação modal que aparece quando o usuário tenta fechar um documento. O documento não será fechado até que o usuário responda. Essa caixa de diálogo de notificação solicita que o usuário confirme a solicitação para fechar o documento ou permita que o usuário cancele a solicitação para fechar o documento.
  remarks: '\[[Conjunto de API: SharedRuntime BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/javascript-api-for-office) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'enable(): Promise<void>;'
    return:
      type: Promise&lt;void&gt;
      description: ''
- name: onCloseActionCancelled(listener)
  uid: office!Office.BeforeDocumentCloseNotification#onCloseActionCancelled:member(1)
  package: office!
  fullName: onCloseActionCancelled(listener)
  summary: 'Adiciona um manipulador de eventos que detecta quando a `BeforeDocumentCloseNotification` operação de fechamento é cancelada. Esse manipulador de eventos será acionado se uma das seguintes condições for atendida: 1. Quando a caixa de diálogo de notificação é aberta, o usuário final clica no botão Não fechar dentro da caixa de diálogo, clica no botão Fechar no canto superior direito da caixa de diálogo ou pressiona a tecla Esc.  2. Quando o complemento chama o `enable` método no `BeforeDocumentCloseNotification` objeto.'
  remarks: '\[[Conjunto de API: SharedRuntime BETA (SOMENTE VISUALIZAÇÃO)](/office/dev/add-ins/reference/javascript-api-for-office) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: >-
      onCloseActionCancelled(
                  listener: () => void
              ): Promise<() => Promise<void>>;
    parameters:
    - id: listener
      description: O manipulador de eventos chamado quando a caixa de diálogo é cancelada.
      type: () =&gt; void
    return:
      type: Promise&lt;() =&gt; Promise&lt;void&gt;&gt;
      description: Uma promessa que resolve quando o manipulador de eventos é adicionado.
