### YamlMime:TSEnum
name: Office. FileType
uid: office!Office.FileType:enum
package: office!
fullName: Office.FileType
summary: Especifica o formato no qual o documento deve ser retornado.
remarks: ''
isPreview: false
isDeprecated: false
fields:
- name: Compactado
  uid: office!Office.FileType.Compressed:member
  package: office!
  summary: >-
    Retorna todo o documento (.pptx, .docx, .xlsx ou .xlsm) no formato Office Open XML (OOXML) como uma matriz de byte.


    Observação: o tipo de arquivo .xslm é suportado no Excel no Windows e no Mac. Não há suporte no Excel na Web. Em Excel no Windows, as fatias `getFileAsync` de arquivo do método incluem os arquivos de assinatura do VBA para tipos de arquivo .xslm. Os arquivos de assinatura do VBA são vbaProjectSignature.bin, vbaProbjectSignatureAgile.bin e vbaProjectSignatureV3.bin. No Excel no Mac, as fatias `getFileAsync` de arquivo do método não incluem os arquivos de assinatura do VBA, porque essa plataforma não dá suporte ao recurso de assinatura do VBA.
- name: Pdf
  uid: office!Office.FileType.Pdf:member
  package: office!
  summary: Retorna todo o documento no formato PDF como uma matriz de bytes.
- name: Texto
  uid: office!Office.FileType.Text:member
  package: office!
  summary: Retorna apenas o texto do documento como uma cadeia de caracteres.
