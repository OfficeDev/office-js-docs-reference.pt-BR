name: Office.AddinCommands.EventCompletedOptions
uid: office!Office.AddinCommands.EventCompletedOptions:interface
package: office!
fullName: Office.AddinCommands.EventCompletedOptions
summary: Especifica o comportamento para quando o evento é concluído.
remarks: ''
isPreview: false
isDeprecated: false
type: interface
properties:
- name: allowEvent
  uid: office!Office.AddinCommands.EventCompletedOptions#allowEvent:member
  package: office!
  fullName: allowEvent
  summary: Um valor booleano. Quando o método concluído é usado para sinalizar a conclusão de um manipulador de eventos, esse valor indica se o evento manipulado deve continuar a execução ou ser cancelado. Por exemplo, um complemento que lida com o `ItemSend` evento pode definir `allowEvent` como `false` cancelar o envio da mensagem.
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'allowEvent: boolean;'
    return:
      type: boolean
- name: errorMessage
  uid: office!Office.AddinCommands.EventCompletedOptions#errorMessage:member
  package: office!
  fullName: errorMessage
  summary: >-
    Um valor de cadeia de caracteres. Quando o método concluído é usado para sinalizar a conclusão de um manipulador de eventos e se `allowEvent` a opção estiver definida como `false`<!-- -->, esse valor define a mensagem de erro que será exibida para o usuário. Para um exemplo, consulte [o passo a passo alertas inteligentes](https://docs.microsoft.com/office/dev/add-ins/outlook/smart-alerts-onmessagesend-walkthrough)<!-- -->.


    \[[Conjunto de API: Visualização de caixa de correio](/office/dev/add-ins/reference/javascript-api-for-office) \]
  remarks: ''
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'errorMessage?: string;'
    return:
      type: string
